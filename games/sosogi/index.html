<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぴったり そそぎ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #fff4e0; }
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; pointer-events: none; z-index: 3; }
  .pill { background: rgba(255,255,255,.88); color: #5a3412; border-radius: 99px; padding: 4px 12px; font: 900 1rem 'Zen Maru Gothic', sans-serif; box-shadow: 0 2px 0 rgba(90,52,18,.18); white-space: nowrap; }
  .pill b { font: 400 1.15rem 'Dela Gothic One', sans-serif; }
  .order { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); z-index: 3; pointer-events: none; background: #fff; border: 3px solid #5a3412; border-radius: 16px; padding: 6px 14px; font: 900 1rem 'Zen Maru Gothic', sans-serif; color: #5a3412; white-space: nowrap; text-align: center; box-shadow: 0 4px 0 rgba(90,52,18,.25); }
  .order small { display: block; font-size: .8rem; color: #a0703a; }
  .tip { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3; pointer-events: none; background: rgba(90,52,18,.82); color: #fff; font: 900 .95rem 'Zen Maru Gothic', sans-serif; border-radius: 99px; padding: 7px 16px; white-space: nowrap; transition: opacity .3s; }
  .tip.off { opacity: 0; }
  .done { position: absolute; right: 12px; bottom: calc(60px + env(safe-area-inset-bottom)); z-index: 4; appearance: none; border: 4px solid #fff; border-radius: 99px; padding: 10px 18px; font: 900 1.1rem 'Zen Maru Gothic', sans-serif; color: #fff; background: linear-gradient(135deg, #4ade80, #16a34a); box-shadow: 0 4px 0 #0f7a36; cursor: pointer; }
  .done[hidden] { display: none; }
  .judge { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0); z-index: 4; pointer-events: none; text-align: center; opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
  .judge.on { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
  .judge b { display: block; font: 400 clamp(2rem, 11vw, 3rem) 'Dela Gothic One', sans-serif; color: #ff7a1a; -webkit-text-stroke: 2px #5a2a00; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .judge span { display: inline-block; white-space: nowrap; font-size: .95rem !important; margin-top: 4px; background: #fff; color: #5a3412; border-radius: 99px; padding: 4px 14px; font: 900 1.05rem 'Zen Maru Gothic', sans-serif; box-shadow: 0 3px 0 rgba(90,52,18,.25); }
  .over { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 14px; overflow: auto; background: rgba(90,52,18,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .over[hidden] { display: none; }
  .card { width: min(420px, 100%); background: #fffaf2; color: #5a3412; border-radius: 26px; padding: 18px 16px; display: grid; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .card h2 { margin: 0; text-align: center; font: 400 2rem 'Dela Gothic One', sans-serif; color: #ff8a1f; -webkit-text-stroke: 1.5px #5a2a00; }
  .card p { margin: 0; line-height: 1.7; font-weight: 700; font-size: .95rem; }
  .how { margin: 0; padding-left: 1.2em; line-height: 1.8; font-size: .92rem; font-weight: 700; }
  .btn { appearance: none; border: none; border-radius: 14px; font: 900 1.1rem 'Zen Maru Gothic', sans-serif; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); background: #fff; color: #5a3412; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .btn.main { background: linear-gradient(135deg, #ffb13d, #ff6a2c); color: #fff; box-shadow: 0 4px 0 #c2410c; }
  .row { display: flex; gap: 8px; } .row .btn { flex: 1; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chips button { appearance: none; border: 3px solid #f0dcc0; background: #fff; border-radius: 14px; padding: 8px 2px; font: 900 .95rem 'Zen Maru Gothic', sans-serif; color: #5a3412; cursor: pointer; }
  .chips button big { display: block; font-size: 1.3rem; letter-spacing: -2px; }
  .chips button.on { border-color: #ff7a1a; background: #fff1e0; box-shadow: 0 0 0 2px #ff7a1a inset; }
  .lbl { font-weight: 900; font-size: .9rem; color: #a0703a; }
  .best { text-align: center; font-weight: 900; color: #a0703a; }
  .big { text-align: center; font: 400 3.4rem 'Dela Gothic One', sans-serif; line-height: 1; }
  .ttl { text-align: center; font: 400 1.6rem 'Dela Gothic One', sans-serif; color: #ff7a1a; }
  .rank { display: grid; gap: 6px; }
  .rank div { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 6px; background: #fff; border-radius: 14px; padding: 8px 10px; box-shadow: 0 2px 0 #f0dcc0; font-weight: 900; }
  .rank div.top { background: linear-gradient(180deg, #fff6c8, #ffe066); }
  .rank i { font-style: normal; font-size: 1.4rem; }
  .rank b { font: 400 1.4rem 'Dela Gothic One', sans-serif; color: #ff7a1a; }
  .hist { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; font-weight: 900; font-size: .85rem; color: #a0703a; }
  .hist span { background: #fff; border-radius: 8px; padding: 2px 6px; }
  .turn { text-align: center; font: 400 3.6rem/1.1 'Dela Gothic One', sans-serif; }
  .modes { display: grid; gap: 8px; }
  .modes .btn { display: grid; grid-template-columns: 2.2em 1fr; align-items: center; text-align: left; gap: 8px; padding: 10px 14px; }
  .modes .btn i { font-style: normal; font-size: 1.7rem; text-align: center; }
  .modes .btn small { display: block; font-size: .78rem; opacity: .85; }
  .chips.two { grid-template-columns: 1fr 1fr; }
  .chips.three { grid-template-columns: repeat(3, 1fr); }
  .stg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .stg button { appearance: none; border: 3px solid #f0dcc0; background: #fff; border-radius: 14px; padding: 6px 2px; font: 900 .78rem 'Zen Maru Gothic', sans-serif; color: #5a3412; cursor: pointer; line-height: 1.25; min-height: 76px; word-break: keep-all; }
  .stg button b { display: block; font: 400 1.3rem 'Dela Gothic One', sans-serif; color: #ff7a1a; }
  .stg button em { display: block; font-style: normal; color: #f5a400; letter-spacing: 1px; }
  .stg button:disabled { opacity: .45; cursor: default; }
  .stars { text-align: center; font-size: 2.6rem; color: #f5a400; letter-spacing: 4px; text-shadow: 0 3px 0 rgba(90,52,18,.2); }
  .stars s { text-decoration: none; color: #e6d6bf; }
  .handBtn { justify-self: center; padding: 8px 16px !important; font-size: .95rem !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden><span class="pill" id="hL"></span><span class="pill" id="hR"></span></div>
  <div class="order" id="order" hidden></div>
  <div class="judge" id="judge"><b id="jA"></b><span id="jB"></span></div>
  <button class="done" id="doneBtn" hidden>できた！</button>
  <div class="tip off" id="tip"></div>
  <div class="over" id="menuOv"><div class="card">
    <h2>ぴったり そそぎ</h2>
    <p>スマホを ジュースの ビンだと おもって かたむけよう。コップの <b style="color:#e11d48">せん</b> まで ぴったり そそげるかな？</p>
    <div class="lbl">スマホを もつ 手は？</div>
    <div class="chips two" id="hChips"></div>
    <div class="lbl">あそびかた</div>
    <div class="modes">
      <button class="btn main" id="mStage"><i>⭐</i><span>ステージ<small>12この ステージ。★を 3つ あつめよう</small></span></button>
      <button class="btn" id="mParty"><i>🎉</i><span>みんなで<small>2〜4人で スマホを わたして しょうぶ</small></span></button>
      <button class="btn" id="mCafe"><i>☕</i><span>カフェ タイム<small>60びょうで どれだけ おきゃくさんに だせるかな</small></span></button>
    </div>
    <div class="best" id="mBest"></div>
  </div></div>
  <div class="over" id="stOv" hidden><div class="card">
    <h2 style="font-size:1.6rem">ステージ</h2>
    <div class="stg" id="stGrid"></div>
    <button class="btn" id="stBack">もどる</button>
  </div></div>
  <div class="over" id="ptOv" hidden><div class="card">
    <h2 style="font-size:1.6rem">みんなで</h2>
    <p>5かい しょうぶ。じゅんばんに スマホを わたして、ぴったりを きそおう。</p>
    <div class="lbl">なん人？</div>
    <div class="chips three" id="pChips"></div>
    <div class="row"><button class="btn" id="ptBack">もどる</button><button class="btn main" id="ptGo">はじめる！</button></div>
  </div></div>
  <div class="over" id="turnOv" hidden><div class="card" style="text-align:center">
    <div class="lbl" id="tRound"></div>
    <div class="turn" id="tWho"></div>
    <p id="tMsg"></p>
    <button class="btn handBtn" id="tHand"></button>
    <button class="btn main" id="tGo">はじめる！</button>
  </div></div>
  <div class="over" id="resOv" hidden><div class="card" id="resCard"></div></div>
</div>
<script src="../../common/kit.js"></script>
<script src="../../common/tilt.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const snd = () => Kit.settings.sound;

/* ---------- きまり ---------- */
const DRINKS = {
  orange: { n: 'オレンジジュース', s: 'オレンジ', c: '#ff9a1f', c2: '#ffc252', lab: '#ff7a00', k: 1 },
  apple: { n: 'りんごジュース', s: 'りんご', c: '#f0c02a', c2: '#ffe27a', lab: '#e23b3b', k: 1 },
  milk: { n: 'ぎゅうにゅう', s: 'ミルク', c: '#f6f3ec', c2: '#ffffff', lab: '#2f7fe0', k: .85 },
  grape: { n: 'ぶどうジュース', s: 'ぶどう', c: '#7b2d8e', c2: '#a957c2', lab: '#6a1f80', k: 1 },
  soda: { n: 'ソーダ', s: 'ソーダ', c: '#7fd0ff', c2: '#c4ecff', lab: '#1aa0e0', k: 1.05, foam: 1 },
  tea: { n: 'むぎちゃ', s: 'むぎちゃ', c: '#b8742a', c2: '#dba05a', lab: '#7a4a1a', k: 1.25 },
};
const CUPS = {
  cup: { n: 'コップ', wb: 108, wt: 128, h: 170 },
  glass: { n: 'ほそい グラス', wb: 62, wt: 72, h: 210 },
  cone: { n: 'さんかく グラス', wb: 26, wt: 156, h: 150, stem: 1 },
  jug: { n: 'ジョッキ', wb: 136, wt: 136, h: 180, handle: 1 },
  small: { n: 'ちいさい コップ', wb: 78, wt: 94, h: 96 },
};
// L：[のみもの, せんの たかさ]。ならべると かさねて そそぐ
const STAGES = [
  { n: 'はじめての ジュース', T: [{ cup: 'cup', L: [['orange', .6]] }] },
  { n: 'たっぷり りんご', T: [{ cup: 'cup', L: [['apple', .82]] }] },
  { n: 'ほそい グラス', T: [{ cup: 'glass', L: [['milk', .7]] }] },
  { n: 'しゅわしゅわ ソーダ', T: [{ cup: 'jug', L: [['soda', .62]] }] },
  { n: 'さんかく グラス', T: [{ cup: 'cone', L: [['grape', .7]] }] },
  { n: 'うごく コップ', T: [{ cup: 'cup', L: [['orange', .65]], move: 55 }] },
  { n: 'ふたいろ ジュース', T: [{ cup: 'cup', L: [['apple', .4], ['grape', .78]] }] },
  { n: 'かくれる せん', T: [{ cup: 'glass', L: [['apple', .66]], hide: 1 }] },
  { n: '3つ れんぞく', T: [{ cup: 'small', L: [['tea', .6]] }, { cup: 'small', L: [['orange', .8]] }, { cup: 'small', L: [['milk', .5]] }] },
  { n: 'うごく ジョッキ', T: [{ cup: 'jug', L: [['soda', .6]], move: 45 }] },
  { n: 'にじいろ 3だん', T: [{ cup: 'glass', L: [['grape', .3], ['orange', .58], ['soda', .85]] }] },
  { n: 'さいごの ちょうせん', T: [{ cup: 'cone', L: [['milk', .72]], move: 40, hide: 1 }] },
];
const PLAYERS = ['🐶', '🐱', '🐰', '🐼'];
const GUESTS = ['🐻', '🦊', '🐸', '🐨', '🐯', '🐷', '🐵', '🐔', '🦁', '🐧'];
const PARTY_ROUNDS = 5, CAFE_SEC = 60;
const FLOW = 6800;          // いちばん たくさん でる とき（1びょう）
const GRAV = 1500;
const r2 = v => Math.round(v * 100) / 100;
const pickD = (no) => Kit.pick(Object.keys(DRINKS).filter(k => k !== no));

/* ---------- がめん ---------- */
let VW = 400, VH = 700, SC = 1, OX = 0, dpr = 1;
function resize() {
  const r = stage.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1);
  SC = Math.min(r.width / 400, r.height / 640); VW = r.width / SC; VH = r.height / SC; OX = (VW - 400) / 2;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
}
addEventListener('resize', resize);

/* ---------- じょうたい ---------- */
let HAND = Kit.store.get('sosogi:hand', 'R');          // R：右手で もって 左に かたむける
let NP = Math.max(2, Kit.store.get('sosogi:np', 2));
let stars = Kit.store.get('sosogi:stars', []);
let S = { phase: 'menu' };
const counterY = () => VH - 70;
function cupGeo() { const c = S.cup, x = S.cupX || 200, by = counterY() - (c.stem ? 34 : 0); return { x, by, ty: by - c.h, ...c }; }
const wAt = (c, y) => c.wb + (c.wt - c.wb) * y / c.h;
const volAt = (c, y) => c.wb * y + (c.wt - c.wb) * y * y / (2 * c.h);
function lvlOf(c, V) { if (V <= 0) return 0; const a = (c.wt - c.wb) / (2 * c.h); if (Math.abs(a) < 1e-6) return V / c.wb; return (-c.wb + Math.sqrt(c.wb * c.wb + 4 * a * V)) / (2 * a); }
const handNow = () => S.mode === 'party' && S.hands ? S.hands[S.pi] : HAND;
const sideOf = h => h === 'R' ? -1 : 1;   // ビンが ある むきの はんたい（そそぐ むき）
const tiltWord = () => S.side < 0 ? 'ひだり' : 'みぎ';

/* ---------- ステージ・あそびかた ---------- */
function baseState(mode) {
  S = { phase: 'turn', mode, pi: 0, round: 0, score: 0, res: [], cupX: 200, side: sideOf(HAND) };
}
function beginTask(task) {
  S.task = task; S.cup = CUPS[task.cup]; S.cupX = 200; S.mt = Math.random() * 6;
  Object.assign(S, { V: 0, foam: 0, last: null, layers: [], li: 0, packets: [], drops: [], puddle: 0, pa: 0, slosh: 0, sloshV: 0, glugT: 0, t: 0, timeUp: false });
  S.side = sideOf(handNow());
  startLayer();
}
function startLayer() {
  const [d, t] = S.task.L[S.li];
  S.dk = d; S.drink = DRINKS[d]; S.target = t;
  S.layers.push({ d, V: 0 });
  Object.assign(S, { foam: S.foam || 0, spill: 0, foamSpill: 0, poured: 0, ready: false, want: false, still: 0, hideT: 0, toldStraight: false, phase: 'pour', judged: false });
  orderBox(); hud();
}
function startStage(n) {
  baseState('stage'); S.sn = n; S.ti = 0;
  beginTask(STAGES[n].T[0]); showTurn();
}
function partyTasks() {
  const t = (a, b) => r2(Kit.rand(a, b));
  const d1 = pickD('soda'), d2 = pickD(d1);
  return Kit.shuffle([
    { cup: Kit.pick(['cup', 'small']), L: [[pickD('soda'), t(.5, .82)]] },
    Math.random() < .5 ? { cup: 'cone', L: [[pickD('soda'), t(.5, .78)]] } : { cup: 'jug', L: [['soda', t(.5, .66)]] },
    { cup: 'glass', L: [[pickD(), t(.5, .8)]], hide: 1 },
  ]).concat([
    { cup: 'cup', L: [[d1, t(.3, .45)], [d2, t(.65, .85)]] },
    { cup: Kit.pick(['cup', 'jug']), L: [[pickD('soda'), t(.5, .75)]], move: 45 },
  ]);
}
function startParty() {
  baseState('party'); S.np = NP; S.scores = Array(NP).fill(0); S.hands = Array(NP).fill(HAND);
  S.tasks = partyTasks();
  beginTask(S.tasks[0]); showTurn();
}
function cafeTask() {
  const n = S.served || 0, cup = Kit.pick(Object.keys(CUPS));
  const d = cup === 'jug' && Math.random() < .5 ? 'soda' : pickD();
  const task = { cup, L: [[d, r2(Kit.rand(.45, cup === 'cone' ? .8 : .85))]], guest: Kit.pick(GUESTS) };
  if (n >= 2 && Math.random() < .35) task.move = Kit.pick([30, 40, 50]);
  else if (n >= 4 && Math.random() < .25) task.hide = 1;
  return task;
}
function startCafe() {
  baseState('cafe'); S.timeLeft = CAFE_SEC; S.served = 0; S.combo = 0; S.maxCombo = 0;
  beginTask(cafeTask()); showTurn();
}

function showTurn() {
  S.phase = 'turn';
  $('hud').hidden = false; $('order').hidden = true; $('doneBtn').hidden = true; tip('');
  const m = S.mode;
  if (m === 'stage') {
    $('tRound').textContent = `ステージ ${S.sn + 1}`;
    $('tWho').textContent = STAGES[S.sn].n; $('tWho').style.fontSize = '2rem';
    const T = STAGES[S.sn].T, t0 = T[0];
    $('tMsg').textContent = T.length > 1 ? `コップが ${T.length}こ。じゅんばんに そそごう` : t0.L.length > 1 ? `${t0.L.map(l => DRINKS[l[0]].s).join(' → ')} の じゅんに かさねよう` : t0.move ? 'コップが うごくよ。タイミングを あわせて！' : t0.hide ? 'そそぎはじめると せんが きえるよ。おぼえておこう' : DRINKS[t0.L[0][0]].foam ? 'ソーダは あわに 気をつけて！' : `スマホを たてて もち、${tiltWord()}に かたむけると そそげるよ`;
  } else if (m === 'party') {
    $('tRound').textContent = `${S.round + 1} / ${PARTY_ROUNDS} かいめ　${S.cup.n}${S.task.move ? '（うごく）' : ''}${S.task.hide ? '（せんが きえる）' : ''}`;
    $('tWho').textContent = `${PLAYERS[S.pi]}さんの ばん`; $('tWho').style.fontSize = '';
    $('tMsg').textContent = `スマホを うけとったら おしてね（${tiltWord()}に かたむけると そそげる）`;
  } else {
    $('tRound').textContent = `${CAFE_SEC}びょうの しょうぶ`;
    $('tWho').textContent = '☕ カフェ タイム'; $('tWho').style.fontSize = '2rem';
    $('tMsg').textContent = 'おきゃくさんが つぎつぎ くるよ。80てん いじょうが つづくと コンボで ボーナス！';
  }
  handBtn();
  $('turnOv').hidden = false; hud();
}
function handBtn() { const h = handNow(); $('tHand').textContent = h === 'R' ? '✋ みぎてで もつ（かえる）' : '🤚 ひだりてで もつ（かえる）'; }
$('tHand').onclick = () => {
  Kit.sfx('tap'); const h = handNow() === 'R' ? 'L' : 'R';
  if (S.mode === 'party') S.hands[S.pi] = h; else { HAND = h; Kit.store.set('sosogi:hand', h); }
  S.side = sideOf(h); handBtn(); showTurn();
};
$('tGo').onclick = () => {
  Kit.sfx('tap'); Kit.audio(); Tilt.start({ lock: true }); $('turnOv').hidden = true;
  S.side = sideOf(handNow()); S.phase = 'pour'; S.ready = false; S.t = 0; S.toldStraight = false;
  orderBox();
  tip(Tilt.ok ? `スマホを たてて もち、${tiltWord()}に かたむけよう` : 'センサーが ないので、おしている あいだ かたむくよ', 3000);
};
function orderBox() {
  const T = S.task; if (!T) return;
  const lines = T.L.length > 1 ? `<small>${T.L.map((l, i) => `<span style="${i === S.li ? 'color:#e11d48' : i < S.li ? 'opacity:.45' : ''}">${'①②③'[i]}${DRINKS[l[0]].s}</span>`).join(' → ')}</small>` : `<small>${S.cup.n}${T.move ? '・うごく' : ''}${T.hide ? '・せんが きえる' : ''}</small>`;
  $('order').innerHTML = `${T.guest ? `<span style="font-size:1.5rem">${T.guest}</span> ` : ''}${S.drink.n}を <b style="color:#e11d48">せん</b> まで！${lines}`;
  $('order').hidden = S.phase !== 'pour' && S.phase !== 'judge';
}
function hud() {
  const m = S.mode;
  if (m === 'stage') {
    const n = STAGES[S.sn].T.length;
    $('hL').innerHTML = `ステージ <b>${S.sn + 1}</b>${n > 1 ? `　${S.ti + 1}/${n}こめ` : ''}`;
    $('hR').innerHTML = `<b>${S.score}</b> てん`;
  } else if (m === 'party') {

let tipT = 0;

/* ---------- センサーが ない とき：おしている あいだ かたむく ---------- */
let holdDir = 0, manRoll = 0;

stage.addEventListener('pointerdown', e => { if (S.phase !== 'pour' || Tilt.ok || e.target.closest('button')) return; holdDir = 1; });
addEventListener('pointerup', () => { holdDir = 0; }); addEventListener('pointercancel', () => { holdDir = 0; });
addEventListener('keydown', e => { if (Tilt.ok) return; if (KEYS.includes(e.code)) holdDir = 1; });
addEventListener('keyup', e => { if (KEYS.includes(e.code)) holdDir = 0; });
$('doneBtn').onclick = () => { if (S.phase === 'pour' && curV() > 0) { S.want = true; Kit.sfx('tap'); } };

/* ---------- まいフレーム ---------- */
let lastT = performance.now();

}

/* ---------- はんてい ---------- */

/* ---------- えがく ---------- */
