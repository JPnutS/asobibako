<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いろあわせ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .stage { flex: 1; position: relative; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; font-weight: 900; }
  .hud .box { background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 2px 12px; }
  .hud .k-btn { pointer-events: auto; }
  .over { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--paper) 70%, transparent); }
  .over .k-card { width: min(440px, 100%); }
  .hint { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; font-weight: 900; color: var(--muted); font-size: 2rem; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="box"><span class="k-num" id="score">0</span> 点 <small id="lv"></small></div>
    <div class="box" id="hearts"></div>
    <button class="k-btn k-icon" id="pauseBtn" aria-label="一時停止">⏸</button>
  </div>
  <div class="hint" id="hint" hidden><span>⟲</span><span>⟳</span></div>
  <div class="over" id="startOv">
    <div class="k-card k-stack k-center">
      <h2>🌈 いろあわせ</h2>
      <p style="margin:0">まん中の ボールをまわして、とんでくる ブロックと <b>同じ色・同じ形</b> でキャッチしよう！</p>
      <p class="k-muted" style="margin:0">左がわタップで ⟲、右がわタップで ⟳<br>⭐はどの色でもOK、💖はハートがふえるよ</p>
      <span class="k-label">むずかしさ</span>
      <div class="k-chips" id="optLv" style="justify-content:center"></div>
      <p class="k-muted" id="bestLine" style="margin:0"></p>
      <button class="k-btn is-sun is-big" id="startBtn">スタート</button>
    </div>
  </div>
  <div class="over" id="pauseOv" hidden>
    <div class="k-card k-stack k-center">
      <h2>ひとやすみ</h2>
      <button class="k-btn is-sun is-big" id="resume">つづける</button>
      <button class="k-btn" id="giveup">やめる</button>
    </div>
  </div>
  <div class="over" id="endOv" hidden>
    <div class="k-card k-stack k-center" id="endCard"></div>
  </div>
</div>

<script src="../../common/kit.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv');
let W = 0, H = 0, g = null;
const PAL = [
  { c: '#ff5d8f', s: 'circle' }, { c: '#3d8bff', s: 'tri' }, { c: '#ffc93c', s: 'square' }, { c: '#2fb862', s: 'star' },
];
const LEVELS = { 1: { name: 'やさしい', speed: 80, gap: 2.0 }, 2: { name: 'ふつう', speed: 115, gap: 1.5 }, 3: { name: 'むずかしい', speed: 150, gap: 1.15 } };
let diff = Kit.store.get('colors:diff', 1);
let S = null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function resize() { ({ w: W, h: H, g } = Kit.fitCanvas(cv)); if (!S || !loop.running) draw(); }
addEventListener('resize', resize);

function renderStart() {
  const root = $('optLv'); root.innerHTML = '';
  Object.entries(LEVELS).forEach(([k, v]) => {
    const b = Kit.el(`<button class="k-chip" aria-pressed="${+k === diff}">${v.name}</button>`);
    b.onclick = () => { diff = +k; Kit.store.set('colors:diff', diff); Kit.sfx('select'); renderStart(); };
    root.appendChild(b);
  });
  const best = Kit.store.get(`colors:best${diff}`, 0);
  $('bestLine').textContent = best ? `このむずかしさのベスト：${best}点` : '';
}

function newGame() {
  S = { rot: 0, ang: 0, packets: [], parts: [], floats: [], score: 0, combo: 0, caught: 0, hearts: 3, level: 1,
    spawnT: 0.6, shake: 0, flash: 0, t: 0 };
  ['startOv', 'endOv', 'pauseOv'].forEach(id => $(id).hidden = true);
  $('hud').hidden = false; $('hint').hidden = false;
  paintHud();
  Kit.music.play({ bpm: 132, lead: [523, 0, 659, 0, 784, 0, 659, 0, 587, 0, 698, 0, 880, 0, 698, 0], bass: [131, 0, 0, 0, 175, 0, 0, 0], vol: 0.03 });
  loop.start();
}
const facing = d => (d - S.rot % 4 + 8) % 4;

function spawn() {
  const L = LEVELS[diff];
  const busy = new Set(S.packets.filter(p => p.dist > Math.min(W, H) * 0.42).map(p => p.dir));
  const dirs = [0, 1, 2, 3].filter(d => !busy.has(d));
  if (!dirs.length) return;
  const r = Math.random();
  const type = r < 0.06 ? 'star' : (r < 0.09 && S.hearts < 5) ? 'heart' : 'normal';
  const maxD = Math.hypot(W, H) / 2 + 30;
  S.packets.push({ dir: Kit.pick(dirs), col: Kit.randInt(0, 3), dist: maxD, speed: L.speed * (1 + (S.level - 1) * 0.09), type });
}

function update(dt) {
  if (!S) return;
  S.t += dt;
  const L = LEVELS[diff];
  // まわる動きをなめらかに
  const target = S.rot * Math.PI / 2;
  S.ang += (target - S.ang) * Math.min(1, dt * 18);
  S.spawnT -= dt;
  if (S.spawnT <= 0) { spawn(); S.spawnT = Math.max(0.45, L.gap - (S.level - 1) * 0.1) * Kit.rand(0.85, 1.2); }
  const R = coreR();
  for (const p of S.packets) p.dist -= p.speed * dt;
  const hit = S.packets.filter(p => p.dist <= R + 16);
  S.packets = S.packets.filter(p => p.dist > R + 16);
  hit.forEach(resolve);
  S.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; });
  S.parts = S.parts.filter(p => p.life > 0);
  S.floats.forEach(f => { f.y -= 40 * dt; f.life -= dt; });
  S.floats = S.floats.filter(f => f.life > 0);
  S.shake = Math.max(0, S.shake - dt * 30);
  S.flash = Math.max(0, S.flash - dt * 3);
  draw();
}
function dirVec(d) { return [[0, -1], [1, 0], [0, 1], [-1, 0]][d]; }
function coreR() { return Math.min(W, H) * 0.13 + 14; }
function resolve(p) {
  const [vx, vy] = dirVec(p.dir), R = coreR();
  const x = W / 2 + vx * R, y = H / 2 + vy * R;
  const ok = p.type === 'star' || p.type === 'heart' || p.col === facing(p.dir);
  if (ok) {
    S.combo++; S.caught++;
    const mult = 1 + Math.floor(S.combo / 5);
    const pts = (p.type === 'star' ? 30 : 10) * mult;
    S.score += pts;
    if (p.type === 'heart') { S.hearts = Math.min(5, S.hearts + 1); Kit.sfx('coin'); }
    else Kit.sfx(p.type === 'star' ? 'coin' : 'good');
    burst(x, y, p.type === 'normal' ? PAL[p.col].c : '#ffc93c', 14);
    S.floats.push({ x, y: y - 10, text: p.type === 'heart' ? '💖+1' : `+${pts}`, life: 0.8 });
    if (S.caught % 10 === 0) { S.level++; Kit.sfx('win'); S.floats.push({ x: W / 2, y: H / 2 - coreR() - 40, text: `レベル ${S.level}！`, life: 1.4 }); }
  } else {
    S.combo = 0; S.hearts--; S.shake = 10; S.flash = 1;
    Kit.sfx('bad'); Kit.vibrate(80);
    burst(x, y, '#888', 10);
    if (S.hearts <= 0) return gameOver();
  }
  paintHud();
}
function burst(x, y, c, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = Kit.rand(60, 220); S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c, life: Kit.rand(.3, .7) }); } }
function paintHud() {
  $('score').textContent = S.score; $('lv').textContent = `Lv${S.level}`;
  $('hearts').textContent = '❤️'.repeat(Math.max(0, S.hearts)) + '🤍'.repeat(Math.max(0, 3 - S.hearts));
}

/* ---------- 絵 ---------- */
function shape(x, y, r, s, fill) {
  g.fillStyle = fill; g.beginPath();
  if (s === 'circle') g.arc(x, y, r, 0, Math.PI * 2);
  else if (s === 'square') g.rect(x - r * .85, y - r * .85, r * 1.7, r * 1.7);
  else if (s === 'tri') { g.moveTo(x, y - r * 1.05); g.lineTo(x + r, y + r * .75); g.lineTo(x - r, y + r * .75); g.closePath(); }
  else { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r * 1.1; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }
  g.fill();
}
function draw() {
  if (!g) return;
  const ink = css('--line') || '#2a2238', paper = css('--paper') || '#fff6dc', soft = css('--soft') || '#eee';
  g.save();
  g.fillStyle = paper; g.fillRect(0, 0, W, H);
  if (S && S.shake) g.translate(Kit.rand(-S.shake, S.shake), Kit.rand(-S.shake, S.shake));
  const cx = W / 2, cy = H / 2, R = coreR();
  // 4本のレーン
  g.strokeStyle = soft; g.lineWidth = 40; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, H); g.moveTo(0, cy); g.lineTo(W, cy); g.stroke();
  if (S) {
    // ブロック
    for (const p of S.packets) {
      const [vx, vy] = dirVec(p.dir); const x = cx + vx * p.dist, y = cy + vy * p.dist, s = 22;
      g.fillStyle = ink; roundRect(x - s, y - s + 4, s * 2, s * 2, 10); g.fill();
      g.fillStyle = p.type === 'normal' ? PAL[p.col].c : '#fff'; roundRect(x - s, y - s, s * 2, s * 2, 10); g.fill();
      g.lineWidth = 3; g.strokeStyle = ink; g.stroke();
      if (p.type === 'normal') shape(x, y, 10, PAL[p.col].s, '#ffffff');
      else { g.font = '24px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.type === 'star' ? '⭐' : '💖', x, y + 1); }
    }
  }
  // まん中のボール
  const ang = S ? S.ang : 0;
  g.save(); g.translate(cx, cy);
  g.fillStyle = ink; g.beginPath(); g.arc(0, 5, R + 4, 0, Math.PI * 2); g.fill();
  g.rotate(ang);
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 2;
    g.fillStyle = PAL[i].c; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, a - Math.PI / 4, a + Math.PI / 4); g.closePath(); g.fill();
    g.save(); g.rotate(i * Math.PI / 2); g.translate(0, -R * 0.6); g.rotate(-i * Math.PI / 2 - ang); shape(0, 0, R * 0.17, PAL[i].s, '#fff'); g.restore();
  }
  g.strokeStyle = ink; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.stroke();
  for (let i = 0; i < 4; i++) { const a = -Math.PI / 4 + i * Math.PI / 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * R, Math.sin(a) * R); g.stroke(); }
  g.fillStyle = paper; g.beginPath(); g.arc(0, 0, R * 0.22, 0, Math.PI * 2); g.fill(); g.stroke();
  g.restore();
  if (S) {
    S.parts.forEach(p => { g.globalAlpha = Math.max(0, p.life * 1.6); g.fillStyle = p.c; g.fillRect(p.x - 4, p.y - 4, 8, 8); });
    g.globalAlpha = 1;
    g.font = '900 22px "Zen Maru Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    S.floats.forEach(f => { g.globalAlpha = Math.min(1, f.life * 2); g.fillStyle = ink; g.fillText(f.text, f.x, f.y); });
    g.globalAlpha = 1;
    if (S.flash) { g.fillStyle = `rgba(255, 60, 90, ${S.flash * 0.25})`; g.fillRect(-20, -20, W + 40, H + 40); }
  }
  g.restore();
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

const loop = Kit.loop(update);

/* ---------- そうさ ---------- */
function turn(dir) { if (!S || !loop.running) return; S.rot += dir; Kit.sfx('tick'); }
$('stage').addEventListener('pointerdown', e => {
  if (e.target.closest('button') || !loop.running) return;
  const r = cv.getBoundingClientRect();
  turn(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) turn(-1);
  else if (['ArrowRight', 'd', 'D'].includes(e.key)) turn(1);
  else if ((e.key === ' ' || e.key === 'Enter') && !$('startOv').hidden) newGame();
  else if (e.key === 'Escape' || e.key === 'p') pause();
});
function pause() { if (!S || !loop.running) return; loop.stop(); Kit.music.stop(); $('pauseOv').hidden = false; }
$('pauseBtn').onclick = pause;
$('resume').onclick = () => { $('pauseOv').hidden = true; loop.start(); Kit.music.play(Kit.music.opts); };
$('giveup').onclick = () => { $('pauseOv').hidden = true; gameOver(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
$('startBtn').onclick = newGame;

function gameOver() {
  loop.stop(); Kit.music.stop(); Kit.sfx('lose');
  const key = `colors:best${diff}`, prev = Kit.store.get(key, 0), isNew = S.score > prev;
  if (isNew) { Kit.store.set(key, S.score); Kit.confetti(); }
  Kit.best('colors', S.score);
  $('hud').hidden = true; $('hint').hidden = true;
  $('endCard').innerHTML = `<h2>ゲームオーバー</h2>
    <div style="font-family:var(--display);font-size:3rem" class="k-num">${S.score}点</div>
    <p style="margin:0">${isNew ? '🏆 じこベスト こうしん！' : `ベスト ${prev}点`}　キャッチ ${S.caught}こ・レベル ${S.level}</p>
    <button class="k-btn is-sun is-big" id="again">もう一回</button>
    <button class="k-btn" id="toStart">むずかしさをかえる</button>`;
  $('endOv').hidden = false;
  $('again').onclick = newGame;
  $('toStart').onclick = () => { $('endOv').hidden = true; S = null; draw(); renderStart(); $('startOv').hidden = false; };
}

Kit.bar({ id: 'colors', title: '🌈 いろあわせ', help: `
  <p>まん中のボールは4色にわかれています。外からとんでくるブロックと、<b>同じ色の面</b>でうけとめよう。</p>
  <p>画面の左がわをタップすると左まわり、右がわで右まわり。キーボードなら ← → でもまわせます。</p>
  <p>色のちがう面でぶつかるとハートがへります。⭐はどの色でもOK、💖でハートがふえます。10こキャッチするごとにレベルアップ！</p>` });
resize(); renderStart();
</script>
</body>
</html>
