<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>やまくずし</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #menu { overflow: auto; }
  .slot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mark { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--line); display: grid; place-items: center; font-size: 1.3rem; flex: none; }
  #game { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .turnbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .who { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border: 3px solid var(--line); border-radius: 999px; background: var(--card); font-weight: 900; opacity: .5; }
  .who.now { opacity: 1; box-shadow: 0 3px 0 var(--line); }
  .who .mark { width: 30px; height: 30px; border-radius: 50%; font-size: 1rem; }
  .quota { white-space: nowrap; display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 900; }
  .qbar { width: min(260px, 50vw); height: 16px; border: 3px solid var(--line); border-radius: 99px; background: var(--soft); overflow: hidden; }
  .qbar i { display: block; height: 100%; width: 0; background: var(--orange); }
  .qbar.full i { background: var(--grass); }
  .stage { flex: 1; position: relative; min-height: 220px; border: 3px solid var(--line); border-radius: 20px; overflow: hidden; touch-action: none; cursor: crosshair; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .msg { text-align: center; font-weight: 900; min-height: 1.6em; }
</style>
</head>
<body>
<main class="k-wrap" id="menu">
  <div class="k-card k-stack">
    <h2>だれがあそぶ？</h2>
    <div class="k-chips" id="optWhere"></div>
    <div class="k-stack" id="slots"></div>
  </div>
  <div class="k-card k-stack">
    <span class="k-label">1回にけずる量</span>
    <div class="k-chips" id="optQuota"></div>
    <span class="k-label">山の大きさ</span>
    <div class="k-chips" id="optSize"></div>
  </div>
  <button class="k-btn is-sun is-big" id="go">スタート</button>
</main>

<section id="game" hidden>
  <div class="turnbar" id="turnbar"></div>
  <div class="quota"><span id="qLabel">けずった量</span><div class="qbar" id="qbar"><i id="qfill"></i></div><button class="k-btn is-small is-grass" id="endTurn" disabled>おわり</button></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="msg" id="msg"></div>
  <div class="k-row" style="justify-content:center">
    <button class="k-btn is-small" id="toMenu">せってい</button>
  </div>
</section>

<script src="../../common/kit.js"></script>
<script src="../../common/net.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const FACES = ['🦊', '🐧', '🐯', '🐙'];
const COLS = ['#ff8a3d', '#3d8bff', '#ffc93c', '#9b6bff'];
const KINDS = [['off', 'なし'], ['human', 'ひと'], ['cpu1', 'CPU よわい'], ['cpu2', 'CPU ふつう'], ['cpu3', 'CPU つよい']];
const O = Object.assign({ slots: ['human', 'cpu2', 'off', 'off'], quota: 2, size: 2, where: 'local' }, Kit.store.get('sand:opts', {}));
let wins = [0, 0, 0, 0];

function renderMenu() {
  const where = $('optWhere'); where.innerHTML = '';
  [['local', '📱 この端末で'], ['net', '📡 オンライン']].forEach(([v, l]) => {
    const b = Kit.el(`<button class="k-chip" aria-pressed="${O.where === v}">${l}</button>`);
    b.onclick = () => { O.where = v; Kit.sfx('select'); renderMenu(); }; where.appendChild(b);
  });
  const wrap = $('slots'); wrap.innerHTML = ''; wrap.hidden = O.where === 'net';
  O.slots.forEach((k, i) => {
    const row = Kit.el(`<div class="slot"><span class="mark" style="background:${COLS[i]}">${FACES[i]}</span><div class="k-chips"></div></div>`);
    KINDS.forEach(([v, l]) => {
      if (i < 2 && v === 'off') return;
      const b = Kit.el(`<button class="k-chip" aria-pressed="${k === v}">${l}</button>`);
      b.onclick = () => { O.slots[i] = v; Kit.sfx('select'); renderMenu(); };
      row.lastChild.appendChild(b);
    });
    wrap.appendChild(row);
  });
  const chips = (root, list, key) => { root.innerHTML = ''; list.forEach(([v, l]) => { const b = Kit.el(`<button class="k-chip" aria-pressed="${O[key] === v}">${l}</button>`); b.onclick = () => { O[key] = v; Kit.sfx('select'); renderMenu(); }; root.appendChild(b); }); };
  chips($('optQuota'), [[1, 'すこし'], [2, 'ふつう'], [3, 'たくさん']], 'quota');
  chips($('optSize'), [[1, 'ひくい'], [2, 'ふつう'], [3, 'たかい']], 'size');
}

/* ---------- 砂のしくみ ---------- */
const CW = 3;              // 1列のはば(px)
let W, H, g, ground, h = [], n, flagC, flagStart, P, cur, removed, quota, over, gen = 0, cpuPos = null, pointer = null, flagTilt = 0, flagFall = 0, grains = [];
let FALL = 30;             // はたの下がこれだけへったらたおれる
/* オンライン：山の大きさを全員そろえる（480×360 を画面に合わせて拡大）。けずっている人の端末が、山のようすを送る */
let room = null, view = { s: 1, ox: 0, oy: 0, cw: 0, ch: 0 }, remotePos = null, sendT = 0;
const mine = p => p.k === 'human' || (p.k === 'net' && p.i === room.me);
const pack = a => a.map(v => Math.round(v * 10));
const unpack = a => a.map(v => v / 10);

function setupWorld() {
  const fit = Kit.fitCanvas($('cv'));
  g = fit.g; view.cw = fit.w; view.ch = fit.h;
  if (room) { W = 480; H = 360; view.s = Math.min(fit.w / W, fit.h / H); view.ox = (fit.w - W * view.s) / 2; view.oy = fit.h - H * view.s; }
  else { W = fit.w; H = fit.h; view.s = 1; view.ox = view.oy = 0; }
  ground = H - 18;
  n = Math.ceil(W / CW);
  // 安息角より少しゆるい円すい形にして、はじめは自然にくずれないようにする
  const slope = 2.6;
  const peak = Math.min(H * [0, 0.42, 0.56, 0.7][O.size], H - 90, (n / 2 - 4) * slope);
  h = Array.from({ length: n }, (_, i) => {
    const d = Math.abs(i - n / 2);
    const cone = peak - d * slope;
    const round = d < 8 ? -(d * d) * 0.06 : -3.84 - (d - 8) * 0;
    return Math.max(6, cone + (d < 8 ? round + 3.84 : 0));
  });
  for (let k = 0; k < 500 && settle() > 0.01; k++);
  flagC = Math.floor(n / 2);
  flagStart = h[flagC];
  FALL = Math.max(30, flagStart * 0.28);
  quota = [0, 380, 650, 1000][O.quota] * (W / 400);
  flagTilt = 0; flagFall = 0; grains = [];
}
function settle() {
  const maxD = 3.3;
  let moved = 0;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < n - 1; i++) {
      const d = h[i] - h[i + 1];
      if (d > maxD) { const m = (d - maxD) * 0.45; h[i] -= m; h[i + 1] += m; moved += m; }
      else if (-d > maxD) { const m = (-d - maxD) * 0.45; h[i + 1] -= m; h[i] += m; moved += m; }
    }
  }
  return moved;
}
function eraseAt(x, y, dt) {
  const R = 22, rate = 420 * dt;
  let total = 0;
  const c0 = Math.floor((x - R) / CW), c1 = Math.ceil((x + R) / CW);
  for (let i = Math.max(0, c0); i <= Math.min(n - 1, c1); i++) {
    const cx = i * CW + CW / 2 - x;
    if (Math.abs(cx) > R) continue;
    const dy = Math.sqrt(R * R - cx * cx);
    const top = ground - h[i];
    const a = Math.max(y - dy, top), b = Math.min(y + dy, ground);
    if (b <= a) continue;
    const take = Math.min(b - a, rate, h[i]);
    h[i] -= take; total += take;
    if (take > 0.5 && Math.random() < 0.15) grains.push({ x: i * CW, y: top, vx: Kit.rand(-40, 40), vy: Kit.rand(-120, -20), life: .6 });
  }
  return total * CW / 3;
}

/* ---------- ゲーム ---------- */
function start() {
  gen++; over = false; cpuPos = null; pointer = null; remotePos = null;
  P = room ? room.players.map((_, i) => ({ k: 'net', i })) : O.slots.map((k, i) => ({ k, i })).filter(p => p.k !== 'off');
  $('menu').hidden = true; $('game').hidden = false;
  setupWorld();
  cur = room ? (room.round - 1) % P.length : Kit.randInt(0, P.length - 1);
  loop.start();
  beginTurn();
}
const label = p => p.k === 'net' ? (p.i === room.me ? 'あなた' : Kit.esc(room.name(p.i))) : p.k === 'human' ? (P.filter(x => x.k === 'human').length > 1 ? `ひと${p.i + 1}` : 'あなた') : `CPU${p.i + 1}`;
function paintBar() {
  $('turnbar').innerHTML = P.map((p, j) => `<div class="who ${j === cur && !over ? 'now' : ''}"><span class="mark" style="background:${COLS[p.i]}">${FACES[p.i]}</span>${label(p)} <small>${wins[p.i]}勝</small></div>`).join('');
}
function paintQuota() {
  const r = Math.min(1, removed / quota);
  $('qfill').style.width = (r * 100) + '%';
  $('qbar').classList.toggle('full', r >= 1);
  $('endTurn').disabled = !(r >= 1 && mine(P[cur]) && !over);
}
function beginTurn() {
  removed = 0; remotePos = null; paintBar(); paintQuota();
  const p = P[cur];
  $('msg').textContent = mine(p) ? `${label(p)}のばん：ゆびでなぞって砂をけずろう` : `${label(p)}がけずっています…`;
  if (p.k === 'net') { if (!mine(p)) netWait(); }
  else if (p.k !== 'human') cpuTurn(+p.k.slice(3));
}
function endTurn() {
  if (over) return;
  if (room && mine(P[cur])) room.move({ h: pack(h) });
  pointer = null; cpuPos = null; remotePos = null;
  cur = (cur + 1) % P.length; Kit.sfx('select');
  const my = gen;
  setTimeout(() => { if (my === gen && !over) beginTurn(); }, 450);
}
$('endTurn').onclick = endTurn;

function netWait() {
  const my = gen;
  room.next().then(m => {
    if (my !== gen || over) return;
    h = unpack(m.h);
    if (m.fall) fall(); else endTurn();
  });
}
function openNet(joinCode) {
  Net.open({
    game: 'sandpile', min: 2, max: 4, joinCode, opts: () => ({ quota: O.quota, size: O.size }),
    onStart(r) {
      if (room !== r) wins = [0, 0, 0, 0];
      room = r; Object.assign(O, r.opts);
      r.onMessage = msg => {
        if (msg.t !== 'h' || msg.r !== r.round || over || !P || mine(P[cur])) return;
        h = unpack(msg.h); remotePos = msg.pos; removed = msg.rm; paintQuota();
      };
      start();
    },
    onLeave: leaveNet,
  });
}
function leaveNet() { if (room) room.close(); room = null; gen++; loop.stop(); $('game').hidden = true; $('menu').hidden = false; renderMenu(); }
function fall() { over = true; Kit.sfx('boom'); Kit.vibrate([120, 60, 120]); setTimeout(lose, 1300); }

function cpuTurn(level) {
  const my = gen;
  // けずる場所をえらぶ：つよいほど はたから遠い、山のすそ
  const cand = [];
  for (let i = 4; i < n - 4; i += 3) {
    if (h[i] < 14) continue;
    const far = Math.abs(i - flagC) / (n / 2);
    const risk = level === 1 ? Math.random() : level === 2 ? far + Math.random() * 0.5 : far * 2 - (h[i] / flagStart) * 0.3;
    cand.push([risk, i]);
  }
  cand.sort((a, b) => b[0] - a[0]);
  let pickI = cand.length ? cand[Math.min(cand.length - 1, level === 1 ? Kit.randInt(0, 4) : 0)][1] : flagC + 20;
  let t = 0;
  setTimeout(function step() {
    if (my !== gen || over) return;
    t += 0.05;
    if (removed >= quota * (level === 1 ? Kit.rand(1, 1.4) : 1.02)) { cpuPos = null; return endTurn(); }
    // すこしずつ横にずらしながら、表面をけずる
    const i = Kit.clamp(pickI + Math.round(Math.sin(t * 3) * 6), 0, n - 1);
    if (h[i] < 12) pickI += (pickI < flagC ? 2 : -2);
    pickI = Kit.clamp(pickI, 2, n - 3);
    cpuPos = { x: i * CW, y: ground - h[i] + 8 };
    setTimeout(step, 50);
  }, 700);
}

function update(dt) {
  if (over && flagFall >= 1) { draw(); return; }
  const p = P[cur];
  let pos = null;
  if (!over && mine(p) && pointer) pos = pointer;
  if (!over && !mine(p) && p.k !== 'net' && cpuPos) pos = cpuPos;
  if (pos) {
    const got = eraseAt(pos.x, pos.y, dt);
    if (got > 0) { removed += got; if (Math.random() < 0.3) Kit.tone(Kit.rand(180, 320), 0.05, { type: 'triangle', vol: 0.05 }); }
    paintQuota();
  }
  for (let k = 0; k < 3; k++) settle();
  if (room && mine(p) && !over && (sendT += dt) > 0.08) {
    sendT = 0;
    room.send({ t: 'h', r: room.round, h: pack(h), pos: pointer ? { x: Math.round(pointer.x), y: Math.round(pointer.y) } : null, rm: removed });
  }
  grains.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt; });
  grains = grains.filter(q => q.life > 0);
  // はた
  if (!over) {
    const base = Math.min(h[flagC - 2], h[flagC], h[flagC + 2]);
    const drop = flagStart - base;
    const lean = (h[flagC + 4] - h[flagC - 4]);
    flagTilt = Kit.clamp(drop / FALL, 0, 1) * 0.5 * Math.sign(lean || 1) * -1;
    if (drop > FALL && (!room || mine(p))) { if (room) room.move({ fall: 1, h: pack(h) }); fall(); }
  } else {
    flagFall = Math.min(1, flagFall + dt * 1.2);
  }
  draw();
}
function lose() {
  const loser = P[cur];
  P.forEach(p => { if (p !== loser) wins[p.i]++; });
  paintBar();
  const humanSafe = loser.k !== 'human' && P.some(p => p.k === 'human') && P.some(p => p.k !== 'human');
  if (humanSafe) Kit.addWin('sandpile');
  (room ? mine(loser) : loser.k === 'human' && P.some(p => p.k !== 'human')) ? Kit.sfx('lose') : (Kit.sfx('win'), Kit.confetti());
  $('msg').textContent = `${label(loser)}が はたをたおした！`;
  Kit.modal({
    title: `${FACES[loser.i]} ${label(loser)}の負け！`,
    body: `<p>はたをたおしちゃった。ほかのみんなの勝ち！</p>`,
    actions: [{ label: 'せってい', onClick: () => $('toMenu').click() }, { label: 'もう一回', primary: true, onClick: () => (room ? room.again() : start()) }],
  });
}

/* ---------- 絵 ---------- */
const BANDS = ['#f2c27b', '#e9ad62', '#f6d39a', '#d9964f', '#f0bb72'];
function draw() {
  g.save();
  if (room) {
    // まわりの余白も空と地面でうめてから、480×360 の世界を拡大してかく
    g.fillStyle = '#e6f6ff'; g.fillRect(0, 0, view.cw, view.ch);
    g.fillStyle = '#7a4a1e'; g.fillRect(0, view.oy + ground * view.s, view.cw, view.ch);
    g.translate(view.ox, view.oy); g.scale(view.s, view.s);
  }
  drawWorld();
  g.restore();
}
function drawWorld() {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#9fd8ff'); sky.addColorStop(1, '#e6f6ff');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.save();
  g.beginPath(); g.moveTo(0, ground);
  for (let i = 0; i < n; i++) g.lineTo(i * CW, ground - h[i]);
  g.lineTo(W, ground); g.closePath();
  g.save(); g.clip();
  for (let y = ground, k = 0; y > 0; y -= 18, k++) { g.fillStyle = BANDS[k % BANDS.length]; g.fillRect(0, y - 18, W, 18); }
  g.restore();
  g.lineWidth = 3; g.strokeStyle = '#7a4a1e'; g.stroke();
  g.restore();
  g.fillStyle = '#7a4a1e'; g.fillRect(0, ground, W, H - ground);
  grains.forEach(q => { g.fillStyle = '#e9ad62'; g.fillRect(q.x, q.y, 3, 3); });
  // はた
  const bx = flagC * CW, by = ground - Math.min(h[flagC - 2], h[flagC], h[flagC + 2]);
  const ang = over ? flagTilt + Math.sign(flagTilt || 1) * flagFall * 1.3 : flagTilt;
  g.save(); g.translate(bx, by); g.rotate(ang);
  g.strokeStyle = '#2a2238'; g.lineWidth = 5; g.beginPath(); g.moveTo(0, 6); g.lineTo(0, -70); g.stroke();
  const wave = Math.sin(performance.now() / 200) * 4;
  g.fillStyle = '#ff3b5c'; g.beginPath(); g.moveTo(0, -70); g.quadraticCurveTo(18, -64 + wave, 34, -60); g.quadraticCurveTo(18, -54 - wave, 0, -48); g.closePath(); g.fill();
  g.lineWidth = 3; g.stroke();
  g.restore();
  // ゆび／CPUの位置
  const pos = P && P[cur] && (mine(P[cur]) ? pointer : P[cur].k === 'net' ? remotePos : cpuPos);
  if (pos && !over) { g.strokeStyle = 'rgba(42,34,56,.6)'; g.lineWidth = 3; g.setLineDash([5, 5]); g.beginPath(); g.arc(pos.x, pos.y, 22, 0, 6.28); g.stroke(); g.setLineDash([]); }
}
const loop = Kit.loop(update);

/* ---------- そうさ ---------- */
const stage = $('stage');
function local(e) {
  const r = $('cv').getBoundingClientRect();
  return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s, id: e.pointerId };
}
stage.addEventListener('pointerdown', e => {
  if (over || !P || !mine(P[cur])) return;
  stage.setPointerCapture(e.pointerId); pointer = local(e);
});
stage.addEventListener('pointermove', e => { if (pointer && e.pointerId === pointer.id) pointer = local(e); });
const up = e => {
  if (!pointer || e.pointerId !== pointer.id) return;
  pointer = null;
  if (!over && removed >= quota) endTurn();
};
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
$('toMenu').onclick = leaveNet;
$('go').onclick = () => { Kit.store.set('sand:opts', O); wins = [0, 0, 0, 0]; Kit.sfx('select'); if (O.where === 'net') openNet(); else start(); };

Kit.bar({ id: 'sandpile', title: '⛰️ やまくずし', help: `
  <p>砂の山のてっぺんに はたが立っています。じゅんばんに ゆびでなぞって砂をけずります。</p>
  <p>上のメーターがいっぱいになるまでけずったら、ゆびをはなすと交代。</p>
  <p>けずると、まわりの砂がサラサラくずれてきます。<b>はたをたおした人の負け！</b> はたから遠いところをけずるのがコツ。</p>
  <p>📡 <b>オンライン</b>：べつのスマホやタブレットで2〜4人。ひとりが「へやをつくる」、ほかの人は そのばんごうで「へやにはいる」。</p>` });
renderMenu();
{ const jc = Net.joinCode(); if (jc) { O.where = 'net'; renderMenu(); openNet(jc); } }
</script>
</body>
</html>
