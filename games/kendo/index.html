<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メン！コテ！ドウ！</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #3a2a1a; }
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 0; right: 0; top: 8px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; z-index: 3; pointer-events: none; font: 400 1.5rem 'Dela Gothic One', sans-serif; color: #fff; -webkit-text-stroke: 1.5px #3a1a00; }
  .hud small { font: 900 .8rem 'Zen Maru Gothic', sans-serif; -webkit-text-stroke: 0; display: block; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .hud[hidden] { display: none; }
  .over { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 14px; overflow: auto; background: rgba(30,15,0,.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .over[hidden] { display: none; }
  .card { width: min(420px, 100%); background: #fffaf0; color: #3a2a1a; border-radius: 26px; padding: 18px 16px; display: grid; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .card h2 { margin: 0; text-align: center; font: 400 2rem 'Dela Gothic One', sans-serif; color: #c0281e; -webkit-text-stroke: 1px #3a1a00; }
  .card p { margin: 0; line-height: 1.7; font-weight: 700; font-size: .95rem; }
  .how { margin: 0; padding-left: 1.2em; line-height: 1.8; font-size: .92rem; font-weight: 700; }
  .btn { appearance: none; border: none; border-radius: 14px; font: 900 1.1rem 'Zen Maru Gothic', sans-serif; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); background: #fff; color: #3a2a1a; }
  .btn.main { background: linear-gradient(135deg, #ff7a3d, #d0281e); color: #fff; box-shadow: 0 4px 0 #8a1a10; }
  .row { display: flex; gap: 8px; } .row .btn { flex: 1; }
  .best { text-align: center; font-weight: 900; color: #8a6a4a; }
  .big { text-align: center; font: 400 3.4rem 'Dela Gothic One', sans-serif; line-height: 1; color: #c0281e; }
  .big small { font: 900 1rem 'Zen Maru Gothic', sans-serif; color: #8a6a4a; }
  .ttl { text-align: center; font: 400 1.6rem 'Dela Gothic One', sans-serif; color: #c0281e; }
  .gal { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 1.3rem; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden><div id="hL"></div><div id="hR" style="text-align:right"></div></div>
  <div class="over" id="menuOv"><div class="card">
    <h2>メン！コテ！ドウ！</h2>
    <p>どうじょうに つぎつぎ あらわれる ヘンな あいてと しあい！ <b>もちもの</b> を みて、どこを うつか きめよう。</p>
    <ul class="how">
      <li>あたまに なにか のってる → <b>メン</b>：あたまの うえを <b>上から 下へ</b> シュッ</li>
      <li>てに なにか もってる → <b>コテ</b>：その てを <b>上から 下へ</b> シュッ</li>
      <li>おなかで かかえてる → <b>ドウ</b>：おなかを <b>よこに</b> シュッ</li>
      <li><b>🙇 おじぎ</b> してる 子は うっちゃ ダメ！ がまん</li>
      <li>まちがえたり、にげられたり すると ❤️が へる。ときどき へんな ことが おきるよ…</li>
    </ul>
    <div class="best" id="mBest"></div>
    <button class="btn main" id="mStart">はじめ！</button>
  </div></div>
  <div class="over" id="resOv" hidden><div class="card" id="resCard"></div></div>
</div>
<script src="../../common/kit.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), cx = cv.getContext('2d');
const snd = () => Kit.settings.sound;
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- あいて：もちものを みて うつ ばしょを きめる ---------- */
// part：men＝あたまの うえ、kote＝て に もって いる、dou＝おなかで かかえて いる、rei＝おじぎ（うたない！）
const FOES = [
  { h: '🐱', i: '👑', n: 'おうさまに なりたい ねこ', p: 'men', c: '#ffcc33' }, { h: '👨', i: '🎩', n: 'てじなしの おじさん', p: 'men', c: '#333a55' },
  { h: '🐧', i: '🍎', n: 'りんごを のせた ペンギン', p: 'men', c: '#3a4a6a' }, { h: '👴', i: '🐦', n: 'あたまに とりの す おじいちゃん', p: 'men', c: '#8a6a4a' },
  { h: '🐻', i: '🎂', n: 'ケーキを のせた くま', p: 'men', c: '#c07a3a' }, { h: '🤖', i: '🍮', n: 'プリンを のせた ロボ', p: 'men', c: '#9aa6b8' },
  { h: '🐸', i: '🌵', n: 'サボテンあたまの かえる', p: 'men', c: '#3a9a4a' }, { h: '🐷', i: '🎀', n: 'でっかい リボンの ぶた', p: 'men', c: '#ff8ab0' },
  { h: '🧒', i: '🍦', n: 'アイスを なめる こども', p: 'kote', c: '#3fa8ff' }, { h: '🐼', i: '📱', n: 'スマホに むちゅうの パンダ', p: 'kote', c: '#555' },
  { h: '😼', i: '🐟', n: 'さかなを ぬすんだ ねこ', p: 'kote', c: '#e07a2a' }, { h: '🐙', i: '🍩', n: 'ドーナツを もった たこ', p: 'kote', c: '#ff6a6a' },
  { h: '🐘', i: '🎈', n: 'ふうせんを もった ゾウ', p: 'kote', c: '#8a9ab8' }, { h: '🦖', i: '🍗', n: 'チキンを もった きょうりゅう', p: 'kote', c: '#4a9a3a' },
  { h: '🐔', i: '🔔', n: 'ベルを ならす にわとり', p: 'kote', c: '#ffffff' }, { h: '👻', i: '🍭', n: 'キャンディを なめる おばけ', p: 'kote', c: '#e8e8ff' },
  { h: '🦝', i: '🥁', n: 'たいこを かかえた たぬき', p: 'dou', c: '#8a5a3a' }, { h: '🦍', i: '🍉', n: 'すいかを かかえた ゴリラ', p: 'dou', c: '#444' },
  { h: '🎅', i: '🎁', n: 'プレゼントを かかえた サンタ', p: 'dou', c: '#d0281e' }, { h: '🦆', i: '🐣', n: 'ひよこを だっこした あひる', p: 'dou', c: '#ffd23a' },
  { h: '🐭', i: '🍕', n: 'ピザを かかえた ねずみ', p: 'dou', c: '#aaa' }, { h: '🐰', i: '🏀', n: 'ボールを かかえた うさぎ', p: 'dou', c: '#ffb0c8' },
  { h: '👹', i: '🧸', n: 'ぬいぐるみを だいた おに', p: 'dou', c: '#d03a3a' }, { h: '🦁', i: '🍙', n: 'おにぎりを かかえた ライオン', p: 'dou', c: '#d09a3a' },
];
const REI = [{ h: '👦', n: 'れいぎ ただしい しょうねん' }, { h: '🐶', n: 'れいぎ ただしい いぬ' }, { h: '👵', n: 'れいぎ ただしい おばあちゃん' }, { h: '🐨', n: 'れいぎ ただしい コアラ' }];
const PARTS = ['men', 'kote', 'dou'], PN = { men: 'メーン！', kote: 'コテー！', dou: 'ドーウ！' };
const EVENTS = [
  { k: 'giant', t: 'でっかい あいてが きた！' }, { k: 'tiny', t: 'ちっちゃくて すばしっこい！' }, { k: 'spin', t: 'どうじょうが まわりだした！' },
  { k: 'double', t: '2人 いっぺんに きた！' }, { k: 'dark', t: 'でんきが チカチカ…' }, { k: 'fast', t: 'みんな せっかち！' },
];

/* ---------- じょうたい ---------- */
let G = null, W = 0, H = 0, DPR = 1;
function newGame() {
  G = { t: 0, score: 0, life: 3, combo: 0, maxCombo: 0, n: 0, foes: [], ev: null, evLeft: 0, shake: 0, flash: 0, swing: null, gal: [], trail: [] };
  $('menuOv').hidden = true; $('resOv').hidden = true; $('hud').hidden = false;
  nextFoe(); hud(); Kit.audio();
  say('はじめ！', '#fff', 1);
}
const win = () => Math.max(.85, 2.0 - G.n * .035) * (G.ev && G.ev.k === 'fast' ? .65 : 1);
function nextFoe() {
  G.n++;
  if (G.evLeft > 0) G.evLeft--; else G.ev = null;
  if (!G.ev && G.n >= 6 && Math.random() < .3) { G.ev = pick(EVENTS); G.evLeft = G.ev.k === 'double' ? 0 : 2; banner(G.ev.t); if (snd()) Kit.tone(300, .3, { type: 'sawtooth', vol: .08, slide: -200 }); }
  const k = G.ev ? G.ev.k : '', cnt = k === 'double' ? 2 : 1;
  G.foes = [];
  for (let i = 0; i < cnt; i++) {
    const rei = G.n >= 3 && Math.random() < .14 && cnt === 1, f = rei ? Object.assign({ p: 'rei', c: '#f5f5f5', i: '' }, pick(REI)) : pick(FOES);
    G.foes.push({ f, x: cnt === 1 ? 0 : (i ? .25 : -.25), s: k === 'giant' ? 1.45 : k === 'tiny' ? .55 : cnt === 2 ? .62 : 1, st: 'enter', t: 0, side: Math.random() < .5 ? -1 : 1, fly: 0, wob: rnd(0, 6), dur: win() * (cnt === 2 ? 1.3 : 1) });
  }
  G.cur = 0;
  G.label = G.foes.map(o => o.f.n).join(' と ');
}

/* ---------- スワイプ ---------- */
// メン：あたまの うえで 上から下へ ／ コテ：もって いる てで 上から下へ ／ ドウ：おなかを よこに
let sw = null;
const spinA = () => G && G.ev && G.ev.k === 'spin' ? Math.sin(performance.now() / 1000 * 1.6) * .35 : 0;
function toWorld(px, py) { const a = -spinA(); if (!a) return [px, py]; const dx = px - W / 2, dy = py - H / 2; return [W / 2 + dx * Math.cos(a) - dy * Math.sin(a), H / 2 + dx * Math.sin(a) + dy * Math.cos(a)]; }
stage.addEventListener('pointerdown', e => { if (!G || G.over || e.target !== cv) return; e.preventDefault(); const r = cv.getBoundingClientRect(); sw = { id: e.pointerId, pts: [toWorld(e.clientX - r.left, e.clientY - r.top)], t0: performance.now() }; cv.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (!sw || e.pointerId !== sw.id) return; const r = cv.getBoundingClientRect(); const p = toWorld(e.clientX - r.left, e.clientY - r.top); sw.pts.push(p); G.trail.push({ x: p[0], y: p[1], t: 0 }); const a = sw.pts[0]; if (Math.hypot(p[0] - a[0], p[1] - a[1]) > Math.min(W, H) * .2) endSwipe(); });
const endUp = e => { if (sw && e.pointerId === sw.id) endSwipe(); };
stage.addEventListener('pointerup', endUp); stage.addEventListener('pointercancel', () => { sw = null; });
function endSwipe() {
  const s = sw; sw = null; if (!s || s.pts.length < 2) return;
  const a = s.pts[0], b = s.pts[s.pts.length - 1], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (len < 30) return;   // みじかすぎる タップは むし
  const dir = dy > Math.abs(dx) * .6 ? 'down' : Math.abs(dx) > Math.abs(dy) * 1.2 ? 'side' : dy < -Math.abs(dx) * .6 ? 'up' : 'diag';
  const mid = { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 };
  strike(mid, dir);
}
function strike(mid, dir) {
  if (!G || G.over) return;
  // いちばん ちかい あいての いちばん ちかい ばしょ
  let best = null;
  G.foes.forEach((o, i) => { if (i < G.cur || o.st === 'fly' || o.st === 'gone') return; for (const k of PARTS) { const p = target(o, k), d = Math.hypot(p.x - mid.x, p.y - mid.y) / foeLayout(o).s; if (!best || d < best.d) best = { o, k, d, p }; } });
  if (!best) return;
  const { o, k, p } = best;
  G.swing = { t: 0, x: p.x, y: p.y };
  if (snd()) Kit.noise(.08, { vol: .1, freq: 2500, filter: 'highpass' });
  if (best.d > 34) { tip('あいての からだを ねらって！', 900); return; }
  if (o.st !== 'ready') return miss(o, o.st === 'enter' ? 'まだ はやい！' : 'あいてを よく みて！');
  if (o.f.p === 'rei') return miss(o, 'れいを して いる 人を うっちゃ ダメ！');
  const needDir = k === 'dou' ? 'side' : 'down';
  if (k !== o.f.p) return miss(o, `そこじゃない！ ${o.f.i} を ねらおう`);
  if (dir !== needDir && !(needDir === 'down' && dir === 'diag')) return miss(o, k === 'dou' ? 'ドウは よこに きろう！' : '上から 下へ うとう！');
  ippon(o, k);
}
addEventListener('keydown', e => {   // キーボードでも あそべる
  if (!G || e.repeat) return;
  const m = { ArrowUp: 'men', KeyJ: 'men', ArrowLeft: 'kote', KeyK: 'kote', ArrowRight: 'dou', ArrowDown: 'dou', KeyL: 'dou' }[e.code];
  if (!m) return; e.preventDefault();
  const o = G.foes[G.cur]; if (!o) return; const p = target(o, m); strike(p, m === 'dou' ? 'side' : 'down');
});
function ippon(o, k) {
  o.st = 'fly'; o.t = 0; o.vx = Math.random() < .5 ? 1 : -1;
  G.score++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.gal.push(o.f.h);
  say(PN[k], '#fff', 0); setTimeout(() => G && say('いっぽん！', '#ffd23a', 0), 260);
  G.flags = 1;
  if (snd()) { Kit.tone(880, .08, { type: 'square', vol: .1 }); Kit.tone(1320, .12, { type: 'square', vol: .1, delay: .08 }); Kit.noise(.12, { vol: .12, freq: 3000, filter: 'highpass' }); }
  Kit.vibrate && Kit.vibrate(30);
  if (G.combo % 10 === 0 && G.life < 3) { G.life++; banner(`${G.combo}れんぞく！ ❤️ ふえた`); }
  hud();
}
function miss(o, msg) {
  G.life--; G.combo = 0; G.shake = .4; G.flash = .35;
  say(pick(['いたっ！', 'ポコッ！', 'ぎゃっ！', 'ペシッ！']), '#ff5a5a', 0); tip(msg, 1500);
  if (o && o.st !== 'fly') { o.st = 'gone'; o.t = 0; }   // あいては にげて いく
  if (snd()) Kit.sfx('bad'); Kit.vibrate && Kit.vibrate(120);
  hud();
  if (G.life <= 0) { G.over = true; setTimeout(showResult, 1300); say('それまで！', '#fff', 1); }
}

/* ---------- まいフレーム ---------- */
function step(dt) {
  G.t += dt; G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt);
  if (G.swing) { G.swing.t += dt; if (G.swing.t > .25) G.swing = null; }
  if (G.flags) { G.flags += dt; if (G.flags > 1.3) G.flags = 0; }
  for (const p of G.trail) p.t += dt; G.trail = G.trail.filter(p => p.t < .25);
  if (G.over) return;
  const o = G.foes[G.cur]; if (!o) return;
  for (const q of G.foes) if (q !== o && q.st === 'enter') { q.t += dt; if (q.t > .55) { q.st = 'wait'; q.t = 0; } }
  o.t += dt;
  if (o.st === 'enter' || o.st === 'wait') { if (o.st === 'wait' || o.t > .55) { o.st = 'ready'; o.t = 0; if (snd()) Kit.tone(o.f.p === 'rei' ? 400 : 700, .06, { type: 'triangle', vol: .06 }); } }
  else if (o.st === 'ready') {
    if (o.t > o.dur) {
      if (o.f.p === 'rei') { o.st = 'gone'; o.t = 0; tip('れい！ よく がまん できたね', 1000); if (snd()) Kit.tone(660, .1, { type: 'sine', vol: .08 }); }
      else miss(o, 'にげられた！ はやく うとう');
    }
  } else if (o.st === 'fly' || o.st === 'gone') {
    if (o.t > .7) { G.cur++; if (G.cur >= G.foes.length) nextFoe(); }
  }
}
function partPos(o, k) { return { men: [0, -112], kote: [o.side * 40, -60], dou: [0, -44] }[k]; }
function target(o, k) { const L = foeLayout(o), p = partPos(o, k); return { x: L.x + p[0] * L.s, y: L.y + p[1] * L.s }; }
function foeLayout(o) {
  const S = Math.min(W * .62, (H - 120) * .5) / 100 * o.s;
  let x = W / 2 + o.x * W, y = H * .78;
  if (G && G.ev && G.ev.k === 'tiny') x += Math.sin(G.t * 4 + o.wob) * W * .25;
  if (o.st === 'enter') x += (1 - o.t / .55) * W * .9 * (o.x < 0 ? -1 : 1);
  if (o.st === 'gone') x -= (o.t / .7) * W * .9 * (o.x > 0 ? -1 : 1);
  return { x, y, s: S };
}

/* ---------- えがく ---------- */
function resize() {
  const r = stage.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize);
function drawDojo(t) {
  const hz = H * .5;
  // かべ
  let g = cx.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#f5e6c8'); g.addColorStop(1, '#e8d2a6'); cx.fillStyle = g; cx.fillRect(0, 0, W, hz);
  cx.fillStyle = '#7a4e2c'; for (let x = 0; x < W; x += W / 5) cx.fillRect(x, 0, 8, hz);
  cx.fillRect(0, hz * .12, W, 8);
  // かけじく
  const kw = Math.min(110, W * .22), kx = W / 2 - kw / 2, ky = hz * .18;
  cx.fillStyle = '#fffdf5'; cx.fillRect(kx, ky, kw, hz * .62); cx.strokeStyle = '#3a2a1a'; cx.lineWidth = 3; cx.strokeRect(kx, ky, kw, hz * .62);
  cx.fillStyle = '#1a1a1a'; cx.font = `900 ${kw * .5}px serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText('一', W / 2, ky + hz * .17); cx.fillText('本', W / 2, ky + hz * .45);
  // ゆか
  g = cx.createLinearGradient(0, hz, 0, H); g.addColorStop(0, '#c08a50'); g.addColorStop(1, '#e0aa6a'); cx.fillStyle = g; cx.fillRect(0, hz, W, H - hz);
  cx.strokeStyle = 'rgba(90,50,20,.3)'; cx.lineWidth = 2;
  for (let i = -8; i <= 8; i++) { cx.beginPath(); cx.moveTo(W / 2 + i * W * .04, hz); cx.lineTo(W / 2 + i * W * .3, H); cx.stroke(); }
  for (let y = hz; y < H; y += (y - hz) * .25 + 8) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
}
// ぼうぐ なしの ヘンな あいて。もちもので うつ ばしょが わかる
function drawFoe(o, t) {
  const L = foeLayout(o); let { x, y, s } = L;
  cx.save();
  if (o.st === 'fly') { const k = o.t / .7; x += o.vx * k * W * .7; y -= Math.sin(k * Math.PI) * H * .35 + k * H * .1; cx.translate(x, y - 60 * s); cx.rotate(o.vx * k * 8); cx.translate(-x, -(y - 60 * s)); cx.globalAlpha = 1 - k * .6; }
  const f = o.f, rei = f.p === 'rei', ready = o.st === 'ready';
  const bob = Math.abs(Math.sin(t * (o.st === 'enter' || o.st === 'gone' ? 14 : 5) + o.wob)) * 3 * s;
  cx.translate(x, y - bob); cx.scale(s, s);
  cx.fillStyle = 'rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(0, bob / s + 2, 30, 6, 0, 0, TAU); cx.fill();
  // あし
  cx.strokeStyle = '#3a2a1a'; cx.lineWidth = 7; cx.lineCap = 'round';
  const lg = o.st === 'enter' || o.st === 'gone' ? Math.sin(t * 14) * 6 : 0;
  cx.beginPath(); cx.moveTo(-8, -30); cx.lineTo(-10 + lg, 0); cx.moveTo(8, -30); cx.lineTo(10 - lg, 0); cx.stroke();
  cx.save();
  if (rei && ready) { const k = Math.min(1, o.t * 4); cx.translate(0, -30); cx.rotate(.75 * k); cx.translate(0, 30); }
  // からだ
  cx.fillStyle = f.c; cx.strokeStyle = 'rgba(0,0,0,.35)'; cx.lineWidth = 2;
  cx.beginPath(); cx.roundRect(-20, -72, 40, 46, 14); cx.fill(); cx.stroke();
  // うで ＋ もちもの
  cx.strokeStyle = f.c; cx.lineWidth = 9;
  cx.font = '24px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const wig = ready ? Math.sin(t * 9 + o.wob) * 3 : 0;
  if (f.p === 'kote') {
    const sd = o.side;
    cx.beginPath(); cx.moveTo(sd * 16, -64); cx.lineTo(sd * 36, -60 + wig); cx.stroke();
    cx.beginPath(); cx.moveTo(-sd * 16, -64); cx.lineTo(-sd * 22, -40); cx.stroke();
    cx.fillStyle = '#ffd2ad'; cx.beginPath(); cx.arc(sd * 38, -60 + wig, 5, 0, TAU); cx.fill();
    cx.font = '26px sans-serif'; cx.fillText(f.i, sd * 42, -70 + wig);
  } else if (f.p === 'dou') {
    cx.font = '34px sans-serif'; cx.fillText(f.i, 0, -46 + wig * .5);
    cx.beginPath(); cx.moveTo(-16, -64); cx.lineTo(-18, -46); cx.moveTo(16, -64); cx.lineTo(18, -46); cx.stroke();
  } else {
    const up = rei ? 0 : 1;
    cx.beginPath(); cx.moveTo(-16, -64); cx.lineTo(-22, -40); cx.moveTo(16, -64); cx.lineTo(22, -40); cx.stroke();
  }
  // あたま
  cx.font = '40px sans-serif'; cx.fillText(f.h, 0, -88);
  if (f.p === 'men') { cx.font = '28px sans-serif'; cx.fillText(f.i, 0, -116 + wig * .6); }
  cx.restore();
  cx.restore();
  // のこり じかん（あたまの うえの バー）・れい の しるし
  if (ready || o.st === 'wait') {
    const k = ready ? Math.max(0, 1 - o.t / o.dur) : 1, bw = 70 * s, bx = x - bw / 2, by = y - bob - 145 * s;
    cx.fillStyle = 'rgba(0,0,0,.35)'; cx.fillRect(bx, by, bw, 7); cx.fillStyle = rei ? '#7ad07a' : k > .35 ? '#ffd23a' : '#ff5a3a'; cx.fillRect(bx, by, bw * k, 7);
    if (rei && ready) { cx.font = `900 ${Math.max(15, 12 * s)}px 'Zen Maru Gothic', sans-serif`; cx.fillStyle = '#fff'; cx.strokeStyle = '#2a1000'; cx.lineWidth = 4; cx.textAlign = 'center'; cx.strokeText('🙇 よろしく おねがいします', x, by - 14); cx.fillText('🙇 よろしく おねがいします', x, by - 14); }
  }
}
function drawTrail() {
  if (!G || G.trail.length < 2) return;
  cx.save(); cx.lineCap = 'round'; cx.lineJoin = 'round';
  for (let i = 1; i < G.trail.length; i++) { const a = G.trail[i - 1], b = G.trail[i]; if (Math.hypot(a.x - b.x, a.y - b.y) > 120) continue; const k = 1 - b.t / .25; cx.strokeStyle = `rgba(255,255,255,${k})`; cx.lineWidth = 12 * k + 2; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
  cx.restore();
}
function drawShinai(t) {   // じぶんの しない
  const bx = W * .78, by = H + 10;
  let tx = W * .6 + Math.sin(t * 2) * 6, ty = H * .6;
  if (G && G.swing) { const k = Math.min(1, G.swing.t / .08), back = G.swing.t > .12 ? (G.swing.t - .12) / .13 : 0; tx = tx + (G.swing.x - tx) * k * (1 - back); ty = ty + (G.swing.y - ty) * k * (1 - back); }
  cx.save(); cx.lineCap = 'round';
  cx.strokeStyle = '#d8b878'; cx.lineWidth = 16; cx.beginPath(); cx.moveTo(bx, by); cx.lineTo(tx, ty); cx.stroke();
  cx.strokeStyle = '#a07a40'; cx.lineWidth = 2; cx.stroke();
  const mx = bx + (tx - bx) * .18, my = by + (ty - by) * .18;
  cx.fillStyle = '#3a2a1a'; cx.beginPath(); cx.ellipse(mx, my, 20, 7, Math.atan2(ty - by, tx - bx) + Math.PI / 2, 0, TAU); cx.fill();
  cx.strokeStyle = '#f5f5f5'; cx.lineWidth = 20; cx.beginPath(); cx.moveTo(bx, by); cx.lineTo(mx, my); cx.stroke();
  if (G && G.swing && G.swing.t < .14) { cx.strokeStyle = 'rgba(255,255,255,.7)'; cx.lineWidth = 6; cx.beginPath(); cx.arc(G.swing.x, G.swing.y, 30 + G.swing.t * 300, 0, TAU); cx.stroke(); }
  cx.restore();
}
function drawFlags() {   // しんぱんの はた
  if (!G || !G.flags) return;
  const k = Math.min(1, G.flags * 6);
  for (const [fx, fy] of [[W * .12, H * .5], [W * .88, H * .5], [W * .5, H * .3]]) {
    cx.save(); cx.translate(fx, fy); cx.rotate(-.5 * k);
    cx.strokeStyle = '#5a3a1a'; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(0, 20); cx.lineTo(0, -40 * k); cx.stroke();
    cx.fillStyle = '#ff2a2a'; cx.fillRect(0, -40 * k, 34 * k, 24 * k); cx.restore();
  }
}
let sayQ = null;
function say(text, col, big) { sayQ = { text, col, t: 0, big }; }
function drawSay() {
  if (!sayQ) return; sayQ.t += 1 / 60; const k = sayQ.t;
  if (k > (sayQ.big ? 1.1 : .7)) { sayQ = null; return; }
  const sc = Math.min(1, k * 8) * (1 + Math.max(0, .15 - k)), a = 1 - Math.max(0, k - .5) * 2;
  cx.save(); cx.globalAlpha = Math.max(0, a); cx.translate(W / 2, H * .3); cx.scale(sc, sc); cx.rotate(-.06);
  cx.font = `400 ${Math.min(W * .15, 74)}px 'Dela Gothic One', sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.lineWidth = 10; cx.strokeStyle = '#2a1000'; cx.strokeText(sayQ.text, 0, 0); cx.fillStyle = sayQ.col; cx.fillText(sayQ.text, 0, 0);
  cx.restore();
}
let bn = null;
function banner(text) { bn = { text, t: 0 }; }
function drawBanner(dt) {
  if (!bn) return; bn.t += dt; if (bn.t > 1.8) { bn = null; return; }
  const a = Math.min(1, bn.t * 5, (1.8 - bn.t) * 3);
  cx.save(); cx.globalAlpha = a; cx.fillStyle = 'rgba(160,40,200,.88)'; cx.fillRect(0, H * .16, W, 46);
  cx.fillStyle = '#fff'; cx.font = `900 ${Math.min(22, W * .055)}px 'Zen Maru Gothic', sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('⚡ ' + bn.text, W / 2, H * .16 + 23);
  cx.restore();
}
let tipS = '', tipT = 0;
function tip(s, ms = 1100) { tipS = s; tipT = ms / 1000; }
function drawTip(dt) {
  if (tipT <= 0) return; tipT -= dt;
  cx.save(); cx.globalAlpha = Math.min(1, tipT * 4); cx.font = `900 ${Math.min(18, W * .045)}px 'Zen Maru Gothic', sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const w = cx.measureText(tipS).width + 30; cx.fillStyle = 'rgba(40,20,0,.85)'; cx.beginPath(); cx.roundRect(W / 2 - w / 2, H * .42 - 18, w, 36, 18); cx.fill();
  cx.fillStyle = '#fff'; cx.fillText(tipS, W / 2, H * .42); cx.restore();
}
function hud() {
  if (!G) return;
  $('hL').innerHTML = `${G.score}<small>いっぽん${G.combo > 2 ? `　🔥${G.combo}れんぞく` : ''}</small>`;
  $('hR').innerHTML = `${'❤️'.repeat(Math.max(0, G.life))}${'🤍'.repeat(Math.max(0, 3 - G.life))}<small>${G.label ? G.label.slice(0, 22) : ''}</small>`;
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (Math.abs(stage.clientWidth - W) > 1 || Math.abs(stage.clientHeight - H) > 1) resize();
  if (G) step(dt);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.save();
  if (G && G.shake) cx.translate(rnd(-1, 1) * 12 * G.shake, rnd(-1, 1) * 12 * G.shake);
  if (G && G.ev && G.ev.k === 'spin') { cx.translate(W / 2, H / 2); cx.rotate(Math.sin(t * 1.6) * .35); cx.translate(-W / 2, -H / 2); }
  drawDojo(t);
  if (G) { drawFlags(); G.foes.forEach((o, i) => { if (i >= G.cur || o.st === 'fly' || o.st === 'gone') drawFoe(o, t); }); }
  else drawFoe({ f: FOES[Math.floor(t / 1.5) % FOES.length], x: 0, s: 1, st: 'ready', t: 0, side: 1, wob: 0, dur: 9 }, t);
  drawShinai(t); drawTrail();
  cx.restore();
  if (G && G.ev && G.ev.k === 'dark' && Math.sin(t * 9) + Math.sin(t * 23) > .9) { cx.fillStyle = 'rgba(0,0,0,.85)'; cx.fillRect(0, 0, W, H); }
  if (G && G.flash) { cx.fillStyle = `rgba(255,0,0,${G.flash})`; cx.fillRect(0, 0, W, H); }
  drawSay(); drawBanner(dt); drawTip(dt);
  if (G) { hudT += dt; if (hudT > .2) { hudT = 0; hud(); } }
}
let hudT = 0;

/* ---------- おわり ---------- */
const RANKS = [[0, 'みならい'], [5, '3きゅう'], [10, '1きゅう'], [16, 'しょだん'], [24, '3だん'], [34, '5だん'], [46, '8だん'], [60, 'けんどう の かみさま']];
function showResult() {
  $('hud').hidden = true;
  const sc = G.score, best = Kit.store.get('kendo:best', 0), isBest = sc > best; if (isBest) Kit.store.set('kendo:best', sc);
  const rank = RANKS.filter(r => sc >= r[0]).pop()[1];
  $('resCard').innerHTML = `<div class="ttl">${rank}</div><div class="big">${sc}<small> いっぽん${isBest ? '　ベスト！' : ''}</small></div>
    <div class="best">🔥 さいだい ${G.maxCombo}れんぞく　ベスト ${Math.max(best, sc)} いっぽん</div>
    <div class="gal">${G.gal.slice(-40).join('')}</div>
    <div class="row"><button class="btn main" id="rAgain">もう一回</button><button class="btn" id="rMenu">もどる</button></div>`;
  if (isBest) setTimeout(() => { Kit.sfx('win'); Kit.confetti(); }, 200);
  $('resOv').hidden = false;
  $('rAgain').onclick = () => { Kit.sfx('tap'); newGame(); };
  $('rMenu').onclick = () => { Kit.sfx('tap'); showMenu(); };
}
function showMenu() {
  G = null; $('hud').hidden = true; $('resOv').hidden = true; $('menuOv').hidden = false;
  const b = Kit.store.get('kendo:best', 0); $('mBest').textContent = b ? `ベスト：${b} いっぽん` : '';
}
$('mStart').onclick = () => { Kit.sfx('tap'); Kit.audio(); newGame(); };

Kit.bar({ id: 'kendo', title: '🥋 メン！コテ！ドウ！', help: `
  <p>どうじょうに つぎつぎ あらわれる ヘンな あいてと けんどうの しあい！ あいての もちものを みて、うつ ばしょを きめる ゲーム。</p>
  <ul>
    <li>あたまの うえに もの（かんむり・ケーキ…）→ メン。あたまの うえを 上から 下へ スワイプ</li>
    <li>てに もの（アイス・スマホ…）→ コテ。その てを 上から 下へ スワイプ</li>
    <li>おなかで かかえてる もの（すいか・たいこ…）→ ドウ。おなかを よこに スワイプ</li>
    <li>🙇 おじぎ している 子は うたずに まつ。まてたら セーフ</li>
    <li>ちがう ばしょ・ちがう むき・はやすぎ・おそすぎ → いたっ！ ❤️が へる。10れんぞくで ❤️が ふえる</li>
    <li>ときどき じけん：でっかい・ちっちゃい あいて、どうじょうが まわる、2人 いっぺん、でんきが チカチカ、みんな せっかち</li>
    <li>キーボード：↑ か J＝メン、← か K＝コテ、→ か L＝ドウ</li>
  </ul>` });
resize(); showMenu(); requestAnimationFrame(frame);
if (location.hash === '#debug') window.__t = { get G() { return G; }, newGame, strike, target, step, nextFoe };
})();
</script>
