<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とびいし ジャンプ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>

  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; pointer-events: none; z-index: 3; }
  .pill { background: rgba(5,20,40,.5); color: #fff; border-radius: 99px; padding: 4px 14px; font: 900 1.05rem 'Zen Maru Gothic', sans-serif; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; border: 1px solid rgba(255,255,255,.18); }
  .pill b { font: 400 1.25rem 'Dela Gothic One', sans-serif; letter-spacing: 1px; }
  .cmts { position: absolute; left: 0; right: 0; top: 50px; height: 90px; pointer-events: none; z-index: 2; overflow: hidden; }
  .cm { position: absolute; left: 100%; white-space: nowrap; color: #fff; font: 900 1rem 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 2px #000; animation: cmv 5s linear forwards; }
  .cm.big { color: #ffe066; font-size: 1.25rem; }
  @keyframes cmv { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 100%)); } }
  .banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .5s; }
  .banner.on { opacity: 1; }
  .banner b { display: block; font: 400 clamp(1.6rem, 8vw, 2.6rem) 'Dela Gothic One', sans-serif; color: #ffe066; -webkit-text-stroke: 2px #2a1a00; text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: 2px; }
  .banner span { display: inline-block; margin-top: 6px; font: 900 1.05rem 'Zen Maru Gothic', sans-serif; color: #fff; background: rgba(5,20,40,.55); padding: 4px 14px; border-radius: 99px; }
  .pop { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); pointer-events: none; z-index: 3; font: 400 1.6rem 'Dela Gothic One', sans-serif; color: #fff; -webkit-text-stroke: 1.5px #0a2a4a; text-shadow: 0 3px 0 rgba(0,0,0,.3); animation: popa .9s ease-out forwards; white-space: nowrap; }
  .pop.gold { color: #ffe066; }
  @keyframes popa { 0% { transform: translate(-50%, -30%) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -110%) scale(1); opacity: 0; } }
  .tip { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3; pointer-events: none; background: rgba(5,20,40,.6); color: #fff; font: 900 .95rem 'Zen Maru Gothic', sans-serif; border-radius: 99px; padding: 7px 16px; white-space: nowrap; transition: opacity .4s; }
  .tip.off { opacity: 0; }
  .over { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 14px; overflow: auto; background: radial-gradient(circle at 50% 30%, rgba(80,200,255,.25), rgba(5,15,30,.75)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { width: min(440px, 100%); background: rgba(246,251,255,.97); color: #12324f; border-radius: 26px; padding: 18px 16px; display: grid; gap: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .card h2 { margin: 0; text-align: center; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 2.1rem; background: linear-gradient(180deg, #5fe0ff, #0a74d1); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #06305a); }
  .card p { margin: 0; line-height: 1.7; font-weight: 700; font-size: .95rem; }
  .btn { appearance: none; border: none; border-radius: 14px; font: 900 1.1rem 'Zen Maru Gothic', sans-serif; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); background: #fff; color: #12324f; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .btn.main { background: linear-gradient(135deg, #3cc3ff, #0a74d1); color: #fff; box-shadow: 0 4px 0 #08508f; }
  .row { display: flex; gap: 8px; } .row .btn { flex: 1; }
  .ttl { text-align: center; font: 400 1.6rem 'Dela Gothic One', sans-serif; color: #0a8ad1; }
  .score { text-align: center; font: 400 3rem 'Dela Gothic One', sans-serif; color: #0b6fb8; line-height: 1; }
  .score small { font: 900 1rem 'Zen Maru Gothic', sans-serif; color: #5b7a96; }
  .bd { display: grid; }
  .bd div { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px dashed #c4dcef; font-weight: 700; font-size: .95rem; }
  .bd b { color: #0b6fb8; }
  .how { margin: 0; padding-left: 1.2em; line-height: 1.8; font-size: .92rem; font-weight: 700; }
  .best { text-align: center; font-weight: 900; color: #5b7a96; }
  .nogl { color: #c0392b; font-weight: 900; text-align: center; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden><span class="pill" id="hLife"></span><span class="pill" id="hScore"></span></div>
  <div class="cmts" id="cmts"></div>
  <div class="banner" id="banner"><b id="bnA"></b><span id="bnB"></span></div>
  <div class="tip off" id="tip"></div>
  <div class="over" id="menuOv">
    <div class="card">
      <h2>とびいし ジャンプ</h2>
      <p>川の とびいしを ぴょんぴょん わたって、どこまで 行けるか ちょうせん！</p>
      <ul class="how">
        <li><b>タップ</b> で ジャンプ</li>
        <li>とおい いしは、空中で <b>もう一回 タップ</b>（くるっと 大ジャンプ）</li>
        <li>のっている いしは だんだん しずむ。リズムよく すすもう</li>
        <li>よこに うごく はっぱや 丸太、もぐる カメに 気をつけて</li>
        <li>まん中に ピタッと のると ボーナス！ ドボンは 3かいまで</li>
      </ul>
      <div class="best" id="mBest"></div>
      <div class="nogl" id="noGL" hidden>この きかいでは 3Dが うごきません</div>
      <button class="btn main" id="mStart">スタート！</button>
    </div>
  </div>
  <div class="over" id="resOv" hidden><div class="card" id="resCard"></div></div>
</div>

<script src="../../common/kit.js"></script>
<script type="module">
import * as THREE from '../../common/vendor/three.module.min.js';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv');

/* ---------- きまり（-z が まえ） ---------- */

const AREA_LEN = 25;
const AREAS = [
  { name: 'あさの 小川', skyT: '#3d9df0', skyB: '#cfeeff', fog: '#cfe8f5', sun: '#fff6e0', sunI: 2.6, hemi: 1.1, water: '#2a9fd0', deep: '#0f5f96', grass: '#6fc35a', rock: '#a6a39b', far: '#7fa8c8' },

  { name: 'ほたるの 夜', skyT: '#070d2a', skyB: '#26306a', fog: '#1a2250', sun: '#a8b8ff', sunI: .9, hemi: .45, water: '#14306a', deep: '#040a20', grass: '#2a4a3a', rock: '#5a6078', far: '#1e2a50', night: 1 },
];
const COMMENTS = { good: ['うまい！', 'ナイス〜', 'リズム いいね', 'その ちょうし！', 'はやっ', 'かっこいい'], perf: ['ピタッ！', 'まん中 きた！', '神ジャンプ', 'きれい〜'], fall: ['ドボン きた〜', 'あ〜〜！', 'おちた〜！', 'ぬれた〜', 'がんばれ〜'], big: ['大ジャンプ！', 'くるっと した！', 'とどいた！', '宙がえり〜'] };

/* ---------- 3D ---------- */

const scene = new THREE.Scene();

const waterMat = new THREE.MeshPhongMaterial({ color: '#2a9fd0', specular: 0xffffff, shininess: 90, normalMap: waterNorm, normalScale: new THREE.Vector2(.6, .6), transparent: true, opacity: .93 });
const water = new THREE.Mesh(new THREE.PlaneGeometry(RW * 2 + 6, 220, 1, 1), waterMat); water.rotation.x = -Math.PI / 2; water.receiveShadow = true; scene.add(water);
const waterNorm2 = waterNorm.clone(); waterNorm2.repeat.set(6, 25); waterNorm2.needsUpdate = true;
const water2 = new THREE.Mesh(new THREE.PlaneGeometry(RW * 2 + 6, 220), new THREE.MeshPhongMaterial({ color: '#ffffff', specular: 0xffffff, shininess: 140, normalMap: waterNorm2, transparent: true, opacity: .14, depthWrite: false })); water2.rotation.x = -Math.PI / 2; water2.position.y = .01; scene.add(water2);
const deepMat = new THREE.MeshBasicMaterial({ color: '#0f5f96' }); const deep = new THREE.Mesh(new THREE.PlaneGeometry(RW * 2 + 6, 220), deepMat); deep.rotation.x = -Math.PI / 2; deep.position.y = -1.2; scene.add(deep);
// 岸
const grassTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { const v = 200 + Math.random() * 55 | 0; g.fillStyle = `rgb(${v - 20},${v},${v - 30})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 5); } }, [8, 40]);
const bankMat = STD('#6fc35a', { map: grassTex, roughness: 1 });
const banks = [-1, 1].map(s => { const m = new THREE.Mesh(new THREE.BoxGeometry(40, 1.2, 220), bankMat); m.position.set(s * (RW + 20), .25, 0); m.receiveShadow = true; scene.add(m); return m; });
const edgeMat = STD('#8a7a62', { roughness: 1 });
const edges = [-1, 1].map(s => { const m = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 220), edgeMat); m.position.set(s * (RW + .4), 0, 0); m.rotation.z = s * .5; scene.add(m); return m; });
// とおくの 山
const farMat = new THREE.MeshLambertMaterial({ color: '#7fa8c8', flatShading: true, fog: false });
const mtnGroup = new THREE.Group(); scene.add(mtnGroup);
for (let i = 0; i < 26; i++) { const h = 22 + Math.random() * 30, m = new THREE.Mesh(new THREE.ConeGeometry(14 + Math.random() * 14, h, 6), farMat); const s = i % 2 ? 1 : -1; m.position.set(s * (48 + Math.random() * 50), h / 2 - 2, -50 - Math.random() * 110); m.rotation.y = Math.random() * 3; mtnGroup.add(m); }
// 木・岩（くりかえし つかう）
const deco = [], DSPAN = 120;
const trunkM = STD('#8a5a36'), leafMs = ['#3f9a4f', '#4fb05a', '#2f8a48', '#5fbf60'].map(c => STD(c, { flatShading: true })), bRockM = STD('#9a978e', { flatShading: true });
function tree() {
  const g = new THREE.Group(), k = Math.random();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.18, .26, 1.6, 7), trunkM); tr.position.y = .8; tr.castShadow = true; g.add(tr);
  if (k < .55) { for (let i = 0; i < 3; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry(1.5 - i * .35, 1.8, 8), Kit.pick(leafMs)); c.position.y = 2 + i * 1; c.castShadow = true; g.add(c); } }
  else { const c = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 0), Kit.pick(leafMs)); c.position.y = 2.6; c.castShadow = true; g.add(c); const c2 = new THREE.Mesh(new THREE.IcosahedronGeometry(.9, 0), Kit.pick(leafMs)); c2.position.set(.7, 3.2, .2); c2.castShadow = true; g.add(c2); }
  return g;
}
for (let i = 0; i < 46; i++) {
  const s = i % 2 ? 1 : -1, near = Math.random() < .5;
  let o;
  if (Math.random() < .3) { o = new THREE.Mesh(new THREE.DodecahedronGeometry(.6 + Math.random() * .8, 0), bRockM); o.position.y = .4; o.castShadow = true; o.receiveShadow = true; o.userData.rock = 1; const g = new THREE.Group(); g.add(o); o = g; }
  else o = tree();
  o.position.set(s * (RW + 1.4 + (near ? Math.random() * 2 : 2.5 + Math.random() * 9)), .85, -Math.random() * DSPAN + 10);
  o.scale.setScalar(.8 + Math.random() * .6); o.rotation.y = Math.random() * 6; scene.add(o); deco.push(o);

// がけ（けいりゅう）
const cliffM = STD('#7d8890', { flatShading: true });
const cliffs = []; for (let i = 0; i < 16; i++) { const s = i % 2 ? 1 : -1, h = 5 + Math.random() * 7, m = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), cliffM); m.scale.set(3 + Math.random() * 2, h, 4 + Math.random() * 3); m.position.set(s * (RW + 7 + Math.random() * 3), h * .4, -Math.random() * DSPAN + 10); m.castShadow = true; m.visible = false; scene.add(m); cliffs.push(m); }
// はす
const lotusM = STD('#3f9a4f', { side: THREE.DoubleSide }), lotusF = STD('#ff8fb8');
const lotus = []; for (let i = 0; i < 24; i++) { const m = new THREE.Mesh(new THREE.CircleGeometry(.5 + Math.random() * .4, 16, .3, 5.9), lotusM); m.rotation.x = -Math.PI / 2; m.rotation.z = Math.random() * 6; const s = Math.random() < .5 ? -1 : 1; m.position.set(s * (2.2 + Math.random() * 4.5), .03, -Math.random() * DSPAN + 10); m.visible = false; scene.add(m); if (Math.random() < .35) { const f = new THREE.Mesh(new THREE.ConeGeometry(.18, .3, 6), lotusF); f.position.set(0, 0, -.25); f.rotation.x = Math.PI / 2; m.add(f); } lotus.push(m); }
// ほたる
const ffGeo = new THREE.BufferGeometry(); const ffN = 70; ffGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(ffN * 3), 3));

const fireflies = new THREE.Points(ffGeo, new THREE.PointsMaterial({ color: 0xdfff7a, size: .22, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(fireflies);

/* ---------- いし ---------- */
const rockMats = [STD('#a6a39b', { flatShading: true, roughness: .9 }), STD('#9a968c', { flatShading: true, roughness: .9 }), STD('#b0ada4', { flatShading: true, roughness: .9 })];
const mossM = STD('#6a9a4a', { flatShading: true });
const padM = STD('#3fae4f', { side: THREE.DoubleSide, roughness: .6 }), padM2 = STD('#5fd06a', { roughness: .6 }), flowerM = STD('#ff9ac0');
const logM = STD('#8a5e36', { roughness: .9 }), logEndM = STD('#d8b07a');
const shellM = STD('#3f7a3a', { flatShading: true, roughness: .5 }), shellM2 = STD('#6aaa4a', { flatShading: true }), turtleSkin = STD('#7ab06a'), blackM = STD('#111111');
const ballTex = canvasTex(256, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#1e2433'; for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) { const x = i * 32 + (j % 2) * 16 + 16, y = j * 48 + 16; g.beginPath(); for (let k = 0; k < 5; k++) { const a = k / 5 * 6.283; g.lineTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); } g.fill(); } });
const ballM = STD('#ffffff', { map: ballTex, roughness: .4 });
function rockMesh(r) {
  const geo = new THREE.DodecahedronGeometry(1, 1), p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const k = .85 + Math.random() * .3; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k); }

}
function makeStoneMesh(s) {
  let g;
  if (s.type === 'rock' || s.type === 'small') g = rockMesh(s.r);
  else if (s.type === 'pad') {
    g = new THREE.Group();

  p.on = s; p.x = s.x; p.off = 0; p.z = s.z; p.y = TOP; G.st = 'stand'; p.squash = .3; s.load = -.6;
  ring(p.x, p.z, .8); Kit.sfx('pop');
}
const BGM = { bpm: 132, type: 'square', vol: .02, lead: [659, 0, 784, 659, 880, 0, 784, 0, 659, 0, 587, 0, 523, 0, 587, 659, 784, 0, 880, 784, 988, 0, 880, 0, 784, 0, 659, 0, 587, 0, 0, 0], bass: [110, 0, 165, 0, 131, 0, 196, 0, 147, 0, 220, 0, 165, 0, 247, 0] };

/* ---------- からだの うごき ---------- */
function poseKid(dt) {
  const p = G.p, k = kid; k.root.visible = true;
  k.root.position.set(p.x, p.y, p.z);
  const air = G.st === 'air', fallen = G.st === 'fall' || G.st === 'over';
  const sq = p.squash; k.body.scale.set(1 + sq * .35, 1 - sq * .35, 1 + sq * .35);
  let la = 0, ra = 0, ll = 0, rl = 0, armZ = .15, flip = 0, bodyY = 0;
  if (air) {
    const up = Kit.clamp(p.vy / VY, -1, 1);
    la = ra = -2.4 + (1 - up) * .5; armZ = .5;
    ll = -.9 - (p.dj ? .8 : 0); rl = .4 + (p.dj ? -1.2 : 0);
    if (p.dj) { flip = -p.flip * Math.PI * 2; bodyY = .6 * Math.sin(p.flip * Math.PI); }
  } else if (fallen) { la = -2.8 + Math.sin(G.t * 18) * .4; ra = -2.8 - Math.sin(G.t * 18) * .4; armZ = .9; }
  else { const b = Math.sin(G.t * 5) * .06; la = .15 + b; ra = -.15 - b; armZ = .12; k.body.position.y = Math.abs(Math.sin(G.t * 5)) * .02; }
  k.arms[0].rotation.set(la, 0, armZ); k.arms[1].rotation.set(ra, 0, -armZ);
  k.legs[0].rotation.x = ll; k.legs[1].rotation.x = rl;
  // 宙がえり：こしを 中心に まわす
  k.body.rotation.x = flip; k.body.position.y = air ? bodyY : (fallen ? 0 : k.body.position.y);
  if (p.dj) { k.body.position.y += 1 - Math.cos(flip) * 1; k.body.position.z = -Math.sin(flip) * 1; } else k.body.position.z = 0;
  k.head.rotation.x = air ? .25 : 0;
  // かげ
  const on = G.st === 'stand' || G.st === 'ready';
  blob.visible = !fallen; blob.position.set(p.x, on ? p.y + .02 : .05, p.z); const hgt = Math.max(0, p.y - TOP); blob.scale.setScalar(Math.max(.4, 1 - hgt * .25)); blob.material.opacity = .28 - Math.min(.15, hgt * .05);
}
/* ---------- カメラ ---------- */
const camPos = new THREE.Vector3(0, 4, 7), camLook = new THREE.Vector3();
function camFollow(dt) {
  const p = G.p, portrait = VW < VH;
  const back = portrait ? 6.2 : 5.4, hgt = portrait ? 3.6 : 3.0;
  const ty = Math.max(TOP, Math.min(p.y, TOP + 1.2));
  const want = new THREE.Vector3(p.x * .45, ty + hgt, p.z + back);
  camPos.lerp(want, Math.min(1, dt * 5));
  const look = new THREE.Vector3(p.x * .6, ty + .6, p.z - (portrait ? 7 : 8));
  camLook.lerp(look, Math.min(1, dt * 6));
  cam.position.copy(camPos); if (G.shake > 0) { cam.position.x += (Math.random() - .5) * .2; cam.position.y += (Math.random() - .5) * .2; }
  cam.lookAt(camLook);
  followWorld(p.z);
}
/* ---------- まわりの せかい ---------- */
let flowT = 0;
function followWorld(z) {
  water.position.z = water2.position.z = deep.position.z = z - 60;
  banks.forEach(b => b.position.z = z - 60); edges.forEach(b => b.position.z = z - 60);
  grassTex.offset.y = -(z - 60) / (220 / 40);
  mtnGroup.position.z = z;
  sky.position.set(0, 0, z); stars.position.set(0, 0, z);
  sunDisc.position.set(-40, 50, z - 150);
  sun.position.set(-8 + G_x(), 18, z - 6 + 10); sun.target.position.set(G_x(), 0, z - 6);
  for (const o of [...deco, ...cliffs, ...lotus]) { if (o.position.z > z + 12) o.position.z -= DSPAN; else if (o.position.z < z - DSPAN + 12) o.position.z += DSPAN; }
  const pos = ffGeo.attributes.position;
  for (let i = 0; i < ffN; i++) { const s = ffSeed[i]; let zz = z + 10 - ((s[2] - z * 0 + 1e4) % DSPAN); pos.setXYZ(i, s[0] * (RW + 4) + Math.sin(flowT * .7 + s[3]) * .6, .6 + s[1] * 2.5 + Math.sin(flowT * 1.3 + s[3]) * .3, ((s[2] + z) % DSPAN + DSPAN) % DSPAN + z - DSPAN + 12); void zz; }
  pos.needsUpdate = true;
}
const G_x = () => (G ? G.p.x : 0);
const cur = { skyT: new THREE.Color(), skyB: new THREE.Color(), fog: new THREE.Color(), sun: new THREE.Color(), water: new THREE.Color(), deep: new THREE.Color(), grass: new THREE.Color(), rock: new THREE.Color(), far: new THREE.Color(), sunI: 2.6, hemi: 1.1, night: 0 };
let tgt = AREAS[0];
function setArea(i, instant) {
  tgt = AREAS[i]; if (G) G.area = i;
  cliffs.forEach(c => c.visible = !!tgt.cliff); lotus.forEach(l => l.visible = !!tgt.lotus);
  if (instant) envUpdate(1, true);
}
function envUpdate(dt, instant) {
  flowT += dt;
  const k = instant ? 1 : Math.min(1, dt * 1.2);
  ['skyT', 'skyB', 'fog', 'sun', 'water', 'deep', 'grass', 'rock', 'far'].forEach(n => cur[n].lerp(new THREE.Color(tgt[n]), k));
  cur.sunI += (tgt.sunI - cur.sunI) * k; cur.hemi += (tgt.hemi - cur.hemi) * k; cur.night += ((tgt.night ? 1 : 0) - cur.night) * k;
  skyMat.uniforms.top.value.copy(cur.skyT); skyMat.uniforms.bot.value.copy(cur.skyB);
  scene.fog.color.copy(cur.fog); sun.color.copy(cur.sun); sun.intensity = cur.sunI; hemi.intensity = cur.hemi;
  waterMat.color.copy(cur.water); deepMat.color.copy(cur.deep); bankMat.color.copy(cur.grass); farMat.color.copy(cur.far);
  rockMats.forEach((m, i) => m.color.copy(cur.rock).offsetHSL(0, 0, (i - 1) * .04));
  sunDisc.material.color.copy(cur.sun); sunDisc.scale.setScalar(cur.night > .5 ? 22 : 46);
  stars.material.opacity = cur.night; fireflies.material.opacity = cur.night * (.7 + .3 * Math.sin(flowT * 3));
  waterNorm.offset.set(Math.sin(flowT * .1) * .05, flowT * .06); waterNorm2.offset.set(-flowT * .01, flowT * .1);
  for (const d of drops) { if (d.life <= 0) continue; d.life -= dt; d.v.y -= 16 * dt; d.m.position.addScaledVector(d.v, dt); if (d.life <= 0 || d.m.position.y < -.1) { d.life = 0; d.m.visible = false; } }
  for (const r of rings) { if (r.t >= r.max) { r.m.visible = false; continue; } r.t += dt; const q = r.t / r.max; r.m.scale.setScalar(.3 + q * 1.6 * r.big); r.m.material.opacity = (1 - q) * .7; }
}

/* ---------- けっか ---------- */
function showResult() {
