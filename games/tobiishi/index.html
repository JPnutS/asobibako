<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とびいし ジャンプ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #1d3b5a; }
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; pointer-events: none; z-index: 3; }
  .pill { background: rgba(10,30,60,.5); color: #fff; border-radius: 99px; padding: 3px 12px; font: 900 1.05rem 'Zen Maru Gothic', sans-serif; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; }
  .tip { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3; pointer-events: none; background: rgba(10,30,60,.6); color: #fff; font: 900 .95rem 'Zen Maru Gothic', sans-serif; border-radius: 99px; padding: 6px 16px; white-space: nowrap; transition: opacity .4s; }
  .tip.off { opacity: 0; }
  .over { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 14px; overflow: auto; background: radial-gradient(circle at 50% 30%, rgba(140,220,180,.3), rgba(10,30,60,.72)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .card { width: min(440px, 100%); background: #f6fbff; color: #12324f; border-radius: 26px; padding: 18px 16px; display: grid; gap: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
  .card h2 { margin: 0; text-align: center; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 2rem; background: linear-gradient(180deg, #7ee08a, #1f9a52); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #0d4a28); }
  .card p { margin: 0; line-height: 1.7; font-weight: 700; font-size: .95rem; }
  .btn { appearance: none; border: none; border-radius: 14px; font: 900 1.1rem 'Zen Maru Gothic', sans-serif; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); background: #fff; color: #12324f; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .btn.main { background: linear-gradient(135deg, #4ade80, #16a34a); color: #fff; box-shadow: 0 4px 0 #0e6b33; }
  .row { display: flex; gap: 8px; } .row .btn { flex: 1; }
  .ttl { text-align: center; font: 400 1.6rem 'Dela Gothic One', sans-serif; color: #16a34a; }
  .score { text-align: center; font: 400 3rem 'Dela Gothic One', sans-serif; color: #0b6fb8; line-height: 1; }
  .score small { font: 900 1rem 'Zen Maru Gothic', sans-serif; color: #5b7a96; }
  .bd { display: grid; }
  .bd div { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px dashed #c4dcef; font-weight: 700; font-size: .95rem; }
  .bd b { color: #0b6fb8; }
  .how { margin: 0; padding-left: 1.2em; line-height: 1.8; font-size: .92rem; font-weight: 700; }
  .best { text-align: center; font-weight: 900; color: #5b7a96; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden><span class="pill" id="hLife"></span><span class="pill" id="hScore">0</span></div>
  <div class="tip off" id="tip"></div>
  <div class="over" id="menuOv">
    <div class="card">
      <h2>とびいし ジャンプ</h2>
      <p>川の とびいしを ぴょんぴょん わたって、どこまで 行けるか ちょうせん！</p>
      <ul class="how">
        <li><b>タップ</b> で ジャンプ</li>
        <li>とおい いしは、空中で <b>もう一回 タップ</b> で 大ジャンプ</li>
        <li>いしは のっていると だんだん しずむ。リズムよく すすもう</li>
        <li>うごく はっぱや、もぐる カメに 気をつけて</li>
        <li>まん中に ピタッと のると ボーナス！ ドボンは 3かいまで</li>
      </ul>
      <div class="best" id="mBest"></div>
      <button class="btn main" id="mStart">スタート！</button>
    </div>
  </div>
  <div class="over" id="resOv" hidden><div class="card" id="resCard"></div></div>
</div>

<script src="../../common/kit.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
/* ---------- きまり ---------- */
const D = 100, T1 = .42, H = 62, GR = 8 * H / (T1 * T1), VY = GR * T1 / 2, VX = D / T1, TOP = -12;   // TOP = いしの 上
const AREAS = [
  { name: 'あさの 小川', sky: ['#7cc8ff', '#e6f6ff'], hill: '#9fd38a', hill2: '#6fbf63', water: ['#6fd0ee', '#2a8cc8'], rock: ['#b9b3a8', '#8a8478'] },
  { name: 'はすの いけ', sky: ['#8fd6ff', '#f0fbff'], hill: '#a8d98a', hill2: '#5fae5a', water: ['#6ac9b8', '#227a7e'], rock: ['#a9a59a', '#7d786c'], lotus: 1 },
  { name: 'いわの けいりゅう', sky: ['#5fb0f0', '#d8efff'], hill: '#6a9a6a', hill2: '#3f7a52', water: ['#5ec4e0', '#11608e'], rock: ['#9aa3aa', '#66717a'], foam: 1 },
  { name: 'ゆうやけの 川', sky: ['#ff9a62', '#ffe2b0'], hill: '#c78a8a', hill2: '#7a8a5a', water: ['#f0a878', '#5a4a8a'], rock: ['#b39a8a', '#7a6458'] },
  { name: 'ほたるの 夜', sky: ['#1a2350', '#3d4a8a'], hill: '#2a3a5a', hill2: '#1f2e44', water: ['#2a4a8a', '#0f1f44'], rock: ['#6a7088', '#454a60'], night: 1 },
];
const AREA_LEN = 25;
const COMMENTS = { good: ['うまい！', 'ナイス〜', 'リズム いいね', 'その ちょうし！', 'はやっ'], perf: ['ピタッ！', 'まん中 きた！', '神ジャンプ', 'きれい〜'], fall: ['ドボン きた〜', 'あ〜〜！', 'おちた〜！', 'ぬれた〜', 'がんばれ〜'], big: ['大ジャンプ！', 'とんだ〜！', 'とどいた！'] };

/* ---------- 画面 ---------- */
const cv = $('cv'); let ctx, VW = 1, VH = 1, DPR = 1;
function resize() { const r = $('stage').getBoundingClientRect(); VW = r.width; VH = r.height; DPR = Math.min(2, devicePixelRatio || 1); ctx = Kit.fitCanvas(cv, VW, VH).g; }
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => { const r = $('stage').getBoundingClientRect(); if (Math.abs(r.width - VW) > 1 || Math.abs(r.height - VH) > 1) resize(); }).observe($('stage'));

/* ---------- じょうたい ---------- */
let G = null;
function newGame() {
  G = {
    t: 0, st: 'ready', stones: [], parts: [], rings: [], texts: [], cmts: [], flies: [],
    p: { x: 0, y: TOP, vx: 0, vy: 0, on: null, off: 0, dj: false, face: 0, squash: 0, fallT: 0, wet: 0 },
    life: 3, score: 0, count: 0, maxIdx: 0, perf: 0, balls: 0, falls: 0, combo: 0, maxCombo: 0,
    camX: -60, area: 0, areaShow: 2.5, lastX: 0, idx: 0, shake: 0,
  };
  // スタートの 岸
  G.stones.push({ type: 'bank', x0: -400, x: -400, w: 400, idx: 0, load: 0, sink: 0 });
  G.lastX = 0; G.idx = 0;
  for (let i = 0; i < 4; i++) addStone('rock', D);
  gen();
  G.p.on = G.stones[0]; G.p.x = -2; G.p.off = G.p.x - G.stones[0].x;
  $('menuOv').hidden = true; $('resOv').hidden = true; $('hud').hidden = false;
  hud(); tip('タップで ジャンプ！');
  Kit.audio(); Kit.music.play(BGM);
}
function hud() { $('hLife').textContent = '❤️'.repeat(G.life) + '🤍'.repeat(3 - G.life); $('hScore').textContent = `🪨 ${G.count}　${G.score} てん`; }
let tipT = 0;
function tip(s, ms = 3000) { const e = $('tip'); e.textContent = s; e.classList.toggle('off', !s); clearTimeout(tipT); if (s) tipT = setTimeout(() => e.classList.add('off'), ms); }
function addStone(type, gap, o = {}) {
  const x0 = G.lastX + gap; G.idx++;
  const s = Object.assign({ type, x0, x: x0, w: 25, idx: G.idx, load: 0, sink: 0, A: 0, om: 0, ph: Math.random() * 6, ball: false }, o);
  if (type === 'small') s.w = 15;
  if (type === 'pad') { s.w = 27; s.A = s.A || Kit.rand(26, 42); s.om = s.om || Kit.rand(1.6, 2.6); }
  if (type === 'turtle') { s.w = 24; s.P = s.P || 3.2; s.up = s.up || 2.1; }
  if (type === 'log') { s.w = 40; s.A = s.A || Kit.rand(20, 34); s.om = s.om || Kit.rand(1.1, 1.8); }
  if (G.idx > 3 && Math.random() < .12) s.ball = true;
  G.stones.push(s); G.lastX = x0;
  return s;
}
function gen() {
  while (G.lastX < G.camX + 1600) {
    const n = G.idx, lv = Math.min(1, n / 120);
    const r = Math.random();
    const jit = () => Kit.rand(-10, 10) * (.8 + lv * .5);
    if (n < 6) { addStone('rock', D + jit()); continue; }
    const opts = [['plain', 3], ['small', 1 + lv * 2], ['gap', 1.4 + lv], ['pad', n > 10 ? 1.4 + lv : 0], ['turtle', n > 22 ? 1 + lv : 0], ['log', n > 15 ? .8 : 0], ['stairs', n > 30 ? .8 : 0]];
    let tot = opts.reduce((a, o) => a + o[1], 0), k = Math.random() * tot, pick = 'plain';
    for (const [name, w] of opts) { k -= w; if (k <= 0) { pick = name; break; } }
    if (pick === 'plain') { const m = Kit.rand(2, 4) | 0; for (let i = 0; i < m; i++) addStone('rock', D + jit()); }
    else if (pick === 'small') { const m = Kit.rand(2, 4) | 0; for (let i = 0; i < m; i++) addStone('small', D + jit()); }
    else if (pick === 'gap') { addStone(Math.random() < lv * .5 ? 'small' : 'rock', Kit.rand(165, 185)); addStone('rock', D + jit()); }
    else if (pick === 'pad') { const m = Kit.rand(1, 3) | 0; for (let i = 0; i < m; i++) addStone('pad', D); addStone('rock', D); }
    else if (pick === 'turtle') { const m = Kit.rand(1, 3) | 0; for (let i = 0; i < m; i++) addStone('turtle', D + jit(), { ph: i * 1.1 + Math.random() }); addStone('rock', D); }
    else if (pick === 'log') { addStone('log', D + 10); addStone('rock', D + 10); }
    else if (pick === 'stairs') { addStone('rock', D); addStone('small', Kit.rand(165, 180)); addStone('rock', D); }
    void r;
  }
}
const limitFor = s => s.type === 'bank' ? 1e9 : Math.max(1.05, 2.5 - s.idx * .012);
function turtleUp(s) { const c = ((G.t + s.ph) % s.P + s.P) % s.P; return c < s.up; }
function turtleWarn(s) { const c = ((G.t + s.ph) % s.P + s.P) % s.P; return c > s.up - .55 && c < s.up; }

/* ---------- 入力 ---------- */
function press(e) {
  if (e) e.preventDefault(); if (!G) return; Kit.audio();
  const p = G.p;
  if (G.st === 'ready' || G.st === 'stand') { jump(); }
  else if (G.st === 'air' && !p.dj) { p.dj = true; p.vy = -VY * .95; Kit.sfx('jump'); Kit.tone(880, .06, { type: 'triangle', vol: .12 }); burstRing(p.x, p.y + 8); }
}
cv.addEventListener('pointerdown', press);
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat && G && $('resOv').hidden) { press(e); } });
function jump() {
  const p = G.p;
  if (p.on) p.on.left = true;
  p.on = null; p.vx = VX; p.vy = -VY; p.dj = false; p.squash = -.3; G.st = 'air';
  Kit.sfx('jump');
}

/* ---------- まいフレーム ---------- */
function update(dt) {
  if (!ctx) resize();
  dt = Math.min(dt, .05);
  if (G) step(dt);
  render(dt);
}
function step(dt) {
  G.t += dt; const p = G.p;
  if (G.shake > 0) G.shake -= dt;
  if (G.areaShow > 0) G.areaShow -= dt;
  // いし
  for (const s of G.stones) {
    if (s.A) s.x = s.x0 + Math.sin(G.t * s.om + s.ph) * s.A;
    if (s.sinkDown) s.sink = Math.min(30, s.sink + dt * 40);
    else if (!(p.on === s) && s.sink > 0 && s.type !== 'bank') s.sink = Math.max(0, s.sink - dt * 20);
  }
  if (G.st === 'stand') {
    const s = p.on; p.x = s.x + p.off;
    if (s.type === 'rock' || s.type === 'small' || s.type === 'turtle') p.off += (0 - p.off) * Math.min(1, dt * 5);
    s.load += dt; const L = limitFor(s);
    s.sink = s.type === 'turtle' ? 0 : Math.max(0, (s.load - L * .55) / (L * .45)) * 10;
    if (s.type === 'turtle' && !turtleUp(s)) return fall('もぐった〜！');
    if (s.load >= L) { s.sinkDown = true; return fall('しずんだ〜！'); }
    p.y = TOP + s.sink;
  } else if (G.st === 'air') {
    p.vy += GR * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vy > 0 && p.y >= TOP) {
      // ちゃくち できる いしを さがす
      const s = G.stones.find(s => s.type === 'bank' ? p.x <= s.x + s.w && p.x >= s.x : Math.abs(p.x - s.x) < s.w + 5 && !(s.type === 'turtle' && !turtleUp(s)) && !s.sinkDown);
      if (s) land(s);
      else if (p.y >= 6) fall();
    }
  } else if (G.st === 'fall') {
    p.fallT -= dt; p.y += (30 - p.y) * Math.min(1, dt * 6);
    if (p.fallT <= 0) respawn();
  }
  if (p.squash) p.squash += (0 - p.squash) * Math.min(1, dt * 12);
  // カメラ
  const want = p.x - Math.min(VW / sc() * .28, 150);
  G.camX += (want - G.camX) * Math.min(1, dt * 4);
  gen();
  G.stones = G.stones.filter(s => s.x0 + s.w + 200 > G.camX || s === p.on);
  // こうか
  G.parts.forEach(q => { q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }); G.parts = G.parts.filter(q => q.life > 0 && q.y < 40);
  G.rings.forEach(r => r.t += dt); G.rings = G.rings.filter(r => r.t < r.max);
  G.texts.forEach(f => { f.t -= dt; f.y -= 40 * dt; }); G.texts = G.texts.filter(f => f.t > 0);
  G.cmts.forEach(c => { c.x -= c.sp * dt; }); G.cmts = G.cmts.filter(c => c.x > -300);
  G.flies.forEach(f => f.t += dt * 2); G.flies = G.flies.filter(f => f.t < 1);
}
function land(s) {
  const p = G.p; G.st = 'stand'; p.on = s; p.vy = 0; p.y = TOP; p.off = p.x - s.x; p.squash = .35;
  if (s.type !== 'bank' && !s.left) s.load = Math.min(s.load, 0);
  const dx = Math.abs(p.x - s.x);
  ring(p.x, .7);
  if (s.idx > G.maxIdx) {
    const gained = s.idx - G.maxIdx; G.maxIdx = s.idx; G.count = s.idx;
    let pts = gained, perfect = s.type !== 'bank' && dx < 3.5;
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    if (perfect) { G.perf++; pts += 2; G.texts.push({ x: p.x, y: TOP - 70, s: 'ピタッ！ +2', t: .9, c: '#ffe066' }); Kit.sfx('good'); if (Math.random() < .35) cmt('perf'); }
    else { Kit.tone(523 + Math.min(12, G.combo) * 30, .07, { type: 'triangle', vol: .14 }); if (G.combo % 10 === 0) cmt('good'); }
    if (p.dj && gained >= 1 && s.x - (s.prevX || 0) > 0) { if (Math.random() < .4) cmt('big'); }
    if (s.ball) { s.ball = false; G.balls++; pts += 3; Kit.sfx('coin'); G.texts.push({ x: p.x, y: TOP - 90, s: '⚽ +3', t: 1, c: '#fff' }); G.flies.push({ x: p.x, y: TOP - 20, t: 0 }); }
    G.score += pts;
    const na = Math.floor(G.count / AREA_LEN) % AREAS.length;
    if (Math.floor(G.count / AREA_LEN) !== Math.floor((G.count - gained) / AREA_LEN)) { G.area = na; G.areaShow = 2.6; Kit.sfx('win'); G.cmts.push({ s: `エリア ${Math.floor(G.count / AREA_LEN) + 1} とうちゃく！`, x: VW + 20, y: 54, sp: 140, big: 1 }); }
    hud();
  } else Kit.sfx('tap');
  if (G.st === 'stand' && G.count === 1) tip('のんびりしてると いしが しずむよ', 2500);
  if (s.type !== 'bank' && G.count >= 5 && G.count <= 7 && G.stones.some(o => o.idx === s.idx + 1 && o.x0 - s.x0 > 150)) tip('とおい ときは 空中で もう一回 タップ！', 2600);
}
function fall(msg) {
  const p = G.p; G.st = 'fall'; p.fallT = 1.3; G.life--; G.falls++; G.combo = 0;
  const sx = p.x;
  for (let i = 0; i < 34; i++) G.parts.push({ x: sx + Kit.rand(-10, 10), y: 0, vx: Kit.rand(-150, 150), vy: Kit.rand(-420, -120), life: 1, s: Kit.rand(2, 5) });
  ring(sx, 1.6); ring(sx, 1);
  Kit.noise(.5, { vol: .4, freq: 900 }); Kit.tone(110, .3, { type: 'sine', vol: .3, slide: -40 }); Kit.vibrate(70); G.shake = .3;
  G.texts.push({ x: sx, y: -70, s: msg || 'ドボン！', t: 1.2, c: '#fff', big: 1 });
  cmt('fall'); hud();
}
function respawn() {
  const p = G.p;
  if (G.life <= 0) { G.st = 'over'; Kit.music.stop(); setTimeout(showResult, 500); return; }
  // いちばん 近い うしろの いしに もどる
  let s = G.stones.filter(o => (o.type === 'bank' || o.type === 'rock' || o.type === 'small') && o.x0 <= p.x + 30).pop() || G.stones[0];
  s.sinkDown = false; s.sink = 0; s.load = 0; s.left = false;
  p.on = s; p.x = s.type === 'bank' ? s.x + s.w - 2 : s.x; p.off = p.x - s.x; p.y = TOP; G.st = 'stand'; p.squash = .3;
  // まえの いしも もとに もどす
  G.stones.forEach(o => { if (o.x0 > s.x0) { o.sinkDown = false; o.sink = 0; o.load = 0; o.left = false; } });
  Kit.sfx('pop');
}
function cmt(kind) { G.cmts.push({ s: Kit.pick(COMMENTS[kind]), x: VW + 10, y: 52 + (G.cmts.length % 3) * 24, sp: Kit.rand(110, 150) }); }
function ring(x, big) { G.rings.push({ x, t: 0, max: .9, big }); }
function burstRing(x, y) { for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; G.parts.push({ x, y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 50, life: .35, s: 2.5, c: '#fff' }); } }
const BGM = { bpm: 128, type: 'triangle', vol: .026, lead: [659, 0, 784, 659, 523, 0, 587, 0, 659, 0, 784, 0, 880, 0, 784, 0, 659, 0, 523, 587, 659, 0, 587, 0, 523, 0, 440, 0, 523, 0, 0, 0], bass: [131, 0, 196, 0, 147, 0, 220, 0, 175, 0, 262, 0, 196, 0, 247, 0] };

/* ---------- けっか ---------- */
function showResult() {
  const best = Kit.store.get('tobiishi:best', 0), isBest = G.score > best;
  if (isBest) Kit.store.set('tobiishi:best', G.score);
  const bestC = Math.max(Kit.store.get('tobiishi:bestc', 0), G.count); Kit.store.set('tobiishi:bestc', bestC);
  const c = G.count, title = c >= 125 ? 'とびいし マスター！' : c >= 75 ? 'すごい！ まだまだ 行ける' : c >= 40 ? 'いい ちょうし！' : c >= 15 ? 'ナイス ジャンプ' : 'つぎは もっと 先へ！';
  $('resCard').innerHTML = `<div class="ttl">${title}</div>
    <div class="score">${G.score}<small> てん${isBest ? '　ベスト！' : ''}</small></div>
    <div class="bd"><div><span>わたった いし</span><b>${c} こ</b></div>
    <div><span>たどりついた ところ</span><b>${AREAS[G.area].name}</b></div>
    <div><span>ピタッ！</span><b>${G.perf} かい</b></div>
    <div><span>ボール</span><b>${G.balls} こ</b></div>
    <div><span>さいだい れんぞく</span><b>${G.maxCombo}</b></div>
    <div><span>ベスト</span><b>${Math.max(best, G.score)} てん（${bestC} こ）</b></div></div>
    <div class="row"><button class="btn main" id="rAgain">もう一回</button><button class="btn" id="rMenu">もどる</button></div>`;
  $('resOv').hidden = false; $('hud').hidden = true;
  setTimeout(() => { if (isBest) { Kit.sfx('win'); Kit.confetti(); } else Kit.sfx('good'); }, 250);
  $('rAgain').onclick = () => { Kit.sfx('tap'); newGame(); };
  $('rMenu').onclick = () => { Kit.sfx('tap'); showMenu(); };
}
function showMenu() {
  G = null; Kit.music.stop(); $('resOv').hidden = true; $('hud').hidden = true; tip('');
  const b = Kit.store.get('tobiishi:best', 0), bc = Kit.store.get('tobiishi:bestc', 0);
