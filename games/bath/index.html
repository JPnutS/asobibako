<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おふろピカピカ大作戦</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #cfe8f2; }
  .stage { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 0; right: 0; top: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 0 10px; z-index: 3; pointer-events: none; font: 400 1.3rem 'Dela Gothic One', sans-serif; color: #fff; -webkit-text-stroke: 1.5px #0a3a5a; }
  .hud small { font: 900 .78rem 'Zen Maru Gothic', sans-serif; -webkit-text-stroke: 0; display: block; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .hud[hidden] { display: none; }
  .meter { flex: 1; max-width: 46%; margin-top: 4px; }
  .meter .bar { height: 14px; border-radius: 8px; background: rgba(0,40,60,.35); border: 2px solid #fff; overflow: hidden; }
  .meter .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6fd3ff, #7af0b0); transition: width .2s; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #1d6a8a; }
  .tools[hidden] { display: none; }
  .tools button { appearance: none; border: 3px solid rgba(255,255,255,.5); border-radius: 18px; height: 74px; font: 900 .95rem 'Zen Maru Gothic', sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 rgba(0,0,0,.25); cursor: pointer; transition: transform .1s; }
  .tools button big { font-size: 1.9rem; line-height: 1; }
  .tools button.on { border-color: #fff; transform: translateY(-4px); box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 0 0 4px #ffe04a; }
  .tools .spray { background: linear-gradient(160deg, #ff8ad0, #c84a9a); }
  .tools .sponge { background: linear-gradient(160deg, #ffd23a, #e0961a); }
  .tools .shower { background: linear-gradient(160deg, #4ac0ff, #1f78c8); }
  .over { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 14px; overflow: auto; background: rgba(0,40,60,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .over[hidden] { display: none; }
  .card { width: min(420px, 100%); background: #f7fcff; color: #0a3a5a; border-radius: 26px; padding: 18px 16px; display: grid; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .card h2 { margin: 0; text-align: center; font: 400 1.75rem 'Dela Gothic One', sans-serif; color: #1f78c8; -webkit-text-stroke: 1px #0a3a5a; }
  .card p { margin: 0; line-height: 1.7; font-weight: 700; font-size: .95rem; }
  .how { margin: 0; padding-left: 1.2em; line-height: 1.8; font-size: .92rem; font-weight: 700; }
  .btn { appearance: none; border: none; border-radius: 14px; font: 900 1.1rem 'Zen Maru Gothic', sans-serif; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); background: #fff; color: #0a3a5a; }
  .btn.main { background: linear-gradient(135deg, #4ac0ff, #1f78c8); color: #fff; box-shadow: 0 4px 0 #0a4a8a; }
  .row { display: flex; gap: 8px; } .row .btn { flex: 1; }
  .best { text-align: center; font-weight: 900; color: #4a7a9a; }
  .big { text-align: center; font: 400 3rem 'Dela Gothic One', sans-serif; line-height: 1; color: #1f78c8; }
  .big small { font: 900 1rem 'Zen Maru Gothic', sans-serif; color: #4a7a9a; }
  .stars { text-align: center; font-size: 2.2rem; letter-spacing: 4px; }
  .ttl { text-align: center; font: 400 1.5rem 'Dela Gothic One', sans-serif; color: #1f78c8; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div id="hL"></div>
    <div class="meter"><div class="bar"><i id="mBar"></i></div><small id="mTxt"></small></div>
    <div id="hR" style="text-align:right"></div>
  </div>
  <div class="over" id="menuOv"><div class="card">
    <h2>🛁 おふろピカピカ大作戦</h2>
    <p>よごれた おふろに ヨゴレンたちが すみついた！ 3つの どうぐを つかいわけて ピカピカに しよう。</p>
    <ul class="how">
      <li>🧴 <b>あわ</b>：なぞった ところに あわを ふきつける</li>
      <li>🧽 <b>ゴシゴシ</b>：あわの 上から こすると よごれが おちる（あわが ないと なかなか おちない）</li>
      <li>🚿 <b>シャワー</b>：のこった あわを ながす。ながさないと おわらないよ</li>
      <li>⚫ <b>カビ</b> は こすっても とれない！ あわを かけて すこし まつと とけるよ</li>
    </ul>
    <div class="best" id="mBest"></div>
    <button class="btn main" id="mStart">そうじ はじめ！</button>
  </div></div>
  <div class="over" id="midOv" hidden><div class="card" id="midCard"></div></div>
</div>
<div class="tools" id="tools" hidden>
  <button class="spray" data-t="spray"><big>🧴</big>あわ</button>
  <button class="sponge" data-t="sponge"><big>🧽</big>ゴシゴシ</button>
  <button class="shower" data-t="shower"><big>🚿</big>シャワー</button>
</div>
<script src="../../common/kit.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), cx = cv.getContext('2d');
const snd = () => Kit.settings.sound;
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- ステージ ---------- */
// kind：1＝あか（ちゃいろ・こする）、2＝水あか（かがみ・あわ＋こする）、3＝カビ（くろ・あわを かけて まつ）
const STAGES = [
  { name: 'よくそう', time: 60, grime: 5, spot: 0, mold: 0 },
  { name: 'かがみも', time: 70, grime: 4, spot: 4, mold: 0 },
  { name: 'カビが でた！', time: 75, grime: 3, spot: 3, mold: 4 },
  { name: 'ぜんぶ ピカピカに', time: 80, grime: 6, spot: 4, mold: 6 },
];
const COLS = 48;
let G = null, W = 0, H = 0, DPR = 1, ROWS = 0, CS = 8;
let d, f, fd, kind, reg, wet;   // よごれ／あわ／あわの よごれぐあい／しゅるい／ばしょ
// ばしょ（0＝かべ、1＝よくそう、2＝かがみ、3＝ゆか）
function layout() {
  return {
    mirror: { x0: .08, x1: .42, y0: .14, y1: .40 },
    tub: { x0: .04, x1: .96, y0: .54, y1: .86 },
    head: { x: .86, y: .11 },
  };
}
function regionAt(nx, ny) {
  const L = layout(), m = L.mirror, t = L.tub;
  if (nx > m.x0 && nx < m.x1 && ny > m.y0 && ny < m.y1) return 2;
  if (nx > t.x0 && nx < t.x1 && ny > t.y0 && ny < t.y1) return 1;
  if (ny >= t.y1) return 3;
  return 0;
}
function buildGrid() {
  CS = W / COLS; ROWS = Math.ceil(H / CS); const n = COLS * ROWS;
  d = new Float32Array(n); f = new Float32Array(n); fd = new Float32Array(n); kind = new Uint8Array(n); reg = new Uint8Array(n); wet = new Float32Array(n);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) reg[r * COLS + c] = regionAt((c + .5) / COLS, (r + .5) * CS / H);
}
function blob(k, regs, rMin, rMax) {
  for (let tries = 0; tries < 60; tries++) {
    const c = Math.floor(rnd(2, COLS - 2)), r = Math.floor(rnd(3, ROWS - 2)), i = r * COLS + c;
    if (!regs.includes(reg[i]) || kind[i]) continue;
    const R = rnd(rMin, rMax), sq = rnd(.7, 1.3), lumps = [rnd(0, TAU), rnd(.15, .35)];
    let cells = 0;
    for (let y = -Math.ceil(R * 1.4); y <= Math.ceil(R * 1.4); y++) for (let x = -Math.ceil(R * 1.4); x <= Math.ceil(R * 1.4); x++) {
      const cc = c + x, rr = r + y; if (cc < 0 || rr < 0 || cc >= COLS || rr >= ROWS) continue;
      const j = rr * COLS + cc; if (!regs.includes(reg[j])) continue;
      const a = Math.atan2(y, x), rad = R * (1 + Math.sin(a * 3 + lumps[0]) * lumps[1]), dist = Math.hypot(x * sq, y / sq);
      if (dist < rad) { d[j] = Math.max(d[j], clamp(1.4 - dist / rad * .7, .3, 1)); kind[j] = k; cells++; }
    }
    if (cells) G.blobs.push({ k, c, r, R, n: cells, left: 1, face: pick(FACES), hurt: 0, said: 0 });
    return;
  }
}
const FACES = ['ヨゴレン', 'ベタベタン', 'ヌルリン', 'ザラザラ', 'モヤモヤ'];
const BLOB_COL = { 1: [150, 105, 55], 2: [235, 240, 235], 3: [35, 40, 35] };

/* ---------- ゲーム ---------- */
function newGame() { G = { stage: 0, total: 0, stars: [] }; startStage(); }
function startStage() {
  const S = STAGES[G.stage];
  Object.assign(G, { t: 0, left: S.time, blobs: [], over: false, clear: false, tool: G.tool || 'spray', fx: [], hint: 0, hinted: {}, sq: 0, spark: 0, drips: [] });
  $('menuOv').hidden = true; $('midOv').hidden = true; $('hud').hidden = false; $('tools').hidden = false;
  resize(true); buildGrid();
  for (let i = 0; i < S.grime; i++) blob(1, [1], 2.2, 4.2);
  for (let i = 0; i < S.spot; i++) blob(2, [2], 1.6, 2.8);
  for (let i = 0; i < S.mold; i++) blob(3, i % 2 ? [1] : [0, 3], 1.4, 2.6);
  G.init = dirtyCount();
  setTool(G.tool);
  banner(`ステージ ${G.stage + 1}：${S.name}`);
  if (snd()) Kit.sfx('select');
}
function dirtyCount() { let n = 0; for (let i = 0; i < d.length; i++) if (d[i] > .06 || f[i] > .08) n++; return n; }
function setTool(t) { G.tool = t; document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
document.querySelectorAll('#tools button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); if (!G) return; setTool(b.dataset.t); if (snd()) Kit.sfx('tap'); }));
addEventListener('keydown', e => { if (!G) return; const t = { Digit1: 'spray', Digit2: 'sponge', Digit3: 'shower', KeyA: 'spray', KeyS: 'sponge', KeyD: 'shower' }[e.code]; if (t) setTool(t); });

/* ---------- ゆびの うごき ---------- */
let ptr = null;
cv.addEventListener('pointerdown', e => { if (!G || G.over || G.clear) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); const p = pos(e); ptr = { id: e.pointerId, x: p.x, y: p.y, px: p.x, py: p.y }; Kit.audio(); });
cv.addEventListener('pointermove', e => { if (!ptr || e.pointerId !== ptr.id) return; const p = pos(e); ptr.x = p.x; ptr.y = p.y; });
const up = e => { if (ptr && e.pointerId === ptr.id) { ptr = null; stopLoop(); } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function each(x, y, rad, fn) {   // ゆびの まわりの マス
  const c0 = x / CS, r0 = y / CS, R = Math.ceil(rad);
  for (let r = Math.floor(r0 - R); r <= r0 + R; r++) for (let c = Math.floor(c0 - R); c <= c0 + R; c++) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) continue;
    const dist = Math.hypot(c + .5 - c0, r + .5 - r0); if (dist > rad) continue;
    fn(r * COLS + c, 1 - dist / rad);
  }
}
function useTool(dt) {
  if (!ptr) return;
  const mv = Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py) / CS;   // うごいた きょり（マス）
  // あいだを うめる
  const steps = Math.max(1, Math.ceil(mv / 1.2));
  for (let s = 1; s <= steps; s++) {
    const x = ptr.px + (ptr.x - ptr.px) * s / steps, y = ptr.py + (ptr.y - ptr.py) * s / steps, sdt = dt / steps, smv = mv / steps;
    if (G.tool === 'spray') {
      each(x, y, 3.2, (i, w) => { f[i] = Math.min(1, f[i] + sdt * 5 * (.4 + w)); });
      if (Math.random() < .5) G.fx.push({ k: 'b', x: x + rnd(-1, 1) * CS * 2, y: y + rnd(-1, 1) * CS * 2, t: 0, r: rnd(3, 7) });
    } else if (G.tool === 'sponge') {
      let moldHit = false, dryHit = false;
      each(x, y, 2.6, (i, w) => {
        if (d[i] <= 0) return;
        const foam = f[i] > .15, rub = smv * w;
        if (kind[i] === 3) { moldHit = true; return; }
        const k = kind[i] === 2 ? (foam ? .09 : .008) : (foam ? .11 : .025);
        if (!foam) dryHit = true;
        d[i] = Math.max(0, d[i] - rub * k);
        if (foam) fd[i] = Math.min(1, fd[i] + rub * .05);
      });
      // あわを すこし のばす
      each(x, y, 2.6, (i, w) => { if (f[i] > .2) each(x + rnd(-1, 1) * CS, y + rnd(-1, 1) * CS, 1, j => { f[j] = Math.max(f[j], f[i] * .6); }); });
      if (smv > .2) { G.sq += smv; if (G.sq > 3) { G.sq = 0; squeak(); } }
      if (moldHit && smv > .3) hint('mold', '⚫ カビは こすっても とれない！ あわを かけて まってね');
      else if (dryHit && smv > .3) hint('dry', '🧴 あわを かけてから こすると よく おちるよ');
    } else {
      each(x, y, 3.6, (i, w) => { f[i] = Math.max(0, f[i] - sdt * 4.5 * (.4 + w)); if (f[i] < .05) fd[i] = 0; wet[i] = 1; });
      if (G.drips.length < 40 && Math.random() < .25 && y < H * layout().tub.y0) G.drips.push({ x: x + rnd(-1, 1) * CS * 3, y0: y, y: y, v: rnd(25, 70), t: 0 });
      for (let k = 0; k < 2; k++) G.fx.push({ k: 'w', x: x + rnd(-1, 1) * CS * 2, y: y + rnd(-1, 1) * CS * 1.5, t: 0, vy: rnd(-220, -60), vx: rnd(-160, 160) });
    }
  }
  if (G.tool === 'spray' || G.tool === 'shower') startLoop(G.tool);
  ptr.px = ptr.x; ptr.py = ptr.y;
}
function hint(key, msg) { if (G.hinted[key] && G.t - G.hinted[key] < 6) return; G.hinted[key] = G.t; tip(msg, 2200); }

/* ---------- おと ---------- */
let loopSrc = null, loopKind = '';
function startLoop(k) {   // シュー／ザーー の ながい おと
  if (!snd() || loopKind === k) return; stopLoop();
  const a = Kit.audio(); if (!a) return;
  const len = a.sampleRate, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; s.loop = true;
  fl.type = k === 'spray' ? 'highpass' : 'bandpass'; fl.frequency.value = k === 'spray' ? 4000 : 900; fl.Q.value = .6;
  g.gain.value = 0; g.gain.linearRampToValueAtTime(k === 'spray' ? .08 : .12, a.currentTime + .05);
  s.connect(fl); fl.connect(g); g.connect(a.destination); s.start();
  loopSrc = { s, g, a }; loopKind = k;
}
function stopLoop() {
  if (!loopSrc) return; const { s, g, a } = loopSrc; loopSrc = null; loopKind = '';
  try { g.gain.linearRampToValueAtTime(0, a.currentTime + .08); s.stop(a.currentTime + .1); } catch (e) { }
}
function squeak() { if (snd()) Kit.tone(rnd(900, 1400), .07, { type: 'triangle', vol: .05, slide: rnd(-300, 300) }); }

/* ---------- まいフレーム ---------- */
function step(dt) {
  G.t += dt;
  for (const p of G.fx) { p.t += dt; if (p.k === 'w') { p.y += p.vy * dt; p.x += p.vx * dt; p.vy += 900 * dt; } }
  G.fx = G.fx.filter(p => p.t < (p.k === 'w' ? .35 : p.k === 's' ? .9 : .5));
  for (const q of G.drips) { q.t += dt; q.y += q.v * dt; } G.drips = G.drips.filter(q => q.t < 3 && q.y < H * layout().tub.y0);
  for (let i = 0; i < wet.length; i++) if (wet[i] > 0) wet[i] = Math.max(0, wet[i] - dt * .12);
  if (G.over || G.clear) return;
  G.left -= dt;
  useTool(dt);
  // カビは あわで とける
  for (let i = 0; i < d.length; i++) if (kind[i] === 3 && d[i] > 0 && f[i] > .3) { d[i] = Math.max(0, d[i] - dt * .55); if (Math.random() < .01) G.fx.push({ k: 'z', x: (i % COLS + .5) * CS, y: (Math.floor(i / COLS) + .5) * CS, t: 0 }); fd[i] = Math.max(fd[i], .5); }
  // ヨゴレンの のこり
  G.chk = (G.chk || 0) + dt;
  if (G.chk > .15) {
    G.chk = 0;
    for (const b of G.blobs) {
      if (b.left <= 0) continue;
      let sum = 0, n = 0; const R = Math.ceil(b.R * 1.4);
      for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) { const c = b.c + x, r = b.r + y; if (c < 0 || r < 0 || c >= COLS || r >= ROWS) continue; const j = r * COLS + c; if (kind[j] === b.k) { sum += d[j]; n++; } }
      const nl = n ? sum / (b.n * .9) : 0;
      if (nl < b.left - .01) b.hurt = .4;
      b.left = nl < .08 ? 0 : nl;
      if (b.left === 0) {   // やっつけた
        for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) { const c = b.c + x, r = b.r + y; if (c < 0 || r < 0 || c >= COLS || r >= ROWS) continue; const j = r * COLS + c; if (kind[j] === b.k) d[j] = 0; }
        const p = { x: (b.c + .5) * CS, y: (b.r + .5) * CS };
        say(pick(['やられた〜', 'ピカーン！', 'まいった〜', 'きゅ〜']), p.x, p.y);
        for (let k = 0; k < 6; k++) G.fx.push({ k: 's', x: p.x + rnd(-1, 1) * 30, y: p.y + rnd(-1, 1) * 20, t: rnd(-.2, 0) });
        if (snd()) { Kit.tone(1320, .08, { type: 'triangle', vol: .1 }); Kit.tone(1760, .12, { type: 'triangle', vol: .1, delay: .07 }); }
      }
    }
    const nd = dirtyCount(); G.pct = clamp(1 - nd / Math.max(1, G.init), 0, 1);
    const allDirtGone = G.blobs.every(b => b.left === 0);
    if (allDirtGone && !G.rinseHint && nd > G.init * .02) { G.rinseHint = 1; tip('🚿 さいごに シャワーで あわを ながそう！', 2400); }
    if (allDirtGone && nd <= Math.max(3, G.init * .015)) return stageClear();
    hud();
  }
  for (const b of G.blobs) b.hurt = Math.max(0, b.hurt - dt);
  if (G.left <= 0) { G.left = 0; timeUp(); }
}
function stageClear() {
  G.clear = true; ptr = null; stopLoop();
  for (let i = 0; i < f.length; i++) { f[i] = 0; d[i] = 0; wet[i] = 1; }
  const S = STAGES[G.stage], tl = Math.ceil(G.left), st = tl >= S.time * .45 ? 3 : tl >= S.time * .2 ? 2 : 1;
  const pts = 100 + tl * 10; G.total += pts; G.stars.push(st); G.spark = 1;
  if (snd()) { Kit.sfx('win'); } Kit.confetti && Kit.confetti();
  hud();
  const last = G.stage >= STAGES.length - 1;
  setTimeout(() => {
    $('midCard').innerHTML = `<div class="ttl">ピカピカ！ ステージ ${G.stage + 1} クリア</div>
      <div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div>
      <div class="best">のこり ${tl}びょう　+${pts}てん（ごうけい ${G.total}てん）</div>
      <button class="btn main" id="nx">${last ? 'けっかを みる' : 'つぎの ステージへ'}</button>`;
    $('midOv').hidden = false;
    $('nx').onclick = () => { Kit.sfx('tap'); if (last) showResult(true); else { G.stage++; startStage(); } };
  }, 1300);
}
function timeUp() {
  G.over = true; ptr = null; stopLoop(); if (snd()) Kit.sfx('bad');
  setTimeout(() => showResult(false), 900);
  banner('じかん ぎれ〜');
}
function showResult(all) {
  $('hud').hidden = true; $('tools').hidden = true;
