<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おこづかい電卓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  /* 履歴つきの電卓：上に 最初の金額、まん中に 履歴、下に 残り と キー */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .calc { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
    padding: 10px max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }

  .start { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 12px; border: 3px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .start span { font-weight: 900; }
  .start b { font-family: var(--display); font-weight: 400; font-size: 1.7rem; }
  .start.on { border-color: var(--orange); box-shadow: 0 0 0 4px #ffc89e; }

  .tape { flex: 1; min-height: 70px; overflow-y: auto; border-top: 2px dashed var(--muted); border-bottom: 2px dashed var(--muted); padding: 4px 2px; display: flex; flex-direction: column; gap: 2px; }
  .tape .empty { margin: auto; color: var(--muted); font-size: .9rem; text-align: center; }
  .row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 8px; }
  .row input { border: 0; border-bottom: 1px dotted var(--muted); background: transparent; color: var(--ink); font: 700 .95rem var(--font); min-width: 0; padding: 3px 0; }
  .row input:focus { outline: none; border-bottom-color: var(--sky); }
  .row .amt { font: 900 1.05rem var(--font); color: inherit; background: none; border: 0; border-bottom: 2px dotted var(--muted); padding: 2px 2px; cursor: pointer; }
  .row.edit { outline: 3px solid var(--orange); }
  .row .tg { border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); font: 900 .75rem var(--font); padding: 3px 6px; cursor: pointer; }
  .row .tg[aria-pressed="true"] { background: #d6efff; color: #1d7fc4; border-color: #1d7fc4; border-style: dashed; }
  .row .del { border: 0; background: none; font-size: 1rem; padding: 2px 4px; cursor: pointer; opacity: .7; }
  .row.hold { background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(76,184,255,.12) 6px 12px); }
  .row.hold .amt { color: #1d7fc4; }

  .left { text-align: right; line-height: 1.15; }
  .left .lbl { font-weight: 900; font-size: .9rem; color: var(--muted); }
  .left .big { font-family: var(--display); font-size: clamp(2.4rem, 12vw, 3.2rem); display: block; }
  .left .big.minus { color: #e0234a; }
  .left .if { font-size: .9rem; font-weight: 700; color: #1d7fc4; }

  .disp { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 3px solid var(--line); border-radius: 12px; padding: 4px 12px; background: var(--soft); min-height: 50px; }
  .disp .hint { font-size: .85rem; font-weight: 700; color: var(--muted); }
  .disp .v { font-family: var(--display); font-size: 1.6rem; text-align: right; line-height: 1.15; word-break: break-all; }
  .disp .v small { display: block; font-size: 1rem; color: var(--muted); }

  .keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(42px, 6.3vh); gap: 6px; }
  .keys .k-btn { min-height: 0; padding: 2px; font-size: 1.35rem; }
  .keys .k-btn.s { font-size: .95rem; }
  .keys .buy { grid-column: 3 / span 2; }
  .keys .op { background: var(--soft); font-size: 1.5rem; }
  .keys .hold { background: #d6efff; color: #2a2238; border-style: dashed; }
  .keys .buy small, .keys .hold small { font-size: .7rem; font-weight: 700; }
</style>
</head>
<body>
<div class="calc">
  <button class="start" id="start"><span>👛 最初の金額</span><b class="num" id="startV"></b></button>
  <div class="tape" id="tape"></div>
  <div class="left"><span class="lbl">残り</span><span class="big num" id="left"></span><span class="if" id="ifHold"></span></div>
  <div class="disp"><span class="hint" id="hint"></span><span class="v num" id="disp"></span></div>
  <div class="keys" id="keys"></div>
</div>

<script src="../../common/kit.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const yen = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ja-JP') + '円';
const KEY = 'omatsuri:state2';
let st = Kit.store.get(KEY, null);
if (!st) { // まえの形（買った／買うかも）から うつす
  const o = Kit.store.get('omatsuri:state', {}) || {};
  st = { budget: o.budget || 0, items: [
    ...(o.bought || []).map(b => ({ name: b.name || '', amt: b.price, hold: false, t: b.t || Date.now() })),
    ...(o.plan || []).map(p => ({ name: p.name || '', amt: p.price, hold: true, t: Date.now() })),
  ] };
}
const save = () => Kit.store.set(KEY, st);
let ex = '', mode = st.budget ? 'item' : 'budget', editing = null; // mode：budget 最初の金額／item 値段／edit 記録を直す
const OPS = '+−×÷';

// 四則演算：× ÷ を先に。答えは 円なので 四捨五入
function calc(e) {
  const t = e.match(/\d+|[+−×÷]/g) || [];
  if (t.length && OPS.includes(t[t.length - 1])) t.pop();
  if (!t.length) return 0;
  const terms = [[+t[0]]]; // たし算・ひき算で くぎった かたまり
  for (let i = 1; i < t.length; i += 2) {
    const op = t[i], n = +t[i + 1], cur = terms[terms.length - 1];
    if (op === '×') cur[0] *= n;
    else if (op === '÷') { if (!n) return null; cur[0] /= n; }
    else terms.push([op === '−' ? -n : n]);
  }
  return Math.round(terms.reduce((s, [v]) => s + v, 0));
}
const fmt = e => e.replace(/\d+/g, d => Number(d).toLocaleString('ja-JP'));

const usedSum = () => st.items.filter(i => !i.hold).reduce((s, i) => s + i.amt, 0);
const holdSum = () => st.items.filter(i => i.hold).reduce((s, i) => s + i.amt, 0);

function render() {
  $('startV').textContent = st.budget ? yen(st.budget) : '—';
  $('start').classList.toggle('on', mode === 'budget');
  const left = st.budget - usedSum(), hold = holdSum();
  $('left').textContent = yen(left);
  $('left').classList.toggle('minus', left < 0);
  $('ifHold').textContent = hold ? `保留も買うと ${yen(left - hold)}` : '';

  const tape = $('tape');
  tape.innerHTML = st.items.length ? '' : '<div class="empty">金額を入れて「買った」を押すと<br>ここに 書かれていきます</div>';
  st.items.forEach(it => {
    const r = Kit.el(`<div class="row ${it.hold ? 'hold' : ''} ${it === editing ? 'edit' : ''}"><input maxlength="14" placeholder="名前"><button class="amt num" aria-label="金額を直す">−${it.amt.toLocaleString('ja-JP')}</button><button class="tg" aria-pressed="${it.hold}">保留</button><button class="del" aria-label="消す">🗑️</button></div>`);
    const nm = r.querySelector('input'); nm.value = it.name;
    nm.oninput = () => { it.name = nm.value; save(); };
    r.querySelector('.amt').onclick = () => { editing = it; mode = 'edit'; ex = it.ex || String(it.amt); Kit.sfx('select'); render(); };
    r.querySelector('.tg').onclick = () => { it.hold = !it.hold; save(); Kit.sfx(it.hold ? 'pop' : 'coin'); render(); };
    r.querySelector('.del').onclick = async () => {
      if (!(await Kit.ask(`${it.name ? `「${Kit.esc(it.name)}」` : ''}${yen(it.amt)} を消しますか？`, '消す', 'やめる'))) return;
      st.items = st.items.filter(i => i !== it); if (editing === it) { editing = null; mode = 'item'; ex = ''; }
      save(); Kit.sfx('drop'); render();
    };
    tape.appendChild(r);
  });
  if (!editing) tape.scrollTop = tape.scrollHeight;

  const v = calc(ex), hasOp = /\d[+−×÷]/.test(ex);
  $('disp').innerHTML = ex ? `${fmt(ex)}${hasOp ? `<small>＝ ${v == null ? '？' : v.toLocaleString('ja-JP')}</small>` : ''}` : '0';
  $('hint').textContent = { budget: '最初の金額を入力', item: '値段', edit: '記録を直す' }[mode];
  buyBtn.innerHTML = { budget: '決定', item: '買った', edit: '直す' }[mode];
  holdBtn.innerHTML = mode === 'edit' ? 'やめる' : '保留';
  holdBtn.style.visibility = mode === 'budget' ? 'hidden' : '';
}

function enter(hold) {
  const v = calc(ex);
  if (mode === 'edit' && hold) { editing = null; mode = 'item'; ex = ''; render(); return; } // やめる
  if (!v || v < 0) { if (ex) { Kit.sfx('bad'); Kit.toast('金額が 正しくありません'); } return; }
  const memo = /\d[+−×÷]/.test(ex) ? ex : '';
  if (mode === 'budget') { st.budget = v; mode = 'item'; Kit.sfx('good'); }
  else if (mode === 'edit') { editing.amt = v; editing.ex = memo; editing = null; mode = 'item'; Kit.sfx('good'); }
  else { st.items.push({ name: '', amt: v, ex: memo, hold, t: Date.now() }); Kit.sfx(hold ? 'pop' : 'coin'); Kit.vibrate(15); }
  ex = ''; save(); render();
}

// 7 8 9 ÷ ／ 4 5 6 × ／ 1 2 3 − ／ 0 00 ⌫ ＋ ／ C 保留 [買った]
const KEYS = ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '00', '⌫', '+', 'C'];
KEYS.forEach(k => {
  const op = OPS.includes(k);
  const b = Kit.el(`<button class="k-btn ${op ? 'op' : ''} ${k === 'C' ? 's is-berry' : k === '⌫' ? 's' : ''}">${k === '+' ? '＋' : k}</button>`);
  b.onclick = () => {
    if (k === 'C') ex = '';
    else if (k === '⌫') ex = ex.slice(0, -1);
    else if (op) { if (!ex) return; ex = OPS.includes(ex.slice(-1)) ? ex.slice(0, -1) + k : ex + k; }
    else if (ex.length < 24) { // 先頭の 0 は つけない
      const last = ex.match(/\d*$/)[0];
      if ((last === '' || last === '0') && k[0] === '0') ex = ex.slice(0, ex.length - last.length) + '0';
      else ex = (last === '0' ? ex.slice(0, -1) : ex) + k;
    }
    Kit.sfx('tap'); render();
  };
  $('keys').appendChild(b);
});
const holdBtn = Kit.el('<button class="k-btn s hold"></button>');
holdBtn.onclick = () => enter(true);
const buyBtn = Kit.el('<button class="k-btn is-orange buy"></button>');
buyBtn.onclick = () => enter(false);
$('keys').append(holdBtn, buyBtn);

$('start').onclick = () => {
  mode = mode === 'budget' ? 'item' : 'budget'; editing = null; ex = ''; Kit.sfx('select'); render();
};

Kit.bar({ id: 'omatsuri', title: '💰 おこづかい電卓', help: `
  <p>① 上の「最初の金額」を押して、もらったお金を入れて「決定」。</p>
  <p>② 買った物の値段を入れて「<b>買った</b>」。残りが減って、上に記録されます。名前は記録の行に書けます。</p>
  <p>③ まだ買うか決めていない物は「<b>保留</b>」。残りは減らずに、「保留も買うと ○円」が出ます。</p>
  <p>記録の金額を押すと直せます。「保留」で 保留⇔買った を切りかえ、🗑️で消せます。</p>
  <p>電卓は ＋ − × ÷ が使えます（例：150×3）。</p>` });
const reset = Kit.el('<button class="k-btn k-icon" aria-label="ぜんぶ消す" title="ぜんぶ消す">🗑️</button>');
reset.onclick = async () => {
  if (!(await Kit.ask('最初の金額と記録を全部消しますか？', '消す', 'やめる'))) return;
  st = { budget: 0, items: [] }; save(); ex = ''; editing = null; mode = 'budget'; render();
};
document.querySelector('.kbar-extra').appendChild(reset);
render();
</script>
</body>
</html>
