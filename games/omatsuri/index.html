<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おこづかい電卓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  /* 履歴つきの電卓：上に 最初の金額、まん中に 履歴、下に 残り と キー */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .calc { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
    padding: 10px max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }

  .start { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 12px; border: 3px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .start span { font-weight: 900; }
  .start b { font-family: var(--display); font-weight: 400; font-size: 1.7rem; }
  .start.on { border-color: var(--orange); box-shadow: 0 0 0 4px #ffc89e; }

  .tape { flex: 1; min-height: 70px; overflow-y: auto; border-top: 2px dashed var(--muted); border-bottom: 2px dashed var(--muted); padding: 4px 2px; display: flex; flex-direction: column; gap: 2px; }
  .tape .empty { margin: auto; color: var(--muted); font-size: .9rem; text-align: center; }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 8px; }
  .row input { border: 0; border-bottom: 1px dotted var(--muted); background: transparent; color: var(--ink); font: 700 .95rem var(--font); min-width: 0; padding: 3px 0; }
  .row input:focus { outline: none; border-bottom-color: var(--sky); }
  .row .amt { font-weight: 900; font-size: 1.05rem; }
  .row .more { border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 2px 6px; cursor: pointer; }
  .row.hold { background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(76,184,255,.12) 6px 12px); }
  .row.hold .amt { color: #1d7fc4; }
  .row.hold .amt::before { content: '保留 '; font-size: .7rem; border: 1.5px solid #1d7fc4; border-radius: 6px; padding: 0 4px; margin-right: 4px; vertical-align: 2px; }

  .left { text-align: right; line-height: 1.15; }
  .left .lbl { font-weight: 900; font-size: .9rem; color: var(--muted); }
  .left .big { font-family: var(--display); font-size: clamp(2.4rem, 12vw, 3.2rem); display: block; }
  .left .big.minus { color: #e0234a; }
  .left .if { font-size: .9rem; font-weight: 700; color: #1d7fc4; }

  .disp { display: flex; justify-content: space-between; align-items: center; border: 3px solid var(--line); border-radius: 12px; padding: 4px 12px; background: var(--soft); min-height: 50px; }
  .disp .hint { font-size: .85rem; font-weight: 700; color: var(--muted); }
  .disp .v { font-family: var(--display); font-size: 1.7rem; }

  .keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(48px, 7.2vh); gap: 6px; }
  .keys .k-btn { min-height: 0; padding: 2px; font-size: 1.35rem; }
  .keys .k-btn.s { font-size: .95rem; }
  .keys .buy { grid-column: 4; grid-row: 3 / span 2; flex-direction: column; gap: 0; }
  .keys .hold { background: #d6efff; color: #2a2238; border-style: dashed; }
  .keys .buy small, .keys .hold small { font-size: .7rem; font-weight: 700; }
</style>
</head>
<body>
<div class="calc">
  <button class="start" id="start"><span>👛 最初の金額</span><b class="num" id="startV"></b></button>
  <div class="tape" id="tape"></div>
  <div class="left"><span class="lbl">残り</span><span class="big num" id="left"></span><span class="if" id="ifHold"></span></div>
  <div class="disp"><span class="hint" id="hint"></span><span class="v num" id="disp"></span></div>
  <div class="keys" id="keys"></div>
</div>

<script src="../../common/kit.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const yen = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ja-JP') + '円';
const KEY = 'omatsuri:state2';
let st = Kit.store.get(KEY, null);
if (!st) { // まえの形（買った／買うかも）から うつす
  const o = Kit.store.get('omatsuri:state', {}) || {};
  st = { budget: o.budget || 0, items: [
    ...(o.bought || []).map(b => ({ name: b.name || '', amt: b.price, hold: false, t: b.t || Date.now() })),
    ...(o.plan || []).map(p => ({ name: p.name || '', amt: p.price, hold: true, t: Date.now() })),
  ] };
}
const save = () => Kit.store.set(KEY, st);
let input = 0, mode = st.budget ? 'item' : 'budget'; // mode：budget＝最初の金額を入力中

const usedSum = () => st.items.filter(i => !i.hold).reduce((s, i) => s + i.amt, 0);
const holdSum = () => st.items.filter(i => i.hold).reduce((s, i) => s + i.amt, 0);

function render() {
  $('startV').textContent = st.budget ? yen(st.budget) : '—';
  $('start').classList.toggle('on', mode === 'budget');
  const left = st.budget - usedSum(), hold = holdSum();
  $('left').textContent = yen(left);
  $('left').classList.toggle('minus', left < 0);
  $('ifHold').textContent = hold ? `保留も買うと ${yen(left - hold)}` : '';

  const tape = $('tape');
  tape.innerHTML = st.items.length ? '' : '<div class="empty">金額を入れて「買った」を押すと<br>ここに 書かれていきます</div>';
  st.items.forEach(it => {
    const r = Kit.el(`<div class="row ${it.hold ? 'hold' : ''}"><input maxlength="14" placeholder="名前"><span class="amt num">−${it.amt.toLocaleString('ja-JP')}</span><button class="more" aria-label="なおす">⋯</button></div>`);
    const nm = r.querySelector('input'); nm.value = it.name;
    nm.oninput = () => { it.name = nm.value; save(); };
    r.querySelector('.more').onclick = () => editItem(it);
    tape.appendChild(r);
  });
  tape.scrollTop = tape.scrollHeight;

  $('disp').textContent = input ? input.toLocaleString('ja-JP') : '0';
  $('hint').textContent = mode === 'budget' ? '最初の金額を入力' : '値段';
  document.querySelector('.buy').innerHTML = mode === 'budget' ? '決定' : '買った<small>はらった</small>';
  document.querySelector('.hold').hidden = mode === 'budget';
}

function editItem(it) {
  const name = it.name ? `「${Kit.esc(it.name)}」` : '';
  Kit.modal({ title: `${name}${yen(it.amt)}`, body: '', actions: [
    { label: '🗑️ 消す', cls: 'is-berry', onClick: () => { st.items = st.items.filter(i => i !== it); save(); Kit.sfx('drop'); render(); } },
    { label: '🔢 金額を直す', onClick: () => { st.items = st.items.filter(i => i !== it); input = it.amt; editing = it; save(); render(); } },
    it.hold ? { label: '✅ 買った', primary: true, onClick: () => { it.hold = false; it.t = Date.now(); save(); Kit.sfx('coin'); render(); } }
            : { label: '⏸ 保留にもどす', onClick: () => { it.hold = true; save(); render(); } },
  ] });
}
let editing = null; // 「金額を直す」中の項目（名前と 保留かどうかを のこす）

function add(hold) {
  if (mode === 'budget') { if (!input) return; st.budget = input; input = 0; mode = 'item'; save(); Kit.sfx('good'); render(); return; }
  if (!input) return;
  st.items.push({ name: editing ? editing.name : '', amt: input, hold, t: Date.now() });
  editing = null; input = 0; save();
  Kit.sfx(hold ? 'pop' : 'coin'); Kit.vibrate(15);
  render();
}

const KEYS = [['7'], ['8'], ['9'], ['⌫', 's'], ['4'], ['5'], ['6'], ['C', 's is-berry'], ['1'], ['2'], ['3'], ['0'], ['00'], ['保留', 's hold']];
KEYS.forEach(([k, cls = '']) => {
  const b = Kit.el(`<button class="k-btn ${cls}">${k === '保留' ? '保留<small>まだ</small>' : k}</button>`);
  b.onclick = () => {
    if (k === '保留') return add(true);
    if (k === 'C') input = 0;
    else if (k === '⌫') input = Math.floor(input / 10);
    else { const v = Number(String(input) + k); if (v < 1000000) input = v; }
    Kit.sfx('tap'); render();
  };
  $('keys').appendChild(b);
});
// 「買った」は 右下の 大きいキー（7 8 9 ⌫ ／ 4 5 6 C ／ 1 2 3 買 ／ 0 00 保留 買）
const buyBtn = Kit.el('<button class="k-btn is-orange buy"></button>');
buyBtn.onclick = () => add(false);
$('keys').appendChild(buyBtn);

$('start').onclick = () => {
  mode = mode === 'budget' ? 'item' : 'budget'; input = 0; Kit.sfx('select'); render();
};

Kit.bar({ id: 'omatsuri', title: '💰 おこづかい電卓', help: `
  <p>① 上の「最初の金額」を押して、もらったお金を入れて「決定」。</p>
  <p>② 買った物の値段を入れて「<b>買った</b>」。残りが減って、上に記録されます。名前は記録の行に書けます。</p>
  <p>③ まだ買うか決めていない物は「<b>保留</b>」。残りは減らずに、「保留も買うと ○円」が出ます。</p>
  <p>記録の「⋯」で、消す・金額を直す・保留→買った ができます。</p>` });
const reset = Kit.el('<button class="k-btn k-icon" aria-label="ぜんぶ消す" title="ぜんぶ消す">🗑️</button>');
reset.onclick = async () => {
  if (!(await Kit.ask('最初の金額と記録を全部消しますか？', '消す', 'やめる'))) return;
  st = { budget: 0, items: [] }; save(); input = 0; mode = 'budget'; render();
};
document.querySelector('.kbar-extra').appendChild(reset);
render();
</script>
</body>
</html>
