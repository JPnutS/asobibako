<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おまつりおこづかい</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  .k-wrap { max-width: 520px; }
  :root { --used: #ff8a3d; --plan: #4cb8ff; --left: #4fcf7a; --over: #ff3b5c; }
  .big { font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }

  /* おこづかい */
  .budget { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-weight: 900; }
.slot { font: 400 1.7rem var(--display); text-align: right; padding: 4px 12px; min-width: 0; border: 3px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
  .slot.on { border-color: var(--orange); box-shadow: 0 0 0 4px #ffc89e; }
  .slot.empty { color: var(--muted); }
  .bar { height: 22px; border: 3px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; background: var(--left); }
  .bar i { display: block; height: 100%; transition: width .3s; }
  .bar .u { background: var(--used); }
  .bar .p { background: repeating-linear-gradient(-45deg, var(--plan) 0 8px, #9fd8ff 8px 16px); }
  .bar .o { background: repeating-linear-gradient(-45deg, var(--over) 0 8px, #ff9aac 8px 16px); }
  .legend { display: grid; grid-template-columns: 1fr 1fr 1.5fr; align-items: stretch; gap: 6px; text-align: center; font-size: .82rem; font-weight: 700; }
  .legend div { border-radius: 10px; padding: 4px 2px; border: 2px solid var(--line); color: #2a2238; }
  .legend b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .legend .lg-l b { font-family: var(--display); font-weight: 400; font-size: clamp(1.15rem, 5.4vw, 1.7rem); white-space: nowrap; }
  .lg-l { border-width: 3px !important; }
  .lg-u { background: #ffe0c9; } .lg-p { background: #d6efff; border-style: dashed !important; } .lg-l { background: #d5f6df; }

  /* でんたく */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pad .k-btn { min-height: 50px; font-size: 1.4rem; padding: 4px; }
  .ifbox { border: 3px dashed var(--plan); border-radius: 16px; padding: 8px 12px; background: #eef8ff; color: #2a2238; display: grid; gap: 2px; }
  .ifbox.over { border-color: var(--over); background: #fff0f3; }
  .ifbox .ttl { font-weight: 900; color: #1d6fae; font-size: .9rem; }
  .ifbox.over .ttl { color: #c4193b; }
  .ifbox .calc { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
  .ifbox .calc { flex-wrap: nowrap; white-space: nowrap; }
  .ifbox .calc .slot { font-size: 1.4rem; min-width: 4.2em; padding: 2px 10px; }
  .ifbox .big { font-size: 1.9rem; text-align: right; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-plan { background: #d6efff; color: #2a2238; border-style: dashed !important; }

  /* リスト */
  h2.sec { font-size: 1.05rem; margin: 0; }
  .list { display: grid; gap: 6px; }
  .it { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; background: var(--card); }
  .it.plan { border-style: dashed; background: #eef8ff; color: #2a2238; }
  .it.plan.off { opacity: .5; }
  .it .nm { border: 0; border-bottom: 2px dotted var(--muted); background: transparent; color: inherit; font: 700 1rem var(--font); min-width: 0; padding: 2px 0; }
  .it .nm:focus { outline: none; border-bottom-color: var(--sky); }
  .it .tm { font-size: .72rem; color: var(--muted); }
  .it .pr { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .it .acts { display: flex; gap: 4px; }
  .mini { border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: 900 .8rem var(--font); padding: 4px 8px; cursor: pointer; white-space: nowrap; }
  .mini.go { background: var(--used); color: #2a2238; }
  .chk { width: 24px; height: 24px; accent-color: var(--plan); }
  .empty { color: var(--muted); font-size: .88rem; }
  .sumline { display: flex; justify-content: space-between; font-weight: 900; padding: 0 4px; }
  .reset { justify-self: center; }
</style>
</head>
<body>
<main class="k-wrap k-stack">
  <section class="k-card k-stack">
    <div class="budget"><span>👛 おこづかい</span><button class="slot" id="budget" aria-label="おこづかいを 入れる"></button><span>円</span></div>
    <div class="bar" id="bar"></div>
    <div class="legend">
      <div class="lg-u">使った<b id="lgU"></b></div>
      <div class="lg-p">買うかも<b id="lgP"></b></div>
      <div class="lg-l">残り<b id="lgL"></b></div>
    </div>
  </section>

  <section class="k-card k-stack">
    <div class="ifbox" id="ifbox"></div>
    <div class="pad" id="pad"></div>
    <div class="two" id="two">
      <button class="k-btn btn-plan" id="toPlan">🤔 買うかも</button>
      <button class="k-btn is-orange" id="toBuy">✅ 買った！</button>
    </div>
    <button class="k-btn is-sun" id="budgetOk" hidden>👛 おこづかいは これで OK</button>
  </section>

  <section class="k-card k-stack">
    <h2 class="sec">🤔 買うかも（まだ はらってない）</h2>
    <div class="list" id="planList"></div>
  </section>

  <section class="k-card k-stack">
    <h2 class="sec">✅ 買った（はらった）</h2>
    <div class="list" id="boughtList"></div>
  </section>
  <button class="k-btn is-small reset" id="reset">🗑️ ぜんぶ けして さいしょから</button>
</main>

<script src="../../common/kit.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const yen = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ja-JP') + '円';
const KEY = 'omatsuri:state';
const fresh = () => ({ budget: 0, bought: [], plan: [] });
let st = Object.assign(fresh(), Kit.store.get(KEY, {}));
const save = () => Kit.store.set(KEY, st);
let price = 0, target = 'price', fresh1 = false; // target：でんたくで 入れる先（price／budget）

const usedSum = () => st.bought.reduce((s, b) => s + b.price, 0);
const planSum = () => st.plan.filter(p => p.on).reduce((s, p) => s + p.price, 0);
const time = t => { const d = new Date(t); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };

function render() {
  const used = usedSum(), plan = planSum(), left = st.budget - used, after = left - plan;
  // バー：使った（オレンジ）／買うかも（青しま、たりない ぶんは 赤しま）／残り（みどり）
  const B = Math.max(st.budget, used + plan, 1), pct = v => Math.max(0, v) / B * 100 + '%';
  const planIn = Math.min(plan, Math.max(0, left));
  $('bar').innerHTML = `<i class="u" style="width:${pct(used)}"></i><i class="p" style="width:${pct(planIn)}"></i><i class="o" style="width:${pct(plan - planIn)}"></i>`;
  $('bar').style.background = after <= 0 ? 'var(--soft)' : 'var(--left)';
  $('lgU').textContent = yen(used); $('lgP').textContent = yen(plan);
  $('lgL').textContent = yen(after); $('lgL').style.color = after < 0 ? 'var(--over)' : '';

  // おこづかいの わく
  const bs = $('budget');
  bs.textContent = st.budget ? st.budget.toLocaleString('ja-JP') : 'タップして 入れる';
  bs.classList.toggle('empty', !st.budget); bs.classList.toggle('on', target === 'budget');
  // でんたくの上：いま 残り − [ねだん] ＝ 残り
  const box = $('ifbox'), a1 = left - price;
  box.className = 'ifbox' + (a1 < 0 ? ' over' : '');
  box.innerHTML = `<div class="ttl">${target === 'budget' ? '👛 おこづかいを 入れてね' : !price ? '💭 ねだんを 入れると…' : a1 < 0 ? '😱 お金が たりない！' : '💭 これを 買ったら'}</div>
    ${target === 'budget' ? '<div class="calc" hidden></div>' : `<div class="calc">いま 残り ${yen(left)} − <button class="slot ${target === 'price' ? 'on' : ''} ${price ? '' : 'empty'}" id="price">${price ? price.toLocaleString('ja-JP') : '？'}</button>円</div>
    <div class="big">${a1 < 0 ? `${yen(-a1)} たりない` : `残り ${yen(a1)}`}</div>`}`;
  if ($('price')) $('price').onclick = () => setTarget('price');
  $('two').hidden = target === 'budget'; $('budgetOk').hidden = target !== 'budget';
  $('toBuy').disabled = $('toPlan').disabled = !price;

  // 買うかも
  const pl = $('planList');
  pl.innerHTML = st.plan.length ? '' : '<div class="empty">ねだんを 入れて「🤔 買うかも」を おすと ここに 入るよ</div>';
  st.plan.forEach(p => {
    const r = Kit.el(`<div class="it plan ${p.on ? '' : 'off'}"><input type="checkbox" class="chk" ${p.on ? 'checked' : ''} aria-label="けいさんに 入れる"><input class="nm" maxlength="14" placeholder="なまえ"><span class="pr">${yen(p.price)}</span><span class="acts"><button class="mini go">✅ 買った</button><button class="mini" aria-label="けす">✖</button></span></div>`);
    const nm = r.querySelector('.nm'); nm.value = p.name || '';
    nm.oninput = () => { p.name = nm.value; save(); };
    r.querySelector('.chk').onchange = e => { p.on = e.target.checked; save(); Kit.sfx('tap'); render(); };
    r.querySelector('.go').onclick = () => { st.plan = st.plan.filter(q => q !== p); buy(p.price, p.name); };
    r.querySelector('.acts .mini:last-child').onclick = () => { st.plan = st.plan.filter(q => q !== p); save(); Kit.sfx('drop'); render(); };
    pl.appendChild(r);
  });
  if (st.plan.length > 1) pl.appendChild(Kit.el(`<div class="sumline"><span>✔ したもの ぜんぶ 買ったら</span><span style="color:${after < 0 ? 'var(--over)' : ''}">${after < 0 ? `${yen(-after)} たりない` : `残り ${yen(after)}`}</span></div>`));

  // 買った
  const bl = $('boughtList');
  bl.innerHTML = st.bought.length ? '' : '<div class="empty">まだ なにも 買っていないよ</div>';
  st.bought.slice().reverse().forEach(b => {
    const r = Kit.el(`<div class="it"><span class="tm">${time(b.t)}</span><input class="nm" maxlength="14" placeholder="なまえ"><span class="pr">${yen(b.price)}</span><span class="acts"><button class="mini" aria-label="とりけす">↩</button></span></div>`);
    const nm = r.querySelector('.nm'); nm.value = b.name || '';
    nm.oninput = () => { b.name = nm.value; save(); };
    r.querySelector('.mini').onclick = async () => {
      if (!(await Kit.ask(`${b.name ? `「${Kit.esc(b.name)}」` : ''}${yen(b.price)} を とりけす？`, 'とりけす', 'やめる'))) return;
      st.bought = st.bought.filter(q => q !== b); save(); render();
    };
    bl.appendChild(r);
  });
}

function buy(p, name = '') {
  st.bought.push({ name, price: p, t: Date.now() });
  save(); Kit.sfx('coin'); Kit.vibrate(20);
  price = 0; render();
  const L = st.budget - usedSum();
  Kit.toast(L < 0 ? `⚠️ ${yen(-L)} オーバー！` : `のこり ${yen(L)}`);
}
$('toBuy').onclick = () => { if (price) buy(price); };
$('toPlan').onclick = () => {
  if (!price) return;
  st.plan.push({ name: '', price, on: true }); save(); Kit.sfx('pop');
  price = 0; render();
};

// でんたく
['7', '8', '9', '4', '5', '6', '1', '2', '3', 'C', '0', '⌫'].forEach(k => {
  const b = Kit.el(`<button class="k-btn ${k === 'C' ? 'is-berry' : ''}">${k}</button>`);
  b.onclick = () => {
    let v = target === 'budget' ? st.budget : price;
    if (fresh1 && /\d/.test(k)) v = 0; fresh1 = false; // おこづかいを なおすときは 入れなおし
    if (k === 'C') v = 0;
    else if (k === '⌫') v = Math.floor(v / 10);
    else { const n = Number(String(v) + k); if (n < 1000000) v = n; }
    if (target === 'budget') { st.budget = v; save(); } else price = v;
    Kit.sfx('tap'); render();
  };
  $('pad').appendChild(b);
});

// おこづかいも おなじ でんたくで
function setTarget(t) { target = t; fresh1 = t === 'budget' && st.budget > 0; Kit.sfx('select'); render(); }
$('budget').onclick = () => setTarget(target === 'budget' ? 'price' : 'budget');
$('budgetOk').onclick = () => setTarget('price');

$('reset').onclick = async () => {
  if (!(await Kit.ask('おこづかい・買ったもの・リストを ぜんぶ けす？', 'けす', 'やめる'))) return;
  st = fresh(); save(); price = 0; target = 'budget'; render();
};

Kit.bar({ id: 'omatsuri', title: '🏮 おまつりおこづかい', help: `
  <p>いちばん上の おこづかいを タップして でんたくで 入れて、ねだんを でんたくで 入れよう。下に「これを 買ったら 残り○円」が 出ます。</p>
  <p><b>✅ 買った！</b>：お金を はらったら おす。<span style="color:#ff8a3d;font-weight:900">オレンジ</span>の「使った」が ふえます。まちがえたら ↩ で とりけせます。</p>
  <p><b>🤔 買うかも</b>：まだ はらっていない よてい。<span style="color:#4cb8ff;font-weight:900">青い しましま</span>に なり、✔ を つけたり はずしたりして 組み合わせを くらべられます。</p>
  <p>なまえは リストの中で 入れられます。データは この たんまつに 自動で のこります。</p>` });
if (!st.budget) target = 'budget';
render();
</script>
</body>
</html>
