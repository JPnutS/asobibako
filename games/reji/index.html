<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レジでおかいもの</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  .k-wrap { max-width: 620px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modes .k-btn { flex-direction: column; gap: 2px; padding: 12px 6px; }
  .modes .k-btn small { font-size: .78rem; font-weight: 700; opacity: .85; }
  .modes .k-btn[aria-pressed="true"] { background: var(--sun); color: var(--on-color); }
  .hud { display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
  .stars { letter-spacing: 1px; }

  /* おみせ */
  .shop { display: grid; gap: 8px; }
  .shop-top { display: flex; align-items: center; gap: 12px; }
  .who { font-size: 2.6rem; line-height: 1; }
  .bubble { flex: 1; background: var(--soft); border: 3px solid var(--line); border-radius: 16px; padding: 8px 12px; font-weight: 700; position: relative; }
  .bubble::before { content: ''; position: absolute; left: -11px; top: 50%; transform: translateY(-50%); border: 8px solid transparent; border-right-color: var(--line); }
  .goods { display: flex; flex-wrap: wrap; gap: 6px; }
  .good { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font-weight: 700; }
  .price { display: flex; justify-content: space-between; align-items: baseline; border-top: 3px dashed var(--line); padding-top: 6px; font-weight: 900; }
  .price b { font-family: var(--display); font-size: 1.9rem; font-weight: 400; }
  .paid-line { display: flex; justify-content: space-between; font-weight: 900; }
  .patience { height: 8px; border-radius: 5px; background: var(--soft); overflow: hidden; border: 2px solid var(--line); }
  .patience i { display: block; height: 100%; background: var(--grass); transition: width .2s linear; }

  /* トレー */
  .tray { background: #8fd1b0; border: 3px solid var(--line); border-radius: 18px; padding: 10px; min-height: 104px; display: grid; gap: 6px; box-shadow: inset 0 4px 0 rgba(0,0,0,.12); }
  .tray-head { display: flex; justify-content: space-between; font-weight: 900; color: #1d3b2c; }
  .tray-head b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
  .row-money { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 52px; }
  .empty { color: #2d5a43; font-weight: 700; font-size: .9rem; }

  /* おかね */
  .pile { position: relative; background: none; border: 0; padding: 2px; cursor: pointer; display: inline-grid; place-items: center; touch-action: manipulation; font: inherit; color: inherit; }
  .pile:active { transform: scale(.92); }
  .pile .n { position: absolute; right: -6px; top: -6px; background: var(--berry); color: #fff; border: 2px solid var(--line); border-radius: 10px; font-size: .75rem; font-weight: 900; padding: 0 5px; min-width: 22px; text-align: center; }
  .m { display: inline-grid; place-items: center; border: 2.5px solid var(--line); font-weight: 900; color: #2a2238; font-family: var(--font); user-select: none; position: relative; }
  .m.c { border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.45), 0 3px 0 var(--line); font-size: .78rem; }
  .m.b { width: 72px; height: 38px; border-radius: 6px; box-shadow: 0 3px 0 var(--line); font-size: .9rem; }
  .m.b::before { content: ''; position: absolute; left: 6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; border: 2px solid rgba(42,34,56,.35); }
  .m.b span { margin-left: 14px; }
  .m.d1 { width: 34px; height: 34px; background: #e9edf2; }
  .m.d5 { width: 38px; height: 38px; background: #f0c64f; }
  .m.d10 { width: 40px; height: 40px; background: #d08442; }
  .m.d50 { width: 39px; height: 39px; background: #d7dde4; }
  .m.d100 { width: 43px; height: 43px; background: #c8ced6; }
  .m.d500 { width: 47px; height: 47px; background: #e2b955; }
  .m.d5::after, .m.d50::after { content: ''; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); top: 4px; }
  .m.d5 span, .m.d50 span { margin-top: 10px; }
  .m.d1000 { background: #9ec5ea; }
  .m.d5000 { background: #c8b0e6; }
  .m.d10000 { background: #dcc493; }
  .m.pop { animation: mpop .25s ease-out; }
  @keyframes mpop { from { transform: scale(.4); } }

  .purse { display: grid; gap: 8px; }
  .purse-head { display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
  .coins-badge { background: var(--sun); color: var(--on-color); border: 2px solid var(--line); border-radius: 12px; padding: 2px 10px; }
  .purse-grid { display: flex; flex-wrap: wrap; gap: 12px 10px; align-items: center; min-height: 52px; }
  .purse-grid .sep { flex-basis: 100%; height: 0; }

  .acts { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .res { display: grid; gap: 10px; }
  .res .line { display: grid; gap: 4px; }
  .res .line .k-label { font-size: .8rem; }
  .big-stars { font-size: 2rem; text-align: center; letter-spacing: 4px; }
  .cmp { display: flex; justify-content: center; gap: 10px; align-items: center; font-weight: 900; font-size: 1.15rem; }
  .cmp .arrow { color: var(--muted); }
  .note { background: var(--soft); border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: .92rem; }
  .shake { animation: k-shake .3s; }
</style>
</head>
<body>
<main class="k-wrap">
  <section id="menu" class="k-card k-stack">
    <h2>どっちを やる？</h2>
    <div class="modes" id="optMode"></div>
    <p class="k-muted" id="modeDesc"></p>
    <span class="k-label">むずかしさ</span>
    <div class="k-chips" id="optLv"></div>
    <p class="k-muted" id="bestLine"></p>
    <button class="k-btn is-sun is-big" id="go">スタート</button>
  </section>

  <section id="game" class="k-stack" hidden>
    <div class="hud"><span id="round"></span><span class="stars" id="starsNow"></span></div>
    <div class="k-card shop" id="shop"></div>
    <div class="tray" id="tray"></div>
    <div class="acts" id="acts"></div>
    <div class="k-card purse" id="purse"></div>
  </section>

  <section id="end" class="k-card k-stack k-center" hidden></section>
</main>

<script src="../../common/kit.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const D = [10000, 5000, 1000, 500, 100, 50, 10, 5, 1];
const isCoin = d => d < 1000;
const yen = n => n.toLocaleString('ja-JP') + '円';
const sum = m => D.reduce((s, d) => s + d * (m[d] || 0), 0);
const pieces = m => D.reduce((s, d) => s + (m[d] || 0), 0);
const coins = m => D.reduce((s, d) => s + (isCoin(d) ? m[d] || 0 : 0), 0);
const add = (a, b, k = 1) => { const r = { ...a }; for (const d of D) if (b[d]) r[d] = (r[d] || 0) + b[d] * k; for (const d of D) if (!r[d]) delete r[d]; return r; };
// レジのおつり：大きいおかねから
function greedy(amount) { const out = {}; for (const d of D) { const k = Math.floor(amount / d); if (k) { out[d] = k; amount -= k * d; } } return out; }

/* いちばん こぜにが へる はらいかた。
   はらう金額ごとに「出せる こぜにの数のさいだい」を もとめ（個数つきナップサック）、
   おつりを たして さいふの こぜにが いちばん少なくなる金額をえらぶ */
function bestPay(wallet, price) {
  const total = sum(wallet), NEG = -1e9;
  let dp = new Float64Array(total + 1).fill(NEG); dp[0] = 0;
  const picks = [];
  for (const d of D) {
    const n = wallet[d] || 0, val = isCoin(d) ? 64 : -1; // こぜにを多く、おさつは少なく
    const nd = new Float64Array(total + 1).fill(NEG), ch = new Uint8Array(total + 1);
    for (let a = 0; a <= total; a++) {
      for (let k = 0; k <= n && k * d <= a; k++) {
        const v = dp[a - k * d]; if (v === NEG) continue;
        const w = v + k * val; if (w > nd[a]) { nd[a] = w; ch[a] = k; }
      }
    }
    dp = nd; picks.push(ch);
  }
  const W = coins(wallet); let best = null;
  for (let a = price; a <= total; a++) {
    if (dp[a] === NEG) continue;
    const coinsOut = Math.ceil(dp[a] / 64), billsOut = coinsOut * 64 - dp[a]; // 64×こぜに − おさつ を もどす
    const change = greedy(a - price);
    const after = W - coinsOut + coins(change), hand = coinsOut + billsOut + pieces(change);
    if (!best || after < best.after || (after === best.after && hand < best.hand)) best = { amount: a, after, hand };
  }
  // はらうおかねを もどす
  const pay = {}; let a = best.amount;
  for (let i = D.length - 1; i >= 0; i--) { const k = picks[i][a]; if (k) pay[D[i]] = k; a -= k * D[i]; }
  return { pay, change: greedy(best.amount - price), after: best.after };
}

/* ---------- しなもの ---------- */
const GOODS = [
  ['🍬', 'あめ', 10, 120], ['🍙', 'おにぎり', 100, 250], ['🧃', 'ジュース', 90, 200], ['🍞', 'パン', 110, 380],
  ['🍦', 'アイス', 100, 350], ['📒', 'ノート', 100, 300], ['✏️', 'えんぴつ', 50, 150], ['🍫', 'チョコ', 80, 300],
  ['🖍️', 'クレヨン', 300, 900], ['🍰', 'ケーキ', 300, 700], ['📚', 'ほん', 450, 1800], ['⚽', 'ボール', 600, 2500],
  ['🧸', 'ぬいぐるみ', 900, 3200], ['🎨', 'えのぐ', 500, 1500], ['🎮', 'ゲーム', 2500, 6000], ['👟', 'くつ', 1900, 5800],
];
const LV = {
  1: { name: '🐣 かんたん', max: 1000, step: 10, items: 1, patience: 0 },
  2: { name: '🐥 ふつう', max: 3000, step: 1, items: 2, patience: 45 },
  3: { name: '🦅 むずかしい', max: 8000, step: 1, items: 3, patience: 30 },
};
function makeGoods(lv, nItems) {
  const L = LV[lv];
  for (let t = 0; t < 50; t++) {
    const list = [];
    for (let i = 0; i < nItems; i++) {
      const [e, n, lo, hi] = Kit.pick(GOODS.filter(g => g[2] <= L.max / nItems));
      const p = Math.max(L.step, Math.round(Kit.rand(lo, Math.min(hi, L.max / nItems)) / L.step) * L.step);
      list.push({ e, n, p: lv === 1 ? p : p - (Math.random() < .5 ? Kit.randInt(0, 9) : 0) });
    }
    const total = list.reduce((s, g) => s + g.p, 0);
    if (total > 0 && total <= L.max) return list;
  }
  return [{ e: '🍬', n: 'あめ', p: 30 }];
}
const ROUNDS = 5;
const RULE = {
  cust: { icon: '🛍️', name: 'おきゃくさん', desc: 'さいふから おかねを出して はらおう。おつりも かんがえて、さいふの こぜに（コイン）が いちばん へるように はらえたら ⭐3つ！' },
  clerk: { icon: '🧑‍💼', name: 'てんいんさん', desc: 'おきゃくさんから おかねを あずかって、レジから ただしい おつりを わたそう。すくない まいすうで、はやく わたせたら ⭐3つ！' },
};

/* ---------- せってい ---------- */
const O = Object.assign({ mode: 'cust', lv: 1 }, Kit.store.get('reji:opts', {}));
const save = () => Kit.store.set('reji:opts', O);
function renderMenu() {
  const m = $('optMode'); m.innerHTML = '';
  for (const [k, r] of Object.entries(RULE)) {
    const b = Kit.el(`<button class="k-btn" aria-pressed="${O.mode === k}">${r.icon} ${r.name}<small>${k === 'cust' ? 'はらう がわ' : 'おつりを わたす がわ'}</small></button>`);
    b.onclick = () => { O.mode = k; save(); Kit.sfx('select'); renderMenu(); };
    m.appendChild(b);
  }
  $('modeDesc').textContent = RULE[O.mode].desc;
  const c = $('optLv'); c.innerHTML = '';
  for (const k of [1, 2, 3]) {
    const b = Kit.el(`<button class="k-chip" aria-pressed="${O.lv === k}">${LV[k].name}</button>`);
    b.onclick = () => { O.lv = k; save(); Kit.sfx('select'); renderMenu(); };
    c.appendChild(b);
  }
  const best = Kit.getBest(`reji_${O.mode}${O.lv}`);
  $('bestLine').textContent = best != null ? `さいこう きろく：⭐${best} / ${ROUNDS * 3}` : '';
}

/* ---------- おかねの え ---------- */
const money = (d, cls = '') => isCoin(d)
  ? `<span class="m c d${d} ${cls}"><span>${d}</span></span>`
  : `<span class="m b d${d} ${cls}"><span>${d.toLocaleString('ja-JP')}</span></span>`;
const moneyRow = m => D.filter(d => m[d]).map(d => Array(m[d]).fill(money(d)).join('')).join('') || '<span class="k-muted">なし</span>';
function piles(root, m, onTap, { all = false, pop = -1 } = {}) {
  root.innerHTML = '';
  let lastBill = null;
  for (const d of D) {
    if (!all && !m[d]) continue;
    if (all && d === 10000) continue;
    if (lastBill === true && isCoin(d)) root.appendChild(Kit.el('<span class="sep"></span>'));
    lastBill = !isCoin(d);
    const b = Kit.el(`<button class="pile" aria-label="${d}円">${money(d, d === pop ? 'pop' : '')}${!all && m[d] > 1 ? `<span class="n">×${m[d]}</span>` : ''}</button>`);
    b.onclick = () => onTap(d);
    root.appendChild(b);
  }
}

/* ---------- ゲーム ---------- */
let S = null;
function start() {
  S = { mode: O.mode, lv: O.lv, round: 0, stars: 0, wallet: O.mode === 'cust' ? makeWallet(O.lv) : null };
  $('menu').hidden = true; $('end').hidden = true; $('game').hidden = false;
  Kit.sfx('tap');
  nextRound();
}
function makeWallet(lv) {
  const w = {};
  const r = (d, a, b) => { const k = Kit.randInt(a, b); if (k) w[d] = k; };
  if (lv === 1) { r(1000, 1, 1); r(500, 0, 1); r(100, 2, 4); r(50, 0, 1); r(10, 3, 6); r(5, 0, 1); r(1, 2, 5); }
  if (lv === 2) { r(5000, 0, 1); r(1000, 2, 3); r(500, 0, 2); r(100, 2, 6); r(50, 0, 2); r(10, 2, 8); r(5, 0, 2); r(1, 2, 8); }
  if (lv === 3) { r(10000, 0, 1); r(5000, 1, 1); r(1000, 1, 4); r(500, 1, 2); r(100, 1, 7); r(50, 1, 2); r(10, 3, 9); r(5, 1, 2); r(1, 3, 9); }
  return w;
}
function nextRound() {
  S.round++;
  if (S.round > ROUNDS) return finish();
  S.goods = makeGoods(S.lv, S.mode === 'cust' ? 1 : Kit.randInt(1, LV[S.lv].items));
  S.price = S.goods.reduce((s, g) => s + g.p, 0);
  S.tray = {}; S.hint = false; S.busy = false; S.miss = 0; S.late = false;
  if (S.mode === 'cust') {
    S.note = '';
    if (sum(S.wallet) < S.price) { S.wallet = add(S.wallet, { 1000: Math.ceil((S.price - sum(S.wallet)) / 1000) + 1 }); S.note = '💌 おこづかいを もらったよ！'; }
    S.before = coins(S.wallet);
    S.best = bestPay(S.wallet, S.price);
  } else {
    S.recv = customerPays(S.lv, S.price);
    S.change = sum(S.recv) - S.price;
    S.face = Kit.pick(['👦', '👧', '👩', '👨', '👵', '👴', '🧑']);
    S.t0 = performance.now();
  }
  render();
  Kit.sfx('pop');
}
// てんいんモード：おきゃくさんの はらいかた
function customerPays(lv, price) {
  const singles = [100, 500, 1000, 5000, 10000].filter(d => d >= price && d < price * 12);
  if (lv === 1 || Math.random() < .25) return { [Kit.pick(singles.slice(0, 2)) || 10000]: 1 };
  // おさつ（か 500円玉）＋ はしたの こぜに。「1,026円 あずかります」のような はらいかた
  const base = price < 500 && Math.random() < .5 ? 500 : Math.random() < .2 && price < 5000 ? 5000 : Math.ceil(price / 1000) * 1000;
  const extra = Kit.pick([price % 10, price % 50, price % 100, price % 100, price % 500, price % 1000].filter(r => r));
  return add(greedy(base), greedy(extra || 0));
}

function render() {
  $('round').textContent = `${RULE[S.mode].icon} ${S.round} / ${ROUNDS}`;
  $('starsNow').textContent = `⭐ ${S.stars}`;
  const goodsHtml = S.goods.map(g => `<span class="good">${g.e} ${g.n} ${yen(g.p)}</span>`).join('');
  const tsum = sum(S.tray);
  if (S.mode === 'cust') {
    $('shop').innerHTML = `
      <div class="shop-top"><span class="who">🧑‍💼</span><div class="bubble">${S.note || 'いらっしゃいませ！'}</div></div>
      <div class="goods">${goodsHtml}</div>
      <div class="price"><span>おかいけい</span><b>${yen(S.price)}</b></div>`;
    $('tray').innerHTML = `<div class="tray-head"><span>💴 だす おかね</span><b>${yen(tsum)}</b></div><div class="row-money" id="trayRow"></div>
      ${S.hint ? `<div class="note">💡 ヒント：<div class="row-money">${moneyRow(S.best.pay)}</div></div>` : ''}`;
    if (!tsum) $('trayRow').innerHTML = '<span class="empty">さいふの おかねを タッチして ここに 出そう</span>';
    else piles($('trayRow'), S.tray, d => move(d, -1), { pop: S.pop });
    $('acts').innerHTML = `<button class="k-btn is-small" id="hintBtn" ${S.hint ? 'disabled' : ''}>💡 ヒント</button>
      <button class="k-btn is-sun" id="payBtn" ${tsum < S.price ? 'disabled' : ''}>${tsum < S.price ? `あと ${yen(S.price - tsum)}` : 'これで はらう！'}</button>`;
    $('purse').innerHTML = `<div class="purse-head"><span>👛 さいふ（${yen(sum(S.wallet))}）</span><span class="coins-badge">こぜに ${coins(S.wallet)}まい</span></div><div class="purse-grid" id="purseGrid"></div>`;
    piles($('purseGrid'), S.wallet, d => move(d, 1));
    $('payBtn').onclick = pay;
  } else {
    const L = LV[S.lv];
    $('shop').innerHTML = `
      <div class="shop-top"><span class="who">${S.face}</span><div class="bubble" id="say">これ ください！</div></div>
      <div class="goods">${goodsHtml}</div>
      <div class="price"><span>おかいけい</span><b>${yen(S.price)}</b></div>
      <div class="paid-line"><span>あずかった おかね</span><span>${yen(sum(S.recv))}</span></div>
      <div class="row-money">${moneyRow(S.recv)}</div>
      ${S.lv === 1 || S.hint ? `<div class="paid-line"><span>おつり</span><span>${yen(S.change)}</span></div>` : ''}
      ${L.patience ? '<div class="patience"><i id="pat"></i></div>' : ''}`;
    $('tray').innerHTML = `<div class="tray-head"><span>🪙 わたす おつり</span><b>${yen(tsum)}</b></div><div class="row-money" id="trayRow"></div>`;
    if (!tsum) $('trayRow').innerHTML = `<span class="empty">${S.change ? 'レジの おかねを タッチして おつりを つくろう' : 'ぴったり！ おつりは なし'}</span>`;
    else piles($('trayRow'), S.tray, d => move(d, -1), { pop: S.pop });
    $('acts').innerHTML = `<button class="k-btn is-small" id="hintBtn" ${S.lv === 1 || S.hint ? 'disabled' : ''}>💡 ヒント</button>
      <button class="k-btn is-sun" id="payBtn">${tsum || !S.change ? 'おつりを わたす！' : 'おつりを わたす'}</button>`;
    $('purse').innerHTML = `<div class="purse-head"><span>🗄️ レジ</span><span class="k-muted" style="font-size:.85rem">タッチで 1まいずつ</span></div><div class="purse-grid" id="purseGrid"></div>`;
    piles($('purseGrid'), {}, d => move(d, 1), { all: true });
    $('payBtn').onclick = giveChange;
    tickPatience();
  }
  $('hintBtn').onclick = () => { S.hint = true; Kit.sfx('select'); render(); };
  S.pop = -1;
}
function move(d, dir) {
  if (S.busy) return;
  if (dir > 0) { if (S.mode === 'cust') { S.wallet = add(S.wallet, { [d]: 1 }, -1); } S.tray = add(S.tray, { [d]: 1 }); S.pop = d; Kit.sfx('coin'); }
  else { S.tray = add(S.tray, { [d]: 1 }, -1); if (S.mode === 'cust') S.wallet = add(S.wallet, { [d]: 1 }); Kit.sfx('tap'); }
  Kit.vibrate(8);
  render();
}

/* おきゃくさん：はらう */
function pay() {
  if (S.busy) return; S.busy = true;
  const change = greedy(sum(S.tray) - S.price);
  S.wallet = add(S.wallet, change);
  const after = coins(S.wallet), best = S.best.after;
  let st = after <= best ? 3 : after - best <= 2 ? 2 : 1;
  if (S.hint) st = Math.min(st, 2);
  S.stars += st;
  Kit.sfx(st === 3 ? 'win' : 'good');
  const body = `<div class="res">
    <div class="big-stars">${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div>
    <div class="line"><span class="k-label">はらった おかね（${yen(sum(S.tray))}）</span><div class="row-money">${moneyRow(S.tray)}</div></div>
    <div class="line"><span class="k-label">もらった おつり（${yen(sum(change))}）</span><div class="row-money">${moneyRow(change)}</div></div>
    <div class="cmp">こぜに ${S.before}まい <span class="arrow">➜</span> ${after}まい</div>
    ${after <= best ? '<div class="note">🎉 これ以上 へらせない、さいこうの はらいかた！</div>'
      : `<div class="note">💡 こう はらうと こぜにが ${best}まい に なったよ<div class="row-money">${moneyRow(S.best.pay)}</div>おつり：${sum(S.best.change) ? moneyRow(S.best.change) : 'なし'}</div>`}
  </div>`;
  Kit.modal({ title: st === 3 ? 'まいどあり！' : 'ありがとうございました', body, dismissable: false, actions: [{ label: S.round < ROUNDS ? 'つぎの おかいもの' : 'けっか', primary: true, onClick: nextRound }] });
}

/* てんいん：おつりを わたす */
let patRaf = 0;
function tickPatience() {
  cancelAnimationFrame(patRaf);
  const L = LV[S.lv]; if (!L.patience || S.busy) return;
  const f = () => {
    const left = 1 - (performance.now() - S.t0) / 1000 / L.patience;
    const el = $('pat'); if (!el || S.busy) return;
    el.style.width = Math.max(0, left * 100) + '%';
    el.style.background = left > .5 ? 'var(--grass)' : left > .2 ? 'var(--sun)' : 'var(--berry)';
    if (left <= 0 && !S.late) { S.late = true; $('say').textContent = 'まだかなあ…😣'; }
    if (left > 0) patRaf = requestAnimationFrame(f);
  };
  f();
}
function giveChange() {
  if (S.busy) return;
  const got = sum(S.tray);
  if (got !== S.change) {
    Kit.sfx('bad'); Kit.vibrate(60);
    $('tray').classList.remove('shake'); void $('tray').offsetWidth; $('tray').classList.add('shake');
    $('say').textContent = got > S.change ? 'あれ？ おつり おおすぎない？' : 'あれ？ おつりが たりないよ';
    S.miss = (S.miss || 0) + 1;
    return;
  }
  S.busy = true; cancelAnimationFrame(patRaf);
  const L = LV[S.lv], secs = (performance.now() - S.t0) / 1000;
  const minP = pieces(greedy(S.change)), fewest = pieces(S.tray) <= minP;
  const fast = !L.patience || secs <= L.patience;
  let st = 1 + (fewest ? 1 : 0) + (fast && !S.miss ? 1 : 0);
  if (S.hint) st = Math.min(st, 2);
  S.stars += st;
  Kit.sfx(st === 3 ? 'win' : 'good');
  const body = `<div class="res">
    <div class="big-stars">${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div>
    <div class="cmp">${S.face} ありがとう！</div>
    <div class="note">${yen(sum(S.recv))} − ${yen(S.price)} ＝ おつり ${yen(S.change)}</div>
    <div class="line"><span class="k-label">わたした おつり（${pieces(S.tray)}まい）</span><div class="row-money">${moneyRow(S.tray)}</div></div>
    ${fewest ? '' : `<div class="note">💡 いちばん すくないと ${minP}まい<div class="row-money">${moneyRow(greedy(S.change))}</div></div>`}
    ${S.miss ? '<div class="k-muted">まちがえて しまったので スピード⭐は なし</div>' : L.patience && !fast ? '<div class="k-muted">おきゃくさんを またせちゃった</div>' : ''}
  </div>`;
  S.miss = 0; S.late = false;
  Kit.modal({ title: 'まいどあり！', body, dismissable: false, actions: [{ label: S.round < ROUNDS ? 'つぎの おきゃくさん' : 'けっか', primary: true, onClick: nextRound }] });
}

function finish() {
  cancelAnimationFrame(patRaf);
  const id = `reji_${S.mode}${S.lv}`, r = Kit.best(id, S.stars), max = ROUNDS * 3;
  if (S.stars >= max * .8) Kit.confetti();
  Kit.sfx(S.stars >= max * .6 ? 'win' : 'good');
  $('game').hidden = true; $('end').hidden = false;
  $('end').innerHTML = `<h2>${S.stars === max ? 'パーフェクト！' : S.stars >= max * .8 ? 'すごい！' : 'おつかれさま！'}</h2>
    <div class="big-stars">⭐ ${S.stars} / ${max}</div>
    ${S.mode === 'cust' ? `<p>さいごの さいふ：こぜに ${coins(S.wallet)}まい（${yen(sum(S.wallet))}）</p>` : ''}
    <p class="k-muted">${r.isNew ? '🏆 さいこう きろく！' : `さいこう きろく ⭐${r.best}`}</p>
    <div class="k-row" style="justify-content:center"><button class="k-btn is-sun" id="again">もう一回</button><button class="k-btn" id="toMenu">モードをかえる</button></div>`;
  $('again').onclick = start;
  $('toMenu').onclick = () => { $('end').hidden = true; $('menu').hidden = false; renderMenu(); };
}

$('go').onclick = start;
Kit.bar({ id: 'reji', title: '👛 レジでおかいもの', help: `
  <p><b>🛍️ おきゃくさん</b>：さいふの おかねを タッチして トレーに出し、「はらう」。レジの人は いちばん すくない まいすうで おつりを くれます。</p>
  <p>はらったあとの さいふの <b>こぜに（コイン）の まいすう</b>が いちばん すくなくなる はらいかたなら ⭐3つ。たとえば 480円に 530円 出すと、おつりは 50円玉 1まい！</p>
  <p><b>🧑‍💼 てんいんさん</b>：あずかった おかねから おかいけいを ひいた おつりを、レジから えらんで わたします。まいすうが いちばん すくなく、まちがえずに はやく わたせたら ⭐3つ。</p>
  <p>💡ヒントを つかうと その回は ⭐2つまで。</p>` });
renderMenu();
if (location.hash === '#debug') window.__reji = { get S() { return S; }, bestPay, greedy, sum, coins };
</script>
</body>
</html>
