<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぷちぷちEnglish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../../common/kit.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .wrap { flex: 1; min-height: 0; position: relative; }
  #menu { position: absolute; inset: 0; overflow: auto; padding: 14px 14px 30px; }
  #menu .k-card { max-width: 520px; margin: 0 auto; }
  .stages { display: grid; gap: 10px; }
  .st { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; padding: 12px 14px; }
  .st b { font-size: 1.1rem; }
  .st small { grid-column: 1; color: var(--muted); font-weight: 700; font-size: .85rem; }
  .st .stars { grid-row: 1 / span 2; grid-column: 2; font-size: 1.1rem; letter-spacing: 1px; }
  .st:disabled .stars { opacity: .7; }
  /* ゲーム */
  #game { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(#e6f3ff, #f4fbff 60%, #fff6e8); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .top { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; font-weight: 900; }
  .tbar { flex: 1; height: 12px; border: 2.5px solid var(--line); border-radius: 99px; background: #fff; overflow: hidden; }
  .tbar i { display: block; height: 100%; width: 100%; background: var(--orange); transform-origin: left; }
  .score { font-family: 'Dela Gothic One', sans-serif; font-size: 1.4rem; color: #ff7a45; min-width: 3.5em; text-align: right; }
  .combo { font-size: .9rem; color: #ff5d8f; min-width: 4.5em; }
  .q { margin: 8px 12px 0; background: #fff; border: 3px solid var(--line); border-radius: 18px; box-shadow: 0 5px 0 var(--line); padding: 10px 12px 12px; text-align: center; position: relative; }
  .ask { margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ask small { font-weight: 900; font-size: .85rem; }
  .ask.past small { color: #5b4fd0; } .ask.ing small { color: #1d8a5a; } .ask.s3 small { color: #c95a12; }
  .cue { display: inline-block; padding: 4px 16px; border-radius: 99px; font-weight: 900; font-size: 1.15rem; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .frame { margin-top: 6px; font: 900 1.15rem/1.3 'Zen Maru Gothic', sans-serif; color: #2a2238; }
  .frame .bl { display: inline-block; min-width: 3.2em; border-bottom: 3px solid currentColor; text-align: center; padding: 0 4px; }
  .frame .bl.past { color: #5b4fd0; } .frame .bl.ing { color: #1d8a5a; } .frame .bl.s3 { color: #c95a12; }
  .frame .bl.fill { border-radius: 6px; border-bottom-width: 0; background: #fff2a8; color: #2a2238; }
  .say { z-index: 3; position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); background: #fff; border: 2.5px solid var(--line); border-radius: 14px; padding: 3px 10px; font-weight: 900; font-size: .95rem; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .say::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--line); border-bottom: 0; }
  .cue.past { background: #7a6ff0; } .cue.ing { background: #2fb37a; } .cue.s3 { background: #ff8a3d; }
  .tiles { display: flex; justify-content: center; align-items: flex-end; gap: 2px; min-height: 58px; margin-top: 8px; position: relative; }
  .tile { display: inline-grid; place-items: center; min-width: var(--tw, 34px); height: calc(var(--tw, 34px) * 1.35); padding: 0; border: 2.5px solid var(--line); border-radius: 9px; background: #fff8ea; font: 900 calc(var(--tw, 34px) * .8)/1 'Zen Maru Gothic', sans-serif; color: #2a2238; box-shadow: 0 3px 0 var(--line); }
  .tile.add { background: #ffe1c8; color: #e0561f; }
  .tile.chg { background: #ffd2dc; color: #c2185b; }
  .tile.irr { background: #e9e2ff; color: #5b3fd6; }
  .mean { font-weight: 900; color: var(--muted); font-size: 1.05rem; }
  .mean { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .mean .emo { font-size: 2.4rem; line-height: 1; }
  .arrow { font-weight: 900; color: var(--muted); font-size: .95rem; }
  .stamp { position: absolute; right: 10px; bottom: 10px; font-weight: 900; color: #c2185b; border: 3px solid #c2185b; border-radius: 10px; padding: 0 8px; transform: rotate(12deg); background: #fff; opacity: 0; }
  .rule { min-height: 1.2em; margin-top: 2px; font-size: .9rem; font-weight: 900; color: #e0561f; opacity: 0; }
  .field { flex: 1; position: relative; overflow: hidden; }
  .bub { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; display: grid; place-items: center; text-align: center; cursor: pointer;
    background: radial-gradient(circle at 32% 28%, #fff 0 14%, rgba(255,255,255,.95) 15%, rgba(170,210,250,.9) 100%); border: 2px solid rgba(90,120,170,.6); box-shadow: inset -6px -8px 0 rgba(120,160,220,.25);
    font: 900 1.25rem/1.1 'Zen Maru Gothic', sans-serif; color: #2a2238; padding: 4px; word-break: break-all; }
  .bub .k { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-size: .7rem; color: rgba(42,34,56,.45); }
  .bub.bad { background: radial-gradient(circle at 32% 28%, #fff 0 14%, #ffd2dc 15%, #ff8fa8 100%); }
  .bub.good { background: radial-gradient(circle at 32% 28%, #fff 0 14%, #fff4c0 15%, #ffcf3c 100%); }
  .bub .w { white-space: nowrap; }
  .bub .df { color: #e0561f; }
  .bub.dead { opacity: .45; filter: grayscale(.6); cursor: default; }
  .bub .mk { position: absolute; right: -4px; top: -4px; width: 34px; height: 34px; border-radius: 50%; background: #e0245e; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 1.1rem; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.2); animation: mkIn .25s ease-out; }
  .bub .mk.ok { background: #fff; color: #2fb37a; }
  @keyframes mkIn { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .yours { margin-top: 4px; font-weight: 900; color: #c2185b; font-size: 1rem; }
  .yours s { text-decoration-thickness: 3px; }
  .shard { position: absolute; border: 3px solid rgba(255,255,255,.95); border-color: rgba(255,255,255,.95) transparent transparent transparent; border-radius: 50%; pointer-events: none; }
  .popw { position: absolute; font: 900 1.6rem 'Dela Gothic One', sans-serif; color: #ffcf3c; -webkit-text-stroke: 2px #2a2238; paint-order: stroke; pointer-events: none; }
  .ring { position: absolute; border: 5px solid #fff; border-radius: 50%; pointer-events: none; }
  .bit { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; pointer-events: none; }
  .cat { position: absolute; left: 50%; bottom: 4px; width: 110px; height: 96px; margin-left: -55px; pointer-events: none; transition: transform .15s; }
  .cat.jump { transform: translateY(-14px); }
  .msg { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: 'Dela Gothic One', sans-serif; font-size: 2rem; color: #fff; -webkit-text-stroke: 2px #2a2238; paint-order: stroke; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .over { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(40,60,100,.35); overflow: auto; z-index: 5; }
  .over .k-card { width: min(480px, 100%); }
  .res { display: grid; gap: 4px; width: 100%; text-align: left; }
  .res div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 2px dashed var(--soft); padding: 4px 0; }
  .miss { max-height: 220px; overflow: auto; width: 100%; text-align: left; font-weight: 700; }
  .miss div { padding: 3px 0; border-bottom: 1px dashed var(--soft); cursor: pointer; }
  .zk { max-height: 60vh; overflow: auto; text-align: left; }
  .zr { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px dashed var(--soft); cursor: pointer; line-height: 1.5; }
  .ze { font-size: 2rem; width: 2.4rem; text-align: center; flex: none; }
  .zb { font-size: 1.1rem; }
  .zt { font-size: .7rem; font-weight: 900; padding: 0 5px; border-radius: 99px; white-space: nowrap; }
  .zt.t3 { background: #ff8a3d; color: #fff; } .zt.t2 { background: #ffe3cc; color: #c95a12; } .zt.t1 { background: #eee; color: #888; }
  .zfil { display: flex; flex-wrap: wrap; gap: 6px; }
  .zfil button { font: 900 .85rem 'Zen Maru Gothic', sans-serif; padding: 5px 10px; border: 2.5px solid var(--line); border-radius: 99px; background: #fff; color: #2a2238; cursor: pointer; }
  .zfil button.on { background: #ffcf3c; }
  .zl { font-size: .8rem; color: #ffb400; white-space: nowrap; }
  .zf { display: inline-block; font-weight: 700; padding: 0 6px; border-radius: 6px; margin-right: 2px; }
  .zf.past { background: #ece9ff; color: #5b4fd0; } .zf.ing { background: #dcf5ea; color: #1d8a5a; } .zf.s3 { background: #ffeadb; color: #c95a12; }
  .zf.ir { font-weight: 900; color: #5b3fd6; outline: 2px solid #b9a8ff; }
  .voice { width: 40px; height: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="menu">
    <div class="k-card k-stack">
      <h2 style="text-align:center;margin:0">🔤 ぷちぷちEnglish</h2>
      <p style="margin:0">英語の動詞の形を、ぷっちーと一緒に<b>正しいぷちぷち</b>を割って覚えよう。1回60秒。どんどん解こう！</p>
      <div class="stages" id="stages"></div>
      <div class="k-row" style="justify-content:center">
        <button class="k-btn is-sky" id="zukanBtn">📖 動詞図鑑</button>
        <button class="k-btn" id="setBtn">⚙ 設定</button>
      </div>
      <p class="k-muted" id="total" style="margin:0;text-align:center"></p>
    </div>
  </div>
  <div id="game" hidden>
    <div class="top"><div class="tbar"><i id="tbar"></i></div><span class="combo" id="combo"></span><span class="score" id="score">0</span></div>
    <div class="q" id="qcard">
      <div class="mean" id="mean"></div>
      <div class="tiles" id="tiles"></div>
      <div class="ask" id="ask"><span class="cue" id="cue"></span><small id="hint"></small></div>
      <div class="frame" id="frame"></div>
      <div class="rule" id="rule"></div>
      <div class="stamp" id="stamp">不規則！</div>
    </div>
    <div class="field" id="field">
      <svg class="cat" id="cat" viewBox="0 0 110 96" aria-hidden="true">
        <g id="tail"><path d="M84 78 q22 -6 18 -30" fill="none" stroke="#f0a35a" stroke-width="9" stroke-linecap="round"/></g>
        <ellipse cx="55" cy="80" rx="32" ry="16" fill="#ffc98a" stroke="#2a2238" stroke-width="3"/>
        <path d="M22 30 L28 6 L44 22 Z M88 30 L82 6 L66 22 Z" fill="#ffc98a" stroke="#2a2238" stroke-width="3" stroke-linejoin="round"/>
        <path d="M28 24 L30 13 L38 21 Z M82 24 L80 13 L72 21 Z" fill="#ff9fb8"/>
        <ellipse cx="55" cy="44" rx="36" ry="30" fill="#ffc98a" stroke="#2a2238" stroke-width="3"/>
        <path d="M45 16 q10 8 20 0 M48 22 q7 5 14 0" fill="none" stroke="#f0a35a" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="34" cy="54" rx="7" ry="4" fill="#ff9fb8"/><ellipse cx="76" cy="54" rx="7" ry="4" fill="#ff9fb8"/>
        <g id="eyes"><circle cx="42" cy="42" r="5" fill="#2a2238"/><circle cx="68" cy="42" r="5" fill="#2a2238"/><circle cx="43.5" cy="40" r="1.6" fill="#fff"/><circle cx="69.5" cy="40" r="1.6" fill="#fff"/></g>
        <g id="eyesSad" visibility="hidden"><path d="M36 40 l11 4 l-11 4 M74 40 l-11 4 l11 4" fill="none" stroke="#2a2238" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
        <path id="mouth" d="M48 56 q3.5 4 7 0 q3.5 4 7 0" fill="none" stroke="#2a2238" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div class="say" id="catSay"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div class="over" id="resultOv" hidden><div class="k-card k-stack k-center" id="resultCard"></div></div>
</div>
<button class="k-btn k-icon voice" id="voiceBtn" aria-label="読み上げ"></button>

<script src="../../common/kit.js"></script>
<script>
const $ = id => document.getElementById(id);
/* ---------- どうし データ（中1） ----------
   [原形, 意味, 過去形（ふきそくの ときだけ）] */
const RAW = {
  plain: [['play', '遊ぶ・（スポーツを）する'], ['watch', '見る'], ['help', '手伝う'], ['cook', '料理する'], ['clean', '掃除する'], ['walk', '歩く'], ['talk', '話す'], ['want', 'ほしい'], ['visit', '訪れる'], ['start', '始める'], ['look', '見る'], ['listen', '聞く'], ['open', '開ける'], ['call', '電話する'], ['wash', '洗う'], ['finish', '終える'], ['enjoy', '楽しむ'], ['stay', '泊まる'], ['work', '働く'], ['jump', '跳ぶ']],
  e: [['like', '好きだ'], ['live', '住む'], ['use', '使う'], ['love', '大好きだ'], ['dance', '踊る'], ['move', '動く'], ['close', '閉める'], ['practice', '練習する'], ['arrive', '着く'], ['smile', 'ほほえむ']],
  y: [['study', '勉強する'], ['try', 'やってみる'], ['cry', '泣く'], ['carry', '運ぶ'], ['worry', '心配する']],
  dbl: [['stop', '止まる'], ['plan', '計画する'], ['drop', '落とす']],
  irr: [['go', '行く', 'went'], ['come', '来る', 'came'], ['eat', '食べる', 'ate'], ['see', '見る', 'saw'], ['have', '持っている', 'had'], ['make', '作る', 'made'], ['take', '取る', 'took'], ['get', '手に入れる', 'got'], ['give', '与える', 'gave'], ['write', '書く', 'wrote'], ['run', '走る', 'ran'], ['swim', '泳ぐ', 'swam'], ['sit', '座る', 'sat'], ['buy', '買う', 'bought'], ['think', '思う', 'thought'], ['say', '言う', 'said'], ['tell', '伝える', 'told'], ['know', '知っている', 'knew'], ['find', '見つける', 'found'], ['leave', '出発する', 'left'], ['meet', '会う', 'met'], ['speak', '話す', 'spoke'], ['teach', '教える', 'taught'], ['catch', '捕まえる', 'caught'], ['sing', '歌う', 'sang'], ['drink', '飲む', 'drank'], ['begin', '始める', 'began'], ['do', 'する', 'did'], ['put', '置く', 'put'], ['sleep', '眠る', 'slept'], ['feel', '感じる', 'felt'], ['stand', '立つ', 'stood'], ['become', '〜になる', 'became'], ['lose', 'なくす', 'lost'], ['win', '勝つ', 'won'], ['send', '送る', 'sent'], ['ride', '乗る', 'rode'], ['draw', '描く', 'drew'], ['fly', '飛ぶ', 'flew']],
};
const DBL = new Set(['stop', 'plan', 'drop', 'run', 'swim', 'sit', 'get', 'put', 'begin', 'win']); // さいごの 文字を かさねる
/* 意味の イメージ（字面と 意味を むすびつける） */
const EMO = {"play": "⚽", "watch": "📺", "help": "🤝", "cook": "🍳", "clean": "🧹", "walk": "🚶", "talk": "🗣️", "want": "🤲", "visit": "🏠", "start": "🏁", "look": "👀", "listen": "👂", "open": "📖", "call": "📞", "wash": "🧼", "finish": "🏆", "enjoy": "😆", "stay": "🏨", "work": "💼", "jump": "🤸", "like": "👍", "live": "🏡", "use": "✂️", "love": "❤️", "dance": "💃", "move": "📦", "close": "🚪", "practice": "🎹", "arrive": "🚉", "smile": "😊", "study": "📚", "try": "💪", "cry": "😢", "carry": "🎒", "worry": "😟", "stop": "🛑", "plan": "🗓️", "drop": "⬇️", "go": "🚌", "come": "👋", "eat": "🍙", "see": "👁️", "have": "🎁", "make": "🔨", "take": "📸", "get": "🙌", "give": "💝", "write": "✏️", "run": "🏃", "swim": "🏊", "sit": "🪑", "buy": "🛒", "think": "🤔", "say": "💬", "tell": "📣", "know": "💡", "find": "🔍", "leave": "🧳", "meet": "🤗", "speak": "🎙️", "teach": "👩\u200d🏫", "catch": "⚾", "sing": "🎤", "drink": "🥤", "begin": "🚀", "do": "✅", "put": "📥", "sleep": "😴", "feel": "💓", "stand": "🧍", "become": "🦋", "lose": "🤷", "win": "🥇", "send": "📮", "ride": "🚲", "draw": "🎨", "fly": "🕊️"};
/* ぷっちーの 例文で つかう ことば（なければ なし） */
const OBJ = {"play": "soccer", "watch": "TV", "help": "Mom", "cook": "curry", "clean": "the room", "walk": "to school", "talk": "with a friend", "want": "a fish", "visit": "Kyoto", "start": "the game", "look": "at the moon", "listen": "to music", "open": "the door", "call": "Mom", "wash": "the dishes", "finish": "lunch", "enjoy": "the party", "stay": "at home", "work": "hard", "jump": "high", "like": "fish", "live": "in Japan", "use": "a pen", "love": "milk", "dance": "well", "close": "the window", "practice": "the piano", "arrive": "at the station", "study": "English", "try": "sushi", "worry": "about the test", "carry": "a bag", "plan": "a party", "drop": "a cup", "go": "to school", "come": "home", "eat": "fish", "see": "a bird", "have": "a ball", "make": "a cake", "take": "a photo", "get": "a gift", "give": "Mom a flower", "write": "a letter", "run": "fast", "swim": "in the sea", "sit": "down", "buy": "a fish", "think": "about fish", "say": "\"Hello!\"", "tell": "a story", "know": "the answer", "find": "a coin", "leave": "home", "meet": "a friend", "speak": "English", "teach": "math", "catch": "a ball", "sing": "a song", "drink": "milk", "begin": "the lesson", "do": "the homework", "put": "the ball here", "sleep": "well", "feel": "happy", "stand": "up", "become": "a hero", "lose": "a key", "win": "the game", "send": "a letter", "ride": "a bike", "draw": "a picture", "fly": "high"};
/* テストに よく出る 度：3 よく出る／2 ふつう／1 そのほか */
const TIER = {};
["go", "come", "eat", "see", "have", "make", "take", "get", "do", "say", "know", "think", "write", "run", "swim", "buy", "play", "study", "like", "watch", "stop", "try", "live", "use", "visit", "help", "speak", "teach", "sing", "give"].forEach(b => TIER[b] = 3); ["tell", "find", "leave", "meet", "catch", "drink", "begin", "put", "sleep", "feel", "stand", "become", "lose", "win", "send", "ride", "draw", "fly", "cook", "clean", "walk", "talk", "want", "start", "look", "listen", "open", "wash", "finish", "enjoy", "dance", "practice", "arrive", "cry", "carry"].forEach(b => TIER[b] = 2);
const VERBS = [];
Object.entries(RAW).forEach(([g, list]) => list.forEach(([b, ja, past]) => VERBS.push({ b, ja, past, g, e: EMO[b] || '🔤', o: OBJ[b] || '', tier: TIER[b] || 1 })));
const VOW = 'aeiou';
const consY = b => b.endsWith('y') && !VOW.includes(b[b.length - 2]);
/* 正しい形と、どう へんしんするか（アニメの もと） */
function formOf(v, t) {
  const b = v.b;
  if (t === 'past') {
    if (v.past) return { f: v.past, rule: 'irr' };
    if (b.endsWith('e')) return { f: b + 'd', rule: 'e_d', keep: b, add: 'd' };
    if (consY(b)) return { f: b.slice(0, -1) + 'ied', rule: 'y_i', keep: b.slice(0, -1), chg: 'i', add: 'ed' };
    if (DBL.has(b)) return { f: b + b.slice(-1) + 'ed', rule: 'dbl', keep: b, dup: b.slice(-1), add: 'ed' };
    return { f: b + 'ed', rule: 'ed', keep: b, add: 'ed' };
  }
  if (t === 'ing') {
    if (b.endsWith('e') && !b.endsWith('ee')) return { f: b.slice(0, -1) + 'ing', rule: 'e_drop', keep: b.slice(0, -1), drop: 'e', add: 'ing' };
    if (DBL.has(b)) return { f: b + b.slice(-1) + 'ing', rule: 'dbl', keep: b, dup: b.slice(-1), add: 'ing' };
    return { f: b + 'ing', rule: 'ing', keep: b, add: 'ing' };
  }
  // 3単現
  if (b === 'have') return { f: 'has', rule: 'irr' };
  if (consY(b)) return { f: b.slice(0, -1) + 'ies', rule: 'y_i', keep: b.slice(0, -1), chg: 'i', add: 'es' };
  if (/(s|x|ch|sh|o)$/.test(b)) return { f: b + 'es', rule: 'es', keep: b, add: 'es' };
  return { f: b + 's', rule: 's', keep: b, add: 's' };
}
/* まちがいの 候補：ちがう ルールを あてはめて つくる（中1が よく やる まちがい） */
function wrongs(v, t, right) {
  const b = v.b, last = b.slice(-1), nb = b.endsWith('e') ? b.slice(0, -1) : b, set = new Set();

  $('frame').innerHTML = Kit.esc(sentence(q, '\u0001')).replace('\u0001', `<span class="bl fill">${q.f}</span>`) + (G && G.pickW != null ? `<div class="yours">${G.pickW ? `あなたの答え：<s>${Kit.esc(G.pickW)}</s> ✕` : '逃げられました'}</div>` : '');
  await Promise.all([say(`${q.v.b}. ${q.f}. ${sentence(q, q.f)}`), wait(q.rule === 'irr' ? 1500 : 1300)]);
  await wait(250);
}
/* ---------- まいフレーム ---------- */
let msgT = 0;
function flash(s) { const m = $('msg'); m.textContent = s; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => { m.style.opacity = 0; }, 650); }
function hud() {
  $('score').textContent = G.score;
  $('combo').textContent = G.combo >= 2 ? `🔥${G.combo}` : '';
  $('tbar').style.transform = `scaleX(${Math.max(0, G.t / TIME)})`;
}
function update(dt) {
  if (!G || !G.running || G.over) return;
  if (!G.busy) {
    G.t -= dt; G.qT += dt;
    if (G.t <= 0) { G.t = 0; hud(); return finish(); }
    const H = $('field').clientHeight;
    const vy = (H + 140) / G.rise;
    let top = false;
    for (const b of G.bubs) {
      b.y -= vy * dt; b.ph += dt * 2.4;
      const x = b.x + Math.sin(b.ph) * 6;
      b.el.style.left = x + 'px'; b.el.style.top = b.y + 'px';
      if (b.y < -b.sz * .3) top = true;
    }
    if (top) { // にげられた
      G.busy = true; G.pickW = ''; if (!G.qMiss) { G.combo = 0; G.n++; tally(G.q, false); G.miss.push(G.q); G.missW[G.q.key] = ''; G.again.push({ q: G.q, wait: Kit.randInt(3, 5) }); }
      const r = G.bubs.find(x => x.w === G.q.f); if (r) { r.el.classList.add('good'); r.el.insertAdjacentHTML('beforeend', '<i class="mk ok">⭕</i>'); }
      Kit.sfx('bad'); catFace('sad'); flash('逃げられた…'); catSay('あっ、逃げた…', 1200);
      const g = G; hud(); morph(G.q).then(() => { if (G !== g) return; catFace('normal'); nextQ(); });
    }
    hud();
  }
  // しっぽ ゆらゆら
  $('tail').setAttribute('transform', `rotate(${Math.sin(performance.now() / 300) * 8} 84 78)`);
}
const loop = Kit.loop(update);
loop.start();
addEventListener('keydown', e => {
  if (!G || G.busy || G.over) return;
  const n = parseInt(e.key, 10); if (n >= 1 && n <= G.bubs.length) { e.preventDefault(); const sorted = [...G.bubs].sort((a, b) => a.x - b.x); pick(sorted[n - 1]); }
});
/* ---------- おわり ---------- */
function finish() {
  if (!G || G.over) return;
  G.over = true; G.running = false; Kit.music.stop(); Kit.keepAwake(false);
  G.bubs.forEach(b => b.el.remove()); G.bubs = [];
  const S = G.S, stars = STAR.filter(s => G.ok >= s).length;
  if (S.id !== 'nigate' && stars > starsOf(S.id)) Kit.store.set('doushi:star:' + S.id, stars);
  const r = Kit.best('doushi_' + S.id, G.score);
  const opened = S.id !== 'nigate' && stars >= 2 && G.si < 3 && starsOf(STAGES[G.si + 1].id) === 0;
  if (stars >= 2 || r.isNew) Kit.confetti();
  Kit.sfx(stars ? 'win' : 'good');
  const uniq = []; G.miss.forEach(q => { if (!uniq.includes(q)) uniq.push(q); });
  $('resultCard').innerHTML = `<h2 style="margin:0">${S.name}</h2>
    <p style="margin:0;font-size:2rem;letter-spacing:4px">${S.id === 'nigate' ? '' : '★'.repeat(stars) + '☆'.repeat(3 - stars)}</p>
    <p style="margin:0;font-size:2.2rem;font-family:'Dela Gothic One',sans-serif">${G.score}点</p>
    <p style="margin:0;font-weight:900">${r.isNew ? '🎉 ベスト記録！' : `ベスト：${r.best}点`}${opened ? '<br>🔓 次のステージが解放されました！' : ''}</p>
    <div class="res"><div><span>⭕ 正解</span><b>${G.ok} ／ ${G.n}問</b></div><div><span>🔥 最高コンボ</span><b>${G.maxCombo}</b></div>
    ${S.id === 'nigate' ? '' : `<div><span>★の目安</span><b>${STAR.join(' ／ ')}問 正解</b></div>`}</div>
    ${uniq.length ? `<div class="miss"><p class="k-label" style="margin:4px 0">間違えたもの（タップで読み上げ）</p>${uniq.map((q, i) => `<div data-i="${i}">${q.v.e} ${q.v.b} → <b style="color:#e0561f">${q.f}</b>${G.missW[q.key] ? ` <span style="color:#c2185b">（✕ <s>${Kit.esc(G.missW[q.key])}</s>）</span>` : ''}　<span class="k-muted">${q.v.ja}・${TENSE[q.t].name}</span></div>`).join('')}</div>` : '<p style="margin:0">🎯 間違いなし！</p>'}
    <div class="k-row" style="justify-content:center"><button class="k-btn is-orange is-big" id="again">もう一回</button><button class="k-btn" id="toMenu">ステージへ</button></div>`;
  $('resultCard').querySelectorAll('.miss div').forEach(d => d.onclick = () => { const q = uniq[+d.dataset.i]; say(`${q.v.b}. ${q.f}. ${sentence(q, q.f)}`); });
  setTimeout(() => { $('resultOv').hidden = false; }, 400);
  $('again').onclick = () => { Kit.sfx('tap'); start(G.si); };
  $('toMenu').onclick = () => { Kit.sfx('tap'); toMenu(); };
}
function toMenu() { $('resultOv').hidden = true; $('game').hidden = true; $('menu').hidden = false; G = null; Kit.music.stop(); Kit.keepAwake(false); renderMenu(); }
/* ---------- ずかん ---------- */
$('zukanBtn').onclick = () => {
  Kit.sfx('tap');
  const lv = v => { const ks = ['past', 'ing', 's3'].map(t => M[v.b + ':' + t]); const s = ks.reduce((a, m) => a + Math.min(3, m ? m.s || 0 : 0), 0); return s >= 8 ? '★★★' : s >= 5 ? '★★☆' : s >= 2 ? '★☆☆' : '☆☆☆'; };
  const fm = (v, t) => { const F = formOf(v, t); return `<span class="zf ${t}${F.rule === 'irr' ? ' ir' : ''}">${F.f}</span>`; };
  const row = (v, i) => `<div class="zr" data-i="${i}"><span class="ze">${v.e}</span><div><b class="zb">${v.b}</b> <span class="k-muted">${v.ja}</span> <span class="zt t${v.tier}">${['', 'その他', '普通', '頻出'][v.tier]}</span> <span class="zl">${lv(v)}</span><br>${fm(v, 'past')} ${fm(v, 'ing')} ${fm(v, 's3')}</div></div>`;
  const F = { tier: Kit.store.get('doushi:zkTier', 3), irr: false };
  const m = Kit.modal({ title: '📖 動詞図鑑', body: `<div class="zfil" id="zfil"><button data-t="3">⭐ テスト頻出</button><button data-t="2">頻出＋普通</button><button data-t="1">すべて</button><button data-irr="1">不規則だけ</button></div><p class="k-muted" style="margin:4px 0 6px;font-size:.85rem">タップで読み上げ。<span class="zf past">過去形</span> <span class="zf ing">ing形</span> <span class="zf s3">3単現</span>　<b style="color:#5b3fd6">太字</b>は不規則。<span id="zcount"></span></p><div class="zk" id="zk"></div>`, actions: [{ label: 'とじる', primary: true }] });
  const paint = () => {
    const list = VERBS.map((v, i) => [v, i]).filter(([v]) => v.tier >= F.tier && (!F.irr || v.past || v.b === 'have')).sort((a, b) => b[0].tier - a[0].tier || a[1] - b[1]);
    document.getElementById('zk').innerHTML = list.map(([v, i]) => row(v, i)).join('');
    document.getElementById('zcount').textContent = `${list.length}語`;
    document.querySelectorAll('#zfil button').forEach(x => x.classList.toggle('on', x.dataset.irr ? F.irr : +x.dataset.t === F.tier));
    document.querySelectorAll('.zr[data-i]').forEach(tr => tr.onclick = () => { const v = VERBS[+tr.dataset.i]; say(`${v.b}. ${formOf(v, 'past').f}. ${formOf(v, 'ing').f}. ${formOf(v, 's3').f}.`); });
  };
  setTimeout(() => {
    document.querySelectorAll('#zfil button').forEach(x => x.onclick = () => { Kit.sfx('tap'); if (x.dataset.irr) F.irr = !F.irr; else { F.tier = +x.dataset.t; Kit.store.set('doushi:zkTier', F.tier); } paint(); });
    paint();
  }, 30);
};
$('setBtn').onclick = () => {
  Kit.sfx('tap');
  const m = Kit.modal({ title: '⚙ 設定', body: `<label class="k-label" for="nmIn">文の主語にする名前（英字）</label><input id="nmIn" class="k-input" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" value="${Kit.esc(NAME)}" style="width:100%;font-size:1.2rem;padding:8px 10px;border:3px solid var(--line);border-radius:12px"><p class="k-muted" style="margin:6px 0 0;font-size:.85rem">例：Aki ／ Ken ／ Mr. Sato。3単現の練習になるよう、I・you・we・they は使えません。</p><p id="nmErr" style="margin:4px 0 0;color:#c2185b;font-weight:900;font-size:.9rem"></p>`,
    actions: [{ label: '初期値（Aki）', onClick: () => { document.getElementById('nmIn').value = 'Aki'; return false; } }, { label: '保存', primary: true, onClick: () => {
      let v = document.getElementById('nmIn').value.trim().replace(/\s+/g, ' ');
      const err = !/^[A-Za-z][A-Za-z .'-]{0,13}$/.test(v) ? '英字で入力してください（14文字まで）' : BAD_NAME.test(v) ? 'I・you・we・they 以外にしてください' : '';
      if (err) { document.getElementById('nmErr').textContent = err; return false; }
      NAME = v.charAt(0).toUpperCase() + v.slice(1); Kit.store.set('doushi:name', NAME); Kit.toast && Kit.toast(`主語を ${NAME} にしました`);
    } }] });
  setTimeout(() => { const i = document.getElementById('nmIn'); i && i.focus(); }, 50);
};
function pause() { if (G && G.running && !G.over) { G.running = false; G.paused = true; Kit.music.stop(); } }
function resume() { if (G && G.paused) { G.paused = false; G.running = true; } }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else resume(); });

Kit.bar({ id: 'doushi', extra: $('voiceBtn'), guard: { active: () => G && !G.over, pause, resume }, title: 'ぷちぷちEnglish', help: `
  <p>中1英語の動詞の形（過去形・現在進行形のing形・3単現）を、たくさん解いて感覚で覚えるゲームです。</p>
  <ul>
    <li>上に、原形と意味、「〇〇にしよう」という指示、主語の入った穴あき文（Aki ＿＿ soccer. など。主語の名前は ⚙設定 で変えられます）が出ます。下から上がってくる<b>ぷちぷちの中から正しい形</b>をタップ（パソコンは1〜4キー）。</li>
    <li>正解するとぷっちーがぷちぷちを割り、単語が変身するアニメが出ます。yがiに変わる、eが落ちる、文字が増える。動きでルールを覚えましょう。</li>
    <li>間違えたぷちぷちには ✕ がつきます。残りの中からもう一度、正しい形を選びましょう。ぷちぷちが上まで逃げると正解が出ます。間違えた問題は、少しあとでもう一度出ます。</li>
    <li>早く答えるほど、コンボが続くほど得点アップ。1回60秒。</li>
    <li>ステージ：1 基本 → 2 変身ルール → 3 不規則 → 4 ミックス。★★で次が解放。間違えたものは 🔥苦手 にたまります。</li>
    <li>正解すると文が完成し、英語で読み上げます。🗣 ボタンでオン／オフ。</li>
    <li>📖 動詞図鑑では、すべての形と覚え具合を見られます。「テスト頻出」で絞り込めます（頻出度は中1の教科書でよく使う動詞をもとにした目安です）。</li>
</ul>` });
renderMenu();
if (location.hash === '#debug') window.__d = { get G() { return G; }, ALL_Q, formOf, wrongs, VERBS, start, pick };
</script>
