<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>駐車時間</title>
<meta name="theme-color" content="#1f2328">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../../common/kit.css">
<link rel="stylesheet" href="../../style.css">
<style>
  .k-wrap { max-width: 560px; }
  .note { font-size: .85rem; color: var(--muted); margin: 0; }
  .f { display: grid; gap: 8px; }
  .f > .k-label, .band { display: block; background: var(--soft); color: var(--ink); font-weight: 700; padding: 5px 12px; border-left: 4px solid var(--ink); border-radius: 4px 8px 8px 4px; letter-spacing: .06em; }
  details.more .f > .k-label { border-left-color: var(--muted); background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; padding: 2px 10px; }
  .rule { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 1rem; }
  .rule input { width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .rule select { font: inherit; width: auto; padding-left: 8px; padding-right: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg .k-chip { min-height: 36px; padding: 4px 12px; font-size: .88rem; }
  .big { display: grid; justify-items: center; gap: 2px; text-align: center; }
  .big .lbl { font-size: .9rem; color: var(--muted); }
  .big .yen { font-family: var(--display); font-size: clamp(3rem, 16vw, 4.4rem); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .big .yen small { font-size: .4em; margin-left: 2px; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
  .stat span { font-size: .78rem; color: var(--muted); }
  .stat b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .nextup { border-radius: 12px; padding: 12px 14px; background: var(--soft); display: grid; gap: 2px; }
  .nextup b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .nextup.warn { background: color-mix(in srgb, var(--berry) 18%, var(--card)); }
  .tl { display: grid; gap: 0; }
  .tl div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: .95rem; }
  .tl div span:nth-child(2) { color: var(--muted); font-size: .85rem; }
  .tl div b { min-width: 5em; text-align: right; }
  .budget { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .budget input { width: 6em; text-align: right; }
  .photo { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--soft); }
  .head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: .92rem; padding: 4px 0; list-style: none; }
  details.more summary::before { content: "＋ "; }
  details.more[open] summary::before { content: "－ "; }
  .k-modal .rule input { width: 4.6em; }
  .upd { font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="k-wrap" id="app"></main>

<script src="../../../common/kit.js" data-ns="asobibako-otona:" data-home="../../index.html" data-tone="adult"></script>
<script>
'use strict';
Kit.bar({ id: 'parking', title: '駐車時間', help: `
  <p>駐車場の料金を入れて「停めた」を押しておくと、あとで開いた時に、停めてからの時間と、今出るといくらか、次に料金が上がる時刻が分かります。</p>
  <p>画面を消したり、ほかのアプリを使ったりしていても大丈夫です。停めた時刻を覚えておき、開いた時にその時点の料金を計算します（音やお知らせは出ません）。</p>
  <p><b>無料時間</b>は「入庫から◯分以内なら無料、過ぎたら最初から料金がかかる」として計算します。<b>最大料金</b>は「入庫から◯時間ごと」として計算します。夜間料金など、ほかの決まりがある駐車場では目安として使ってください。</p>
  <p><b>看板の写真</b>：料金の看板を撮っておくと、あとで決まりを見返せます。</p>
  <p>料金を入れずに「停めた」を押すと、停めてからの時間だけをはかります。料金は停めたあとでも「変える」から直せます。</p>
  <p>停めた場所のメモと写真も残せます。記録はこの端末の中だけに保存されます。</p>` });

const $ = id => document.getElementById(id);
const app = $('app');
const DEF = { unit: 30, price: 200, free: 0, max: 0, maxH: 24 };
let rule = Object.assign({}, DEF, Kit.store.get('parking:rule', {}));
let cur = Kit.store.get('parking:cur', null);
const saveCur = () => Kit.store.set('parking:cur', cur);
const yen = n => n.toLocaleString('ja-JP');
const hm = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
function clock(ts) {
  const d = new Date(ts), today = new Date();
  const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date(today).setHours(0, 0, 0, 0)) / 864e5);
  return (days === 0 ? '' : days === 1 ? '明日 ' : days === -1 ? '昨日 ' : `${d.getMonth() + 1}/${d.getDate()} `) + hm(d);
}
const dur = min => { min = Math.max(0, Math.floor(min)); return min < 60 ? `${min}分` : `${Math.floor(min / 60)}時間${min % 60 ? (min % 60) + '分' : ''}`; };

/* 料金：入庫からの分数 → 円 */
function fee(r, m) {
  if (m <= 0 || !r.price) return 0;
  if (r.free && m <= r.free) return 0;
  const steps = mm => Math.ceil(mm / r.unit - 1e-9) * r.price;
  if (!r.max) return steps(m);
  const P = r.maxH * 60, n = Math.floor(m / P), rest = m - n * P;
  return n * r.max + (rest > 0 ? Math.min(r.max, steps(rest)) : 0);
}
/* 分数 m のあと、料金が上がる時（分）を順に */
function nextUps(r, m, count) {
  const out = []; let f = fee(r, m), t = Math.floor(m) - 1;
  for (let i = 0; i < 60 * 72 && out.length < count; i++) {
    t += 1;
    const nf = fee(r, t + 0.01);   // t分を過ぎた直後
    if (nf > f) { out.push({ m: t, fee: nf }); f = nf; }
  }
  return out;
}

/* ---------- 料金の入力（停める前と、停めたあとの変更で共通） ---------- */
const z2h = s => String(s).replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
const toNum = s => Math.max(0, parseInt(z2h(s).replace(/[^\d]/g, ''), 10) || 0);
function ruleText(r) {
  if (!r.price) return '料金なし（時間だけはかる）';
  const u = r.unit % 60 === 0 ? `${r.unit / 60}時間` : `${r.unit}分`;
  return `${u}ごとに${yen(r.price)}円${r.free ? ` ・ ${r.free}分以内無料` : ''}${r.max ? ` ・ ${r.maxH}時間ごとに最大${yen(r.max)}円` : ''}`;
}
function ruleForm(r) {
  const hourly = r.unit % 60 === 0;
  const f = Kit.el(`<div class="k-stack">
    <div class="f"><span class="k-label">料金</span>
      <div class="rule"><input class="k-input" data-k="unitN" inputmode="numeric" value="${hourly ? r.unit / 60 : r.unit}"><select class="k-input" data-k="unitK"><option value="m">分</option><option value="h">時間</option></select>ごとに<input class="k-input" data-k="price" inputmode="numeric" placeholder="0" value="${r.price || ''}">円</div>
      <div class="seg" data-k="presets"></div></div>
    <details class="more"${r.free || r.max ? ' open' : ''}><summary>くわしい設定（なくても大丈夫）</summary>
      <div class="k-stack" style="margin-top:8px">
        <div class="f"><span class="k-label">無料時間</span>
          <div class="rule">入庫から<input class="k-input" data-k="free" inputmode="numeric" placeholder="0" value="${r.free || ''}">分以内は無料</div></div>
        <div class="f"><span class="k-label">最大料金</span>
          <div class="rule">入庫から<select class="k-input" data-k="maxH"><option value="24">24時間</option><option value="12">12時間</option><option value="6">6時間</option><option value="1">1時間</option></select>ごとに最大<input class="k-input" data-k="max" inputmode="numeric" placeholder="0" value="${r.max || ''}">円</div></div>
      </div></details>
    <p class="note" data-k="preview"></p></div>`);
  const q = k => f.querySelector(`[data-k="${k}"]`);
  q('unitK').value = hourly ? 'h' : 'm'; q('maxH').value = String(r.maxH || 24);
  const fill = x => {
    if (x.unit) { const h = x.unit % 60 === 0; q('unitN').value = h ? x.unit / 60 : x.unit; q('unitK').value = h ? 'h' : 'm'; }
    if (x.price != null) q('price').value = x.price || '';
    if (x.free != null) q('free').value = x.free || '';
    if (x.max != null) q('max').value = x.max || '';
    if (x.maxH) q('maxH').value = String(x.maxH);
    if (x.free || x.max) f.querySelector('details').open = true;
    upd();
  };
  [['30分200円', 30, 200], ['20分100円', 20, 100], ['1時間300円', 60, 300], ['15分100円', 15, 100]].forEach(([l, u, p]) => {
    const b = Kit.el(`<button type="button" class="k-chip">${l}</button>`); b.onclick = () => fill({ unit: u, price: p }); q('presets').appendChild(b);
  });
  const get = () => {
    const n = Math.max(1, toNum(q('unitN').value) || 1);
    return { unit: q('unitK').value === 'h' ? n * 60 : n, price: toNum(q('price').value), free: toNum(q('free').value), max: toNum(q('max').value), maxH: +q('maxH').value };
  };
  function upd() { const x = get(); q('preview').textContent = x.price ? 'めやす：' + [60, 120, 180, 300].map(m => `${dur(m)} ${yen(fee(x, m))}円`).join(' ・ ') : '料金を入れなくても、停めた時間だけはかれます。'; }
  f.addEventListener('input', upd); f.addEventListener('change', upd);
  upd();
  return { el: f, get };
}
/* 写真（停めた場所・料金の看板）：撮る・撮り直す・消す */
function photoBox(label, get, set) {
  const box = Kit.el('<div class="f"></div>');
  const paint = () => {
    const src = get();
    box.innerHTML = `<span class="k-label">${label}</span>${src ? `<img class="photo" src="${src}" alt="${label}">` : ''}
      <div class="k-row"><label class="k-btn is-small">${src ? '撮り直す' : '写真を撮る'}<input type="file" accept="image/*" capture="environment" hidden></label>${src ? '<button class="k-btn is-small" data-del>消す</button>' : ''}</div>`;
    box.querySelector('input').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { set(await shrink(f)); paint(); } catch (err) { Kit.toast('写真を読み込めませんでした'); } };
    const del = box.querySelector('[data-del]'); if (del) del.onclick = () => { set(''); paint(); };
    if (src) box.querySelector('img').onclick = () => Kit.modal({ title: label, body: `<img src="${src}" style="width:100%;border-radius:10px">` });
  };
  paint();
  return box;
}

/* ---------- 停める前 ---------- */
function setup() {
  app.innerHTML = '';
  const c = Kit.el(`<div class="k-card k-stack">
    <div class="f"><span class="k-label">停めた時刻</span>
      <div class="rule"><input class="k-input" type="time" id="at" style="width:auto"><button class="k-btn is-small" id="nowBtn">今</button></div></div>
    <div id="form"></div>
    <div id="signBox"></div>
    <button class="k-btn is-sun is-big" id="park">停めた</button></div>`);
  app.appendChild(c);
  const form = ruleForm(rule);
  $('form').appendChild(form.el);
  let sign = '';
  $('signBox').appendChild(photoBox('料金の看板（なくても大丈夫）', () => sign, v => { sign = v; }));
  const setNow = () => { $('at').value = hm(new Date()).padStart(5, '0'); };
  setNow();
  $('nowBtn').onclick = setNow;
  $('park').onclick = () => {
    rule = form.get(); Kit.store.set('parking:rule', rule);
    const [h, mi] = ($('at').value || hm(new Date())).split(':').map(Number);
    const d = new Date(); d.setHours(h, mi, 0, 0);
    if (d.getTime() > Date.now() + 60e3) d.setDate(d.getDate() - 1);   // 未来の時刻なら前の日
    cur = { start: d.getTime(), rule, memo: '', photo: '', sign };
    saveCur(); Kit.sfx('good'); view();
  };
}
function editRule() {
  const form = ruleForm(cur.rule);
  const at = Kit.el(`<div class="f" style="margin-bottom:12px"><span class="k-label">停めた時刻</span><div class="rule"><input class="k-input" type="time" style="width:auto" value="${hm(new Date(cur.start)).padStart(5, '0')}"></div></div>`);
  const body = document.createElement('div'); body.append(at, form.el);
  Kit.modal({ title: '料金・時刻を変える', body, actions: [{ label: 'やめる' }, { label: '変える', primary: true, onClick: () => {
    cur.rule = rule = form.get(); Kit.store.set('parking:rule', rule);
    const [h, mi] = at.querySelector('input').value.split(':').map(Number);
    if (!isNaN(h)) { const d = new Date(cur.start); d.setHours(h, mi, 0, 0); if (d.getTime() > Date.now() + 60e3) d.setDate(d.getDate() - 1); cur.start = d.getTime(); }
    saveCur(); view();
  } }] });
}

/* ---------- 停めている間 ---------- */
let timer = null;
function view() {
  clearInterval(timer);
  app.innerHTML = '';
  const c = Kit.el(`<div class="k-card k-stack">
    <div class="big"><span class="lbl">いま出ると</span><span class="yen" id="yen"></span></div>
    <div class="stat"><div><span>停めてから</span><b id="el"></b></div><div><span>停めた時刻</span><b id="st"></b></div></div>
    <div class="nextup" id="nx"></div>
    <div class="f"><span class="k-label">このあとの料金</span><div class="tl" id="tl"></div></div>
    <div class="f"><span class="k-label">予算から逆算</span>
      <div class="budget"><input class="k-input" id="bud" inputmode="numeric" placeholder="1000">円以内で出られるのは<b id="budOut">−</b></div></div>
    <p class="upd" id="upd"></p></div>`);
  app.appendChild(c);
  const memo = Kit.el(`<div class="k-card k-stack">
    <div class="f"><span class="k-label">停めた場所</span>
      <input class="k-input" id="memo" placeholder="例：B2・青のC-15" value="${Kit.esc(cur.memo || '')}"></div>
    <div id="phBox"></div>
    <div class="f"><span class="k-label">料金の決まり</span>
      <div class="head-row"><p style="margin:0">${ruleText(cur.rule)}</p><button class="k-btn is-small" id="editRule">変える</button></div></div>
    <div id="signBox"></div>
    <button class="k-btn" id="done">出庫した（終わる）</button></div>`);
  app.appendChild(memo);
  $('editRule').onclick = editRule;
  $('memo').addEventListener('input', () => { cur.memo = $('memo').value; saveCur(); });
  $('phBox').appendChild(photoBox('停めた場所の写真', () => cur.photo, v => { cur.photo = v; saveCur(); }));
  $('signBox').appendChild(photoBox('料金の看板', () => cur.sign || '', v => { cur.sign = v; saveCur(); }));
  $('done').onclick = async () => {
    const m = (Date.now() - cur.start) / 60000;
    if (!(await Kit.ask(`${dur(m)} ・ ${yen(fee(cur.rule, m))}円で終わりますか？`, '終わる', '続ける'))) return;
    cur = null; Kit.store.set('parking:cur', null); clearInterval(timer); setup();
  };
  $('bud').value = Kit.store.get('parking:budget', '') || '';
  $('bud').addEventListener('input', () => { Kit.store.set('parking:budget', $('bud').value); tick(); });
  tick();
  timer = setInterval(tick, 15000);
}
function tick() {
  if (!cur) return;
  const r = cur.rule, now = Date.now(), m = (now - cur.start) / 60000, f = fee(r, m);
  const paid = !!r.price;
  ['nx', 'tl', 'bud'].forEach(id => $(id).closest('.f, .nextup').hidden = !paid);
  $('yen').innerHTML = paid ? `${yen(f)}<small>円</small>` : dur(m);
  $('yen').previousElementSibling.textContent = paid ? 'いま出ると' : '停めてから';
  $('el').textContent = dur(m);
  $('st').textContent = clock(cur.start);
  const ups = nextUps(r, m, 6);
  const nx = $('nx');
  if (ups.length) {
    const u = ups[0], at = cur.start + u.m * 60000, left = Math.max(0, Math.ceil((at - now) / 60000));
    const P = r.maxH * 60, capped = r.max && f - Math.floor(m / P) * r.max === r.max;
    nx.className = 'nextup' + (left <= 5 ? ' warn' : '');
    nx.innerHTML = capped
      ? `<span class="note">最大料金になっています。次に上がるのは</span><b>${clock(at)}（あと${dur(left)}）</b><span class="note">${yen(u.fee)}円になります</span>`
      : `<span class="note">次に料金が上がるのは</span><b>${clock(at)}（あと${dur(left)}）</b><span class="note">${yen(f)}円 → ${yen(u.fee)}円${left <= 5 ? '　もうすぐです' : ''}</span>`;
    $('tl').innerHTML = ups.map(x => `<div><span>${clock(cur.start + x.m * 60000)} から</span><span>${dur(x.m)}</span><b>${yen(x.fee)}円</b></div>`).join('');
  } else { nx.innerHTML = '<span class="note">しばらく料金は上がりません</span>'; $('tl').innerHTML = ''; }
  const b = parseInt(String($('bud').value).replace(/[^\d]/g, ''), 10);
  if (b >= 0 && $('bud').value !== '') {
    if (f > b) $('budOut').textContent = 'もう過ぎています';
    else { const over = nextUps(r, 0, 400).find(x => x.fee > b); $('budOut').textContent = over ? `${clock(cur.start + over.m * 60000)}まで` : 'ずっと'; }
  } else $('budOut').textContent = '−';
  $('upd').textContent = `${hm(new Date())} 時点`;
}
/* 写真は小さくして保存 */
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
      res(cv.toDataURL('image/jpeg', .72));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && cur) tick(); });
addEventListener('pageshow', () => { if (cur) tick(); });
cur ? view() : setup();
</script>
</body>
</html>
